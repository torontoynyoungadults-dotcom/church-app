<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/budget/budget.css">
</head>
<body>
<div class="bd" id="bd">
  <div class="bd-wrap">
    <div class="bd-top">
      <button class="bd-b sm" id="btnBack" type="button" aria-label="뒤로">‹ 뒤로</button>
      <h1 id="topTitle">수련회 · 선교 예산/정산<small id="topSub"></small></h1>
      <span class="bd-chip" id="meChip" style="display:none;"></span>
      <button class="bd-theme" id="btnTheme" type="button" aria-label="밝은 화면 / 어두운 화면" title="밝은 화면 / 어두운 화면"></button>
    </div>

    <!-- 1) 행사 목록 -->
    <section id="viewList">
      <div class="bd-tools">
        <select id="fltYear" aria-label="연도"></select>
        <select id="fltStatus" aria-label="상태"><option value="">모든 상태</option></select>
        <input type="text" id="fltText" placeholder="행사 이름 검색" style="max-width:220px;" aria-label="검색">
        <span class="sp"></span>
        <button class="bd-b pri" id="btnNewEvent" type="button" style="display:none;">＋ 새 행사</button>
      </div>
      <div class="bd-grid" id="evGrid"></div>
      <p class="bd-msg" id="listMsg"></p>
    </section>

    <!-- 2) 행사 상세 -->
    <section id="viewEvent" style="display:none;">
      <div class="bd-card" id="evHead"></div>
      <div class="bd-tiles" id="evTiles"></div>
      <div id="evFlow"></div>
      <div class="bd-tabs" id="evTabs" role="tablist"></div>
      <div id="tabBody"></div>
    </section>
  </div>

  <!-- 모달 · 알림 — .bd 안에 두어야 입력칸 · 색 변수(--g-*)가 그대로 적용됩니다 (Step 9: 예전에는 바깥에 있어 입력칸이 기본 회색 모양이었음) -->
  <div class="bd-modal" id="modal" role="dialog" aria-modal="true"><div class="bd-sheet" id="modalBody"></div></div>
  <div class="bd-toast" id="toast" role="status"></div>
</div>
<input type="file" id="fileXlsx" accept=".xlsx,.xls" style="display:none;">

<script>
/* v6.1 — 밝은/어두운 화면 (다른 페이지와 같은 ynTheme 설정) · Finance 탭 안에서 열 때(embed=1) */
(function () {
  var d = document.documentElement;
  try { if (/[?&]embed=1\b/.test(location.search) && window.top !== window) d.classList.add('bd-embed'); } catch (e) {}
  function paint() { var b = document.getElementById('btnTheme'); if (b) b.textContent = d.getAttribute('data-theme') === 'light' ? '🌙' : '☀️'; }
  document.addEventListener('DOMContentLoaded', function () {
    paint();
    var b = document.getElementById('btnTheme'); if (!b) return;
    b.addEventListener('click', function () {
      var light = d.getAttribute('data-theme') !== 'light';
      if (light) d.setAttribute('data-theme', 'light'); else d.removeAttribute('data-theme');
      try { localStorage.setItem('ynTheme', light ? 'light' : 'dark'); } catch (e) {}
      try { if (window.parent !== window) window.parent.postMessage({ type: 'yntheme', theme: light ? 'light' : 'dark' }, location.origin); } catch (e) {}
      paint();
    });
  });
  window.addEventListener('message', function (ev) {   // Finance(부모) 화면에서 밝기를 바꾸면 따라감
    if (ev.origin !== location.origin || !ev.data || ev.data.type !== 'yntheme') return;
    if (ev.data.theme === 'light') d.setAttribute('data-theme', 'light'); else d.removeAttribute('data-theme'); paint();
  });
})();
</script>
<script src="/budget/xlsx-io.js"></script>
<script src="/budget/budget.js"></script>
</body>
</html>
