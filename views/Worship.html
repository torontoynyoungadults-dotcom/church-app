<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* 찬양방송팀 허브 — 구조만 정의합니다. 색·여백·버튼은 Theme 이 맡습니다 */
  :root { --accent: #6C4FD3; --tone-rgb: 108,79,211; }
  * { box-sizing: border-box; }

  /* ---------- 주차 달력 ---------- */
  .weeks { display: flex; gap: 7px; padding: 0 12px 12px; overflow-x: auto; scrollbar-width: none; }
  .weeks::-webkit-scrollbar { display: none; }
  .wk {
    flex: 0 0 auto; width: 70px; padding: 10px 6px 9px; border-radius: var(--r-lg); cursor: pointer;
    background: var(--night-2); border: 1px solid var(--hair-night); text-align: center; font-family: inherit;
    transition: transform .1s;
  }
  .wk:active { transform: scale(.97); }
  .wk .mo { font-size: 10.5px; color: var(--night-sub); font-weight: 800; letter-spacing: .1em; }
  .wk .dy {
    font-size: 21px; font-weight: 800; color: var(--night-ink); line-height: 1.15; margin-top: 1px;
    font-variant-numeric: tabular-nums; letter-spacing: -0.03em;
  }
  .wk .st {
    font-size: 10.5px; color: var(--night-sub); margin-top: 4px; font-weight: 750;
    font-variant-numeric: tabular-nums;
  }
  .wk.on { background: var(--tone); border-color: var(--tone); }
  .wk.on .mo, .wk.on .st { color: rgba(255,255,255,.8); }
  .wk.on .dy { color: #fff; }
  .wk.now:not(.on) { border-color: rgba(var(--tone-rgb), .6); }
  .wk .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: #E0554C; margin-left: 3px; vertical-align: middle; }

  /* ---------- 연습 · 예배 ---------- */
  .whenbar { background: #fff; border: 1px solid var(--hair); border-radius: var(--r-md); box-shadow: var(--sh-1); }
  .when {
    display: flex; align-items: baseline; gap: 12px;
    padding: 13px 15px; border-top: 1px solid var(--hair);
  }
  .when:first-child { border-top: none; }
  .when .wl {
    font-size: 12px; font-weight: 800; color: var(--ink-3); flex: none; width: 78px;
    letter-spacing: .05em;
  }
  .when .wv { font-size: 16px; font-weight: 800; letter-spacing: -0.025em; flex: 1; min-width: 0; }

  .verse {
    background: linear-gradient(160deg, rgba(var(--tone-rgb), .09), rgba(var(--tone-rgb), .03));
    border: 1px solid rgba(var(--tone-rgb), .18); border-radius: var(--r-md);
    padding: 15px 16px;
  }
  .verse .vq { font-size: 17px; font-weight: 800; line-height: 1.75; letter-spacing: -0.025em; }
  .verse .vt { font-size: 18px; font-weight: 800; line-height: 1.55; letter-spacing: -0.025em; }
  .verse .vr { display: inline-block; margin-top: 6px; font-size: 14px; font-weight: 700; color: var(--tone); background: var(--tone-soft); border-radius: 12px; padding: 2px 10px; }
  .verse .vn { font-size: 15px; color: var(--ink-2); line-height: 1.8; margin-top: 9px; white-space: pre-wrap; }

  /* ---------- 편성표 ---------- */
  .lineup { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; grid-auto-flow: row dense; }
  /* 편성 — 간결형 (세션 · 싱어 · 방송을 나눠 한 줄씩) */
  .lu { margin: 0; }
  .lu + .lu { margin-top: 14px; }
  .lu .lh { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 800; letter-spacing: .12em; color: var(--ink-3); margin: 0 0 6px 2px; }
  .lu .lh:after { content: ''; flex: 1; height: 1px; background: var(--hair); }
  .lr { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--hair);
    padding: 8px 2px; font-family: inherit; color: inherit; }
  .lu .lr:last-of-type { border-bottom: none; }
  button.lr { cursor: pointer; }
  button.lr:active { background: var(--tone-soft); }
  .lr.open { background: var(--tone-soft); border-radius: 10px; }
  .lr .pl { flex: none; width: auto; min-width: 82px; padding-right: 6px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 750; color: var(--ink-2); white-space: nowrap; letter-spacing: -0.03em; }
  .lr .pl .si { width: 24px !important; height: 24px !important; border-radius: 7px !important; }
  .lr .pl .si svg { width: 15px !important; height: 15px !important; }
  .lr .pp { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px 10px; }
  .pe { display: inline-flex; align-items: center; gap: 7px; font-size: 16px; font-weight: 750; color: var(--ink-1); }
  .pe .fc { width: 40px !important; height: 40px !important; border-radius: 50% !important; font-size: 16px !important; flex: none; object-fit: cover;
    display: inline-flex !important; align-items: center; justify-content: center; background: var(--sunken); color: var(--ink-2); border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .pe.off { color: var(--bad); } .pe.off .fc { outline: 2px solid var(--bad); }
  .pe.guest { color: var(--tone); }
  .pe.none { color: var(--ink-4); font-weight: 500; font-size: 14.5px; }
  .lr .ed { flex: none; color: var(--ink-4); font-size: 18px; }
  .lu2 .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .lu2 .rows .lr { border-bottom: 1px solid var(--hair) !important; }
  .lu2 .rows .lr .pl { width: 66px; }
  .lu2 .rows .lr .ed { display: none; }
  .lu2 .rows .picker { grid-column: 1 / -1; }
  @media (max-width: 360px) { .lu2 .rows { grid-template-columns: 1fr; } }
  .unav { margin-top: 12px; font-size: 12.5px; color: var(--ink-3); line-height: 1.7; }
  .unav b { font-weight: 800; letter-spacing: .06em; color: var(--ink-3); margin-right: 4px; }
  .lineup .picker { grid-column: 1 / -1; margin-top: -2px; }
  .lineup2 .picker { margin: 4px 0 10px; }
  .sesbar { display: flex; gap: 6px; overflow-x: auto; margin: 10px 0 12px; padding-bottom: 2px; scrollbar-width: none; }
  .sesbar::-webkit-scrollbar { display: none; }
  .sesbar button { flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; border: 1px solid var(--hair-2); background: #fff;
    border-radius: 11px; padding: 7px 11px; font-family: inherit; cursor: pointer; }
  .sesbar button b { font-size: 14px; font-weight: 800; color: var(--ink-1); }
  .sesbar button span { font-size: 12px; color: var(--ink-3); font-weight: 600; }
  .sesbar button.on { background: var(--tone); border-color: var(--tone); }
  .sesbar button.on b, .sesbar button.on span { color: #fff; }
  .sesrow { display: grid; grid-template-columns: 1.3fr 1fr .8fr auto; gap: 6px; margin-bottom: 6px; align-items: center; }
  .sesrow input { min-width: 0; padding: 8px !important; font-size: 14.5px !important; }
  @media (max-width: 460px) { .sesrow { grid-template-columns: 1fr 1fr; } .sesrow input:first-child { grid-column: 1 / -1; } }
  .bulk .bkh, .bulk .bkr { display: grid; grid-template-columns: 20px 1fr .8fr 56px; gap: 6px; align-items: center; margin-bottom: 6px; }
  .bulk .bkh span { font-size: 12px; font-weight: 800; color: var(--ink-3); letter-spacing: .06em; }
  .bulk .bn { font-size: 13px; font-weight: 800; color: var(--ink-4); text-align: center; }
  .bulk input { padding: 9px 9px !important; font-size: 15.5px !important; min-width: 0; }
  .slot {
    background: #fff; border: 1px solid var(--hair); border-radius: var(--r-md);
    box-shadow: var(--sh-1); padding: 15px 15px 14px; text-align: left; font-family: inherit;
    color: inherit; width: 100%; display: block;
  }
  button.slot { cursor: pointer; transition: border-color .12s, transform .08s; }
  button.slot:active { transform: scale(.985); }
  .slot.wide { grid-column: 1 / -1; }
  .slot.open { border-color: var(--tone); box-shadow: 0 0 0 1px var(--tone) inset; }
  .slot .sh { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .slot .si {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    background: var(--tone-soft); color: var(--tone);
    display: flex; align-items: center; justify-content: center;
  }
  .slot .si svg { width: 20px; height: 20px; }
  .slot .sl {
    font-size: 16px; font-weight: 800; color: var(--ink-1);
    letter-spacing: -0.01em; flex: 1;
  }
  .slot .sn { display: flex; gap: 7px; flex-wrap: wrap; }

  /* 이름표 — 얼굴 사진과 함께 */
  .nm {
    display: inline-flex; align-items: center; gap: 9px;
    font-size: 17px; font-weight: 800; background: var(--canvas); border: 1px solid var(--hair);
    border-radius: 99px; padding: 4px 16px 4px 4px; white-space: nowrap; letter-spacing: -0.02em;
  }
  .nm .fc {
    width: 38px; height: 38px; border-radius: 50%; flex: none; object-fit: cover;
    background: #fff; display: inline-flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800; color: var(--tone); border: 1px solid var(--hair);
  }
  .nm.off { border-color: #E6C9C5; background: var(--bad-bg); color: var(--bad); }
  .nm.off .fc { border-color: #E6C9C5; color: var(--bad); }
  .nm.guest { border-style: dashed; color: var(--tone); background: var(--tone-soft); border-color: rgba(var(--tone-rgb), .34); }
  .nm.none {
    color: var(--ink-4); font-weight: 650; border-style: dashed; background: transparent;
    padding: 10px 18px; font-size: 16px;
  }

  /* 고르는 칸 */
  .picker {
    margin-top: 10px; background: #fff; border: 1px solid var(--tone);
    border-radius: var(--r-md); box-shadow: var(--sh-2); padding: 13px;
  }
  .picker .ph { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .picker .ph .pt { font-size: 15.5px; font-weight: 800; flex: 1; letter-spacing: -0.025em; }
  .pgroup { margin-bottom: 9px; }
  .pgroup .gl {
    font-size: 12px; font-weight: 800; color: var(--ink-3);
    letter-spacing: .06em; margin-bottom: 7px;
  }
  .pwrap { display: flex; gap: 5px; flex-wrap: wrap; }
  .pick {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 13px 5px 5px; font-size: 14.5px; font-weight: 750; font-family: inherit; cursor: pointer;
    background: #fff; border: 1px solid var(--hair-2); border-radius: 99px; color: var(--ink-2);
    transition: background .1s, border-color .1s, color .1s;
  }
  .pick .fc {
    width: 24px; height: 24px; border-radius: 50%; flex: none; object-fit: cover;
    background: var(--canvas); display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800; color: var(--tone); border: 1px solid var(--hair);
  }
  .pick.on .fc { border-color: rgba(255,255,255,.5); color: var(--tone); background: #fff; }
  .pick.on { background: var(--tone); border-color: var(--tone); color: #fff; }
  .pick.off { border-color: #E6C9C5; color: var(--bad); }
  .pick.off.on { background: var(--bad); border-color: var(--bad); color: #fff; }
  .pick i { font-style: normal; opacity: .6; font-size: 11.5px; margin-left: 4px; }

  /* ---------- 콘티 ---------- */
  .song { padding: 13px; margin-bottom: 8px; }
  .shead { display: flex; align-items: baseline; gap: 9px; margin-bottom: 5px; }
  .shead .no {
    width: 23px; height: 23px; border-radius: 50%; flex: none; background: var(--tone-soft);
    color: var(--tone); font-size: 13px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .shead .ti { font-size: 17px; font-weight: 800; flex: 1; min-width: 0; letter-spacing: -0.03em; }
  .badges { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .kb {
    font-size: 13px; font-weight: 800; background: var(--ink-1); color: #fff;
    border-radius: 7px; padding: 4px 10px; white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .kb.bpm { background: var(--sunken); color: var(--ink-2); }
  .smeta { font-size: 14px; color: var(--ink-3); line-height: 1.8; margin-top: 4px; }
  .smeta a { color: var(--tone); font-weight: 750; text-decoration: none; }
  .sform {
    font-size: 13.5px; color: var(--ink-2); margin-top: 8px; line-height: 1.7;
    background: #F7F5F2; border-radius: var(--r-xs); padding: 7px 11px; font-weight: 700;
    letter-spacing: .01em;
  }
  .snote { font-size: 14.5px; color: var(--ink-2); margin-top: 8px; white-space: pre-wrap; line-height: 1.85; }
  .plbar {
    display: flex; align-items: center; gap: 9px; background: #fff; border: 1px solid var(--hair);
    border-radius: var(--r-md); box-shadow: var(--sh-1); padding: 11px 13px; margin-bottom: 11px;
  }
  .plbar .pi {
    width: 28px; height: 28px; border-radius: 8px; flex: none; background: #FDECEC; color: #C4302B;
    display: flex; align-items: center; justify-content: center;
  }
  .plbar .pi svg { width: 15px; height: 15px; }
  .plbar a { flex: 1; font-size: 15px; font-weight: 750; color: var(--ink-1); text-decoration: none; word-break: break-all; }
  .plbar .none { flex: 1; font-size: 14.5px; color: var(--ink-3); }

  /* ---------- 악보 ---------- */
  .fileitem { display: flex; align-items: center; gap: 9px; padding: 9px 11px; margin-bottom: 6px; }
  .fileitem .ic {
    width: 30px; height: 30px; border-radius: 8px; flex: none; background: var(--tone-soft);
    color: var(--tone); font-size: 10.5px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .fileitem a { flex: 1; font-size: 15px; font-weight: 750; color: var(--ink-1); text-decoration: none; word-break: break-all; }
  .fileitem .by { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
  .pickbtn {
    display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%;
    padding: 12px; font-size: 14.5px; font-weight: 750; font-family: inherit; cursor: pointer;
    background: #fff; border: 1.5px dashed #C7C1B7; border-radius: var(--r-md); color: var(--tone);
    transition: border-color .15s, background .15s;
  }
  .pickbtn:hover { border-color: var(--tone); background: var(--tone-soft); }

  /* ---------- 댓글 ---------- */
  .cm { display: flex; gap: 10px; padding: 12px 0; border-top: 1px solid var(--hair); }
  .cm:first-of-type { border-top: none; }
  .cm .av {
    width: 30px; height: 30px; border-radius: 50%; flex: none; background: var(--tone-soft);
    color: var(--tone); font-size: 13.5px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .cm .cb { flex: 1; min-width: 0; }
  .cm .ch { display: flex; align-items: baseline; gap: 8px; }
  .cm .cn { font-size: 15px; font-weight: 800; }
  .cm .ct { font-size: 12px; color: var(--ink-4); font-variant-numeric: tabular-nums; }
  .cm .cx {
    border: none; background: none; color: var(--ink-4); font-size: 12.5px; font-weight: 750;
    cursor: pointer; font-family: inherit; padding: 0 2px; margin-left: auto;
  }
  .cm .cx:hover { color: var(--bad); }
  .cm .cc { font-size: 15px; line-height: 1.85; white-space: pre-wrap; margin-top: 4px; color: var(--ink-2); }

  .offlist { margin-top: 4px; }
  .offrow {
    display: flex; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--hair);
  }
  .offrow:first-child { border-top: none; }
  .offrow .od { font-size: 16px; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .offrow .or { flex: 1; font-size: 14.5px; color: var(--ink-3); min-width: 0; }

  .offbar {
    background: var(--bad-bg); border-radius: var(--r-md); padding: 12px 14px; margin-bottom: 13px;
    font-size: 14.5px; color: #8E2A10; line-height: 1.8;
  }
  .offbar b { color: #6E2009; }
  .editline { display: flex; justify-content: flex-end; gap: 6px; margin-top: 10px; }
  .sechead { display: flex; align-items: center; gap: 8px; margin-bottom: 13px; }
  .sechead .chip { margin: 0 !important; flex: 1; }

  /* 탭 6개 — 좁은 폰에서는 옆으로 밀어 봅니다 */
  #tabs { overflow-x: auto; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  #tabs button { flex: 1 0 auto; font-size: 14px !important; padding-left: 5px !important; padding-right: 5px !important; white-space: nowrap; }

  /* 팀원 관리 버튼 */
  #mgbar { display: flex; justify-content: flex-end; padding: 0 14px 8px; }
  #mgbar:empty { display: none; }
  .mgbtn {
    display: inline-flex; align-items: center; gap: 6px; font-family: inherit; cursor: pointer;
    font-size: 14px; font-weight: 750; color: #CFC8BE; background: var(--night-2);
    border: 1px solid var(--hair-night); border-radius: 99px; padding: 7px 13px;
  }
  .mgbtn svg { width: 16px; height: 16px; }
  .mgbtn.on { background: var(--tone); border-color: var(--tone); color: #fff; }
  .tmcount { font-size: 14px; font-weight: 800; color: var(--tone); }
  .tmrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--hair); }
  .tmrow:first-of-type { border-top: none; }
  .tmrow > .fc {
    width: 40px; height: 40px; border-radius: 50%; flex: none; object-fit: cover; background: var(--canvas);
    display: inline-flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800;
    color: var(--tone); border: 1px solid var(--hair);
  }
  .tmb { flex: 1; min-width: 0; }
  .tmn { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .tmr { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .rtag { font-size: 13px; font-weight: 750; color: var(--tone); background: var(--tone-soft); border-radius: 6px; padding: 2px 8px; }
  .rtag.none { color: var(--ink-4); background: var(--canvas); }
  .tmadd { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hair-2); }

  /* 공지사항 */
  .nt.pin { border: 1.5px solid rgba(var(--tone-rgb), .45) !important; }
  .nth { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .ntk { font-size: 12.5px; font-weight: 800; color: var(--tone); background: var(--tone-soft); border-radius: 6px; padding: 2px 8px; flex: none; }
  .ntk.m { color: #1D7A56; background: #E6F2EC; }
  .ntp { font-size: 12.5px; font-weight: 800; color: #fff; background: var(--tone); border-radius: 6px; padding: 2px 8px; flex: none; }
  .ntt { font-size: 18px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.5; flex: 1 1 100%; margin-top: 4px; }
  .ntm { display: flex; align-items: center; gap: 7px; margin: 8px 0 2px; font-size: 14px; color: var(--ink-3); }
  .ntm .fc {
    width: 24px; height: 24px; border-radius: 50%; object-fit: cover; background: var(--canvas); flex: none;
    display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: var(--tone);
  }
  .ntm b { color: var(--ink-1); font-weight: 750; }
  .ntb { font-size: 16px; line-height: 1.8; color: var(--ink-2); white-space: pre-wrap; word-break: break-word; margin-top: 10px; }
  .ntb.clip { max-height: 8.2em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
  .ntb a { color: var(--tone); font-weight: 700; }
  .ntarea { min-height: 220px; font-size: 16px !important; line-height: 1.8; }
  .ntpin { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; margin: 2px 0 12px; }
  .ntpin input { width: 18px; height: 18px; }
  .seclabel2 { font-size: 12.5px; color: #837D75; font-weight: 800; letter-spacing: .14em; margin: 16px 18px 8px; }
  .ssd .soon { font-size: 11.5px; color: #fff; background: var(--tone); border-radius: 5px; padding: 1px 6px; margin-left: 4px; }

  /* 좁은 화면에서는 이름표가 칸을 넘지 않게 */
  @media (max-width: 400px) {
    .nm { font-size: 16px; padding-right: 13px; }
    .nm .fc { width: 34px; height: 34px; }
  }
  .yc-sh .nm, .solo .nm, .ssw .fc { font-size: 16px; }
  .yc-sh .nm .fc { width: 30px; height: 30px; }

  /* ---------- 연습 녹음 ---------- */
  .recp { padding-bottom: 16px !important; }
  .rec {
    background: #fff; border: 1px solid var(--hair-2); border-radius: var(--r-md, 14px);
    box-shadow: var(--sh-1); padding: 12px 13px 11px; margin-bottom: 9px;
  }
  .rech { display: flex; align-items: center; gap: 11px; }
  .recic {
    width: 36px; height: 36px; border-radius: 11px; flex: none; color: #fff;
    background: linear-gradient(135deg, #2B2A28, #4A4541); display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
  }
  .recic svg { width: 17px; height: 17px; }
  .rect { flex: 1; min-width: 0; }
  .rect b { display: block; font-size: 16px; font-weight: 800; letter-spacing: -0.01em; word-break: break-word; }
  .rect span { display: block; font-size: 13px; color: var(--ink-3); margin-top: 1px; }
  .rec audio { width: 100%; height: 44px; margin-top: 10px; display: block; border-radius: 22px; background: #F1EFEB; }

      <button type="button" class="wkcal" onclick="openDatePick()" aria-label="달력에서 날짜 고르기" title="달력에서 고르기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8.5 3.5v3M15.5 3.5v3"/><circle cx="12" cy="14.5" r="1.3" fill="currentColor" stroke="none"/></svg>
      </button></div>
