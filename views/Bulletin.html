<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;0,800;1,700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="/vendor/qrcode.js"></script>
<style>
  :root {
    --bg: #0B0B0B; --card: #F1F1EF; --ink: #1C1C1C; --ink-2: #4A4744; --ink-3: #8C8883;
    --orange: #F26B21; --orange-2: #D2511F; --dark: #1C1C1C; --cell: #E3E3E1; --hair: #D9D7D3;
    --ed-bg: #F4F2EE; --ed-card: #FFFFFF; --ed-hair: #E6E2DB;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; color: var(--ink); background: var(--bg); }
  a { color: inherit; }
  .en { font-family: 'Montserrat', 'Noto Sans KR', sans-serif; }

  /* ================= 보기 ================= */
  .viewer { min-height: 100vh; background: var(--bg) url('/bulletin/bg.jpg') center top / cover fixed; }
  .viewer::before { content: ''; position: fixed; inset: 0; background: rgba(8,8,8,.55); pointer-events: none; }
  .vwrap { position: relative; max-width: 560px; margin: 0 auto; padding: 0 16px 40px; }
  .vtop { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 0 6px; }
  .vtop img { height: 34px; display: block; }
  .vtop .pick { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; max-width: 70%; }
  .vtop .pick label { font-size: 11px; color: #BDB8B1; letter-spacing: .04em; }
  .vtop select { max-width: 100%; background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(242,107,33,.7); border-radius: 10px; padding: 8px 10px; font: 700 13px 'Noto Sans KR', sans-serif; }
  .vtop select option { color: #111; }
  .vnav { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; margin: 0 -16px; padding-left: 16px; padding-right: 16px;
    background: linear-gradient(rgba(11,11,11,.96), rgba(11,11,11,.88)); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); scrollbar-width: none; }
  .vnav::-webkit-scrollbar { display: none; }
  .vnav a { flex: none; text-decoration: none; color: #D8D5D0; font-size: 13px; font-weight: 500; padding: 7px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,.14); white-space: nowrap; }
  .vnav a.on { background: var(--orange); border-color: var(--orange); color: #fff; font-weight: 700; }

  .sheet { padding: 34px 0 6px; scroll-margin-top: 54px; }
  .shead { text-align: center; color: #fff; margin-bottom: 16px; }
  .shead h2 { margin: 0; line-height: 1.05; font-weight: 900; color: var(--orange); letter-spacing: -.5px; }
  .shead h2 .ko { font-size: 30px; }
  .shead h2 .en { font-size: 22px; font-style: italic; color: #fff; font-weight: 700; margin-left: 6px; }
  .shead h2.big { font-family: 'Montserrat', sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0; }
  .shead .sub { margin-top: 8px; font-size: 14px; color: #EDEBE7; font-weight: 500; }
  .shead .sub b { font-weight: 700; color: #fff; }
  .shead .sub .bar { color: var(--orange); margin: 0 6px; }
  .shead .vn { margin-top: 4px; font-size: 12.5px; color: #CFCBC5; letter-spacing: .04em; }
  .shead .occ { display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 700; color: #fff; background: var(--orange); padding: 3px 12px; border-radius: 14px; }
  .card { background: var(--card); border-radius: 10px; padding: 18px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }

  /* 1. 예배 순서 */
  .ordhead { background: var(--dark); color: #fff; text-align: center; font-weight: 700; font-size: 15px; padding: 8px; border-radius: 4px; margin-bottom: 6px; }
  .ord { display: grid; grid-template-columns: 37% 1fr; gap: 5px; margin-bottom: 5px; }
  .ord .l { background: var(--dark); color: #fff; border-radius: 4px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 14px; padding: 9px 5px; font-weight: 500; word-break: keep-all; }
  .ord .v { background: var(--cell); border-radius: 4px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 14.5px; font-weight: 700; color: #3A3835; padding: 9px 10px; white-space: pre-line; line-height: 1.6; flex-direction: column; word-break: keep-all; }
  .ord .v .st { display: block; color: var(--orange-2); font-size: 16.5px; font-weight: 900; }
  .ord .l .dot, .stand .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--orange); margin-right: 6px; vertical-align: 1px; flex: none; }
  .stand { text-align: right; font-size: 12.5px; color: var(--ink-2); margin: 8px 2px 0; }
  .ord .v:empty::after { content: '—'; color: #B0ACA6; font-weight: 400; }
  .cleanup { margin-top: 12px; text-align: center; font-size: 13.5px; color: var(--ink-2); }
  .cleanup b { color: var(--ink); }

  /* 2. 성경 본문 */
  .vtitle { background: var(--dark); color: #fff; text-align: center; border-radius: 4px; padding: 10px 12px; margin-bottom: 14px; }
  .vtitle .t { font-size: 16px; font-weight: 700; }
  .vtitle .r { font-size: 12.5px; color: #CFCBC5; margin-top: 2px; }
  .verses { font-size: 15px; line-height: 1.85; color: #2B2926; }
  .verses p { margin: 0 0 4px; }
  .verses .n { color: var(--orange-2); font-weight: 700; margin-right: 5px; font-size: 13px; }
  .verses p.en { color: #6E6A65; font-size: 13.5px; line-height: 1.6; margin: 0 0 10px; font-style: italic; }
  .verses .ko + .en { margin-top: -2px; }
  .vtitle .ver { font-size: 11px; color: #BDB8B1; margin-top: 3px; letter-spacing: .05em; }

  /* 3. 셀모임 */
  .stitle { text-align: center; margin-bottom: 14px; }
  .stitle .t { color: var(--orange); font-size: 22px; font-weight: 700; }
  .stitle .r { color: var(--ink-2); font-size: 13px; }
  .ssec { margin: 16px 0 6px; display: flex; align-items: center; gap: 10px; }
  .ssec span { background: var(--dark); color: #fff; font-size: 13.5px; font-weight: 700; padding: 5px 14px; border-radius: 4px; flex: none; }
  .ssec i { flex: 1; height: 1.5px; background: #1C1C1C; }
  .sbody { font-size: 14.5px; line-height: 1.85; white-space: pre-wrap; color: #2B2926; }
  .pdfbox iframe { width: 100%; height: 72vh; border: 0; border-radius: 6px; background: #fff; }
  .btn-o { display: inline-flex; align-items: center; gap: 6px; background: var(--orange); color: #fff; text-decoration: none; font-weight: 700; font-size: 14px; padding: 10px 16px; border-radius: 10px; border: none; cursor: pointer; }
  .center { text-align: center; }

  /* 4. 소식 */
  .ann { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--hair); }
  .ann:last-child { border-bottom: 0; }
  .ann .tx { flex: 1; min-width: 0; font-size: 14px; line-height: 1.75; color: #2B2926; }
  .ann .tx b { display: block; font-size: 14.5px; color: var(--ink); }
  .ann .tx p { margin: 0; white-space: pre-wrap; }
  .ann .tx a.lk { color: var(--orange-2); font-weight: 700; font-size: 13px; text-decoration: none; word-break: break-all; }
  .ann .qr { flex: none; width: 96px; }
  .ann .qr img, .ann .qr svg { width: 96px; height: 96px; display: block; background: #fff; }
  .boxes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .box h4 { margin: 0 0 8px; text-align: center; color: var(--orange-2); font-size: 14px; border: 1.5px solid var(--orange); border-radius: 6px; padding: 5px; background: #fff; }
  .box .ls { font-size: 13px; line-height: 1.75; color: #2B2926; white-space: pre-line; }
  .box .ls b.evd { font-weight: 700; color: var(--ink); margin-right: 2px; }
  .nfbox { margin-top: 14px; background: #fff; border: 1.5px solid var(--orange); border-radius: 8px; padding: 12px 14px; }
  .nfbox h4 { margin: 0 0 6px; color: var(--orange-2); font-size: 14px; }
  .nfbox p { margin: 4px 0 0; font-size: 13.5px; line-height: 1.7; color: #2B2926; }
  .nfbox p b { display: block; font-size: 12px; color: var(--ink-3); }
  .box ol { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.7; color: #2B2926; }
  @media (max-width: 380px) { .boxes { grid-template-columns: 1fr; } }

  /* 5. 섬김이 */
  .grp { text-align: center; margin: 4px 0 22px; }
  .grp:last-child { margin-bottom: 4px; }
  .grp .pill { display: inline-block; background: var(--dark); color: #fff; border-radius: 22px; padding: 5px 16px; font-weight: 900; font-size: 16px; margin-bottom: 10px; }
  .grp .pill .en { color: var(--orange); font-size: 13px; font-weight: 700; margin-left: 4px; }
  .grp .ln { font-size: 14.5px; color: #6E6A65; line-height: 1.8; }
  .grp .inline { font-size: 14.5px; color: #6E6A65; line-height: 1.8; max-width: 380px; margin: 0 auto; }
  .note { border-top: 1px solid var(--hair); margin-top: 18px; padding-top: 14px; font-size: 13.5px; line-height: 1.75; color: var(--ink-2); white-space: pre-wrap; }
  .note b { display: block; color: var(--ink); margin-bottom: 2px; }

  .connect img { width: 100%; display: block; border-radius: 10px; }
  .vfoot { text-align: center; color: #9A958F; font-size: 12px; line-height: 1.9; margin-top: 30px; }
  .vfoot b { color: #C9C5BF; font-weight: 500; }
  .ynfoot { position: relative; text-align: center; color: #A7A29B; padding: 34px 16px 30px; font-size: 12.5px; line-height: 1.9; }
  .ynfoot .cw { font-family: 'Montserrat', sans-serif; font-weight: 800; color: var(--orange); font-size: 22px; letter-spacing: .01em; }
  .ynfoot .cw:before { content: ''; display: block; width: 28px; height: 2px; background: var(--orange); margin: 0 auto 10px; }
  .ynfoot .sl { color: #EDEBE7; font-size: 13.5px; margin: 2px 0 12px; }
  .ynfoot .ln { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; }
  .ynfoot a, .ynfoot span.i { color: #D8D5D0; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
  .ynfoot a:hover { color: #fff; }
  .ynfoot svg { width: 14px; height: 14px; flex: none; color: var(--orange); }
  .ynfoot .ch { margin-top: 12px; color: #8C8883; font-size: 11.5px; }
  .ynfoot .cp { margin-top: 8px; font-family: 'Montserrat', sans-serif; font-size: 10.5px; font-weight: 700; color: #6E6A65; letter-spacing: .03em; }
  .vempty { color: #D8D5D0; text-align: center; padding: 80px 20px; line-height: 1.8; }
  .vempty a { color: var(--orange); }

  /* ================= 편집 ================= */
  .editor { background: var(--ed-bg); min-height: 100vh; color: var(--ink); padding-bottom: 96px; }
  .etop { background: #1C1C1C; color: #fff; padding: 14px 16px 12px; }
  .etop .row { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .etop img { height: 28px; }
  .etop h1 { font-size: 17px; margin: 0; flex: 1; }
  .etop a.v { color: #F9B38D; font-size: 13px; text-decoration: none; font-weight: 700; }
  .ewrap { max-width: 760px; margin: 0 auto; padding: 14px 16px; }
  .ecard { background: var(--ed-card); border: 1px solid var(--ed-hair); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .ecard h3 { margin: 0 0 12px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .ecard h3 .s { font-size: 12px; font-weight: 500; color: var(--ink-3); }
  .ef { margin-bottom: 11px; }
  .ef label { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink-2); margin-bottom: 5px; }
  .ef .hint { font-size: 12px; color: var(--ink-3); margin: 4px 0 0; line-height: 1.5; }
  input[type=text], input[type=url], input[type=date], select, textarea {
    width: 100%; font: 15px 'Noto Sans KR', sans-serif; color: var(--ink); background: #fff; border: 1px solid #D8D3CB; border-radius: 9px; padding: 9px 11px; }
  textarea { min-height: 70px; resize: vertical; line-height: 1.6; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px rgba(242,107,33,.14); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 12px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: none; border: 1px solid var(--ed-hair); background: #fff; color: var(--ink-2); border-radius: 20px; padding: 8px 13px; font: 700 13px 'Noto Sans KR', sans-serif; cursor: pointer; }
  .tabs button.on { background: #1C1C1C; color: #fff; border-color: #1C1C1C; }
  .b { border: 1px solid #D8D3CB; background: #fff; color: var(--ink); border-radius: 9px; padding: 8px 12px; font: 700 13px 'Noto Sans KR', sans-serif; cursor: pointer; }
  .b.dark { background: #1C1C1C; color: #fff; border-color: #1C1C1C; }
  .b.or { background: var(--orange); color: #fff; border-color: var(--orange); }
  .b.sm { padding: 5px 9px; font-size: 12px; }
  .b.ic { width: 32px; height: 32px; padding: 0; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; }
  .b:disabled { opacity: .45; cursor: default; }
  .b.del { color: #B23A1B; }

  .oitem { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: start; border: 1px solid var(--ed-hair); border-radius: 12px; padding: 10px; margin-bottom: 8px; background: #FCFBF9; }
  .oitem.drag { opacity: .45; }
  .oitem.over { border-color: var(--orange); box-shadow: 0 0 0 2px rgba(242,107,33,.25); }
  .grip { cursor: grab; color: #B5AFA6; font-size: 16px; line-height: 34px; user-select: none; text-align: center; }
  .oitem .flds { display: grid; grid-template-columns: 34% 1fr; gap: 8px; }
  @media (max-width: 520px) { .oitem .flds { grid-template-columns: 1fr; } }
  .oitem textarea { min-height: 38px; }
  .oitem .ctl { display: flex; flex-direction: column; gap: 4px; }
  .evh, .evrow { display: grid; grid-template-columns: 96px 1fr 34px; gap: 6px; align-items: center; margin-bottom: 6px; }
  .evh span { font-size: 11.5px; font-weight: 700; color: var(--ink-3); }
  .evrow input { padding: 8px 9px; font-size: 14px; }
  .standck { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-2); margin: 6px 6px 0 2px; cursor: pointer; }
  .standck input { width: 15px; height: 15px; margin: 0; accent-color: var(--orange); }
  .standck .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; color: #1D7A56; background: #E3F2EA; border-radius: 10px; padding: 1px 7px; margin-left: 6px; }
  .rowbtns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .sub-item { border: 1px solid var(--ed-hair); border-radius: 12px; padding: 12px; margin-bottom: 8px; background: #FCFBF9; }
  .sub-item .hd { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .sub-item .hd b { flex: 1; font-size: 13px; color: var(--ink-3); }
  .person { display: grid; grid-template-columns: 1.1fr .8fr 1.2fr 1.1fr auto; gap: 6px; margin-bottom: 6px; }
  .person input { padding: 7px 8px; font-size: 14px; }
  @media (max-width: 560px) { .person { grid-template-columns: 1fr 1fr; } .person .b { grid-column: span 2; } }
  .radio { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .radio label { border: 1px solid #D8D3CB; border-radius: 20px; padding: 7px 13px; font-size: 13px; font-weight: 700; cursor: pointer; background: #fff; }
  .radio label.on { background: #1C1C1C; color: #fff; border-color: #1C1C1C; }
  .radio input { display: none; }
  .filebox { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; }
  .filebox a { color: var(--orange-2); font-weight: 700; }
  .sched { width: 100%; border-collapse: collapse; }
  .sched td { padding: 4px 3px; vertical-align: middle; }
  .sched td:first-child { width: 42%; }
  .sched td:last-child { width: 40px; }
  .msg { font-size: 13px; margin: 8px 0 0; min-height: 18px; }
  .msg.err { color: #B23A1B; } .msg.ok { color: #1D7A56; }
  .ebar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--ed-hair); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); z-index: 10; }
  .ebar .row { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
  .ebar .st { flex: 1; font-size: 12.5px; color: var(--ink-3); line-height: 1.4; min-width: 0; }
  .ebar .st b { color: var(--ink); }
  .pv { background: var(--bg) url('/bulletin/bg.jpg') center / cover; border-radius: 14px; padding: 0 14px 20px; overflow: hidden; }
  .pv .sheet { scroll-margin-top: 0; }
  .lock { max-width: 420px; margin: 0 auto; padding: 90px 22px; text-align: center; color: #fff; }
  .lock p { color: #D8D5D0; line-height: 1.8; }
  .datebar { display: flex; gap: 8px; align-items: flex-end; }
  .datebar .ef { flex: 1; margin: 0; }
  .ttl { font-size: 13px; color: var(--ink-3); margin-top: 8px; }
  .ttl b { color: var(--ink); }
  .stat { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 10px; padding: 1px 8px; margin-left: 6px; vertical-align: 1px; }
  .stat.pub { background: #E3F2EA; color: #1D7A56; } .stat.tmp { background: #FBEADF; color: #A8420F; } .stat.new { background: #EDEBE7; color: #55504A; }

  /* ================= 주보 — 본문 디자인 (Pretendard 고딕) ================= */
  .viewer, .pv, .pdfpage { font-family: 'Pretendard Variable', Pretendard, 'Noto Sans KR', -apple-system, sans-serif; }
  .viewer *, .pv *, .pdfpage * { font-family: inherit; }
  .viewer .shead h2.big, .pv .shead h2.big, .pdfpage .shead h2.big, .eyebrow, .rule, .ynfoot .cw, .ynfoot .cp { font-family: 'Montserrat', 'Pretendard Variable', sans-serif !important; }
  .card { background: #F8F6F2; border-radius: 16px; padding: 22px 18px 20px; box-shadow: 0 18px 40px rgba(0,0,0,.38); }
  .eyebrow { font-weight: 700; font-size: 11.5px; letter-spacing: .28em; color: var(--orange); margin-bottom: 6px; }
  .shead h2 .ko { font-weight: 700; color: #fff; font-size: 28px; letter-spacing: -.6px; }
  .shead h2 .en { display: block; margin: 6px 0 0; font-weight: 500; font-style: normal; font-size: 14px; color: #F7B58E; letter-spacing: .04em; }
  .shead h2.big { font-size: 34px; font-weight: 800; letter-spacing: .01em; }
  .rule { display: flex; align-items: center; gap: 10px; justify-content: center; margin: 0 0 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .26em; color: #9C958C; }
  .rule:before, .rule:after { content: ''; flex: 1; height: 1px; background: #DDD7CE; }

  /* 예배 순서 — 가운데 정렬 */
  .orow { text-align: center; padding: 11px 4px; border-bottom: 1px solid #E9E4DC; }
  .orow:last-of-type { border-bottom: none; }
  .orow .l { font-size: 12px; font-weight: 600; color: #9A948B; letter-spacing: .06em; display: flex; align-items: center; justify-content: center; }
  .orow .v { margin-top: 3px; font-size: 15.5px; font-weight: 500; color: #1F1D1B; white-space: pre-line; line-height: 1.55; word-break: keep-all; letter-spacing: -.2px; }
  .orow .v:empty { display: none; }
  .orow .dot, .stand .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--orange); margin-right: 6px; flex: none; }
  .sermon { margin: 4px -4px; padding: 16px 14px 15px; background: rgba(242,107,33,.07); border-radius: 12px; border-bottom: none; }
  .sermon .l { color: var(--orange-2); }
  .sermon .t { margin-top: 5px; font-size: 21px; font-weight: 700; color: var(--orange-2); line-height: 1.4; letter-spacing: -.5px; word-break: keep-all; }
  .sermon .p { margin-top: 4px; font-size: 14px; color: #5E5953; font-weight: 500; white-space: pre-line; }
  .stand { font-size: 11.5px; color: #9A948B; margin: 12px 0 0; display: flex; align-items: center; justify-content: center; }
  .cleanup { margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .cleanup .cb { background: var(--orange); color: #fff; border-radius: 8px; padding: 5px 11px; font-size: 12.5px; font-weight: 700; letter-spacing: .02em; }

    var head = sec.querySelector('.shead'), card = sec.querySelector('.card');
    // 나눌 수 있는 조각 — 성경 구절은 한 절(한글+영어)씩
    var units = [];
    [].slice.call(card.children).forEach(function (c) {
      if (c.classList.contains('verses')) {

        u.nodes.forEach(function (n) { last.appendChild(n); if (!added.length || added[0] !== last) added.push(n); });
      } else u.nodes.forEach(function (n) { cardEl.appendChild(n); added.push(n); });
      return added;
    };
    open();
    var count = 0;

function buildPdf(b) {

  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: [265.9, 483.4], compress: true });
  var i = 0, n = 0;
  var shot = function (el) {
    return window.html2canvas(el, { scale: 2.8, useCORS: true, backgroundColor: '#0B0B0B', logging: false, width: PW, height: PH, scrollX: 0, scrollY: 0, windowWidth: 1200 })
      .then(function (cv) {

        doc.addImage(cv.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 265.9, 483.4, undefined, 'FAST');
        n++;
      });
  };
  var next = function () {
    if (i >= pages.length) {
      stage.remove();
      doc.save('청년1부 주보 ' + String(b.date).split('-').join('.') + '.pdf');
      return;
    }
    pdfToast('PDF 만드는 중… (' + (i + 1) + '/' + pages.length + ')');

      return els.reduce(function (p, el) { return p.then(function () { return shot(el); }); }, Promise.resolve());

    return shot(it).then(next);
  };
  return ready.then(next).catch(function (e) { stage.remove(); throw e; });
}

/* 파일 올리기 (PDF · QR 이미지) */
function upFile(input, done, msgId) {
  var f = input.files && input.files[0];
  var m = el(msgId || 'upMsg');
  if (!f) return;
  if (f.size > 20 * 1024 * 1024) { m.className = 'msg err'; m.textContent = '20MB 이하 파일만 올릴 수 있습니다.'; return; }
  m.className = 'msg'; m.textContent = '올리는 중… (' + Math.round(f.size / 1024) + 'KB)';
  var rd = new FileReader();
  rd.onload = function () {
    callServer('uploadBulletinFile', [TOKEN, B.date, f.name, rd.result], function (r) {
      done(r); markDirty(); paintPane();
    }, function (e) { m.className = 'msg err'; m.textContent = e.message || '올리지 못했습니다.'; });
  };
  rd.readAsDataURL(f);
}

var EM_LAST = null;
document.addEventListener('focusin', function (e) {
  var t = e.target;
  if (t && (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && t.type === 'text')) && t.closest && t.closest('#ePane')) EM_LAST = t;
});
function emWrap(mark) {
  var t = EM_LAST;
  if (!t || !document.body.contains(t)) { alert('먼저 강조할 칸에서 글자를 드래그해 골라주세요.'); return; }
  var a = t.selectionStart, z = t.selectionEnd;
  if (a == null || a === z) { alert('강조할 글자를 드래그해 골라주세요.'); t.focus(); return; }
  var open = mark === '**==' ? '**==' : mark, close = mark === '**==' ? '==**' : mark;
  var v = t.value, sel = v.slice(a, z);
  // 이미 같은 표시로 감싸져 있으면 풀어줍니다
  if (v.slice(a - open.length, a) === open && v.slice(z, z + close.length) === close) {
    t.value = v.slice(0, a - open.length) + sel + v.slice(z + close.length);
    t.setSelectionRange(a - open.length, z - open.length);
  } else {
    t.value = v.slice(0, a) + open + sel + close + v.slice(z);
    t.setSelectionRange(a + open.length, z + open.length);
  }
  t.dispatchEvent(new Event('input', { bubbles: true }));
  t.focus();
}

  }, function (e) { m.className = 'msg err'; m.textContent = e.message; });
}

/* 미리보기 */
function panePreview() {
  return '<p style="text-align:right;margin:0 0 10px;"><button type="button" class="b" onclick="bulletinPdf(B)">PDF 저장 (26.59 × 48.34 cm)</button></p>' +
    '<div class="pv">' + renderBulletin(B, 'pv-') + ynFooter() + '</div>';
}

if (P.edit) startEditor(); else startViewer();
