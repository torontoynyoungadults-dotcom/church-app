<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap');
/* =========================================================
   토론토영락교회 청년1부 — 공용 디자인 시스템
   ---------------------------------------------------------
   모든 페이지가 이 파일 하나로 같은 마감을 갖습니다.
   페이지는 강조색(--accent, --tone-rgb)과 자기만의 구조만 정의하고,
   색·여백·글자·버튼·카드는 여기에서 결정됩니다.
   (각 페이지의 <style> 다음에 로드되므로 여기 규칙이 이깁니다)
   ========================================================= */

:root {
  /* 강조색 — 페이지에서 --accent 와 --tone-rgb 로 정합니다.
     (--tone-rgb 는 여기서 값을 정하지 않습니다. 정해버리면 페이지 설정을 덮어씁니다) */
  --tone: var(--accent, #D2511F);
  --tone-soft: rgba(var(--tone-rgb, 210,81,31), .10);
  --tone-line: rgba(var(--tone-rgb, 210,81,31), .28);

  /* 글자 */
  --ink-1: #1A1917;
  --ink-2: #4A4640;
  --ink-3: #8B857C;
  --ink-4: #B3ADA4;

  /* 면 */
  --surface: #FFFFFF;
  --canvas: #F4F2EE;
  --sunken: #EAE7E1;
  --night: #0C0C0C;
  --night-2: #171716;
  --night-3: #242322;
  --night-ink: #E8E4DE;
  --night-sub: #8A847C;

  /* 선 */
  --hair: rgba(26, 25, 23, .09);
  --hair-2: rgba(26, 25, 23, .15);
  --hair-night: rgba(255, 255, 255, .09);

  /* 상태색 */
  --good: #1D7A56;  --good-bg: #E6F2EC;
  --warn: #8A5E12;  --warn-bg: #FBF2E1;
  --bad:  #A82F16;  --bad-bg:  #FBEADF;

  /* 그림자 */
  --sh-1: 0 1px 2px rgba(26,25,23,.05);
  --sh-2: 0 2px 8px rgba(26,25,23,.06), 0 1px 2px rgba(26,25,23,.04);
  --sh-3: 0 10px 30px rgba(26,25,23,.11), 0 2px 6px rgba(26,25,23,.05);

  /* 모서리 */
  --r-xs: 8px; --r-sm: 10px; --r-md: 13px; --r-lg: 17px; --r-xl: 21px;

  /* 예전 이름들 — 기존 페이지가 그대로 돌아가도록 새 토큰에 연결합니다 */
  --ink: var(--ink-1);
  --muted: var(--ink-3);
  --line: var(--hair-2);
  --paper: var(--surface);
  --panel: var(--canvas);
  --chip: var(--ink-1);
  --orange: var(--tone);
  --danger: var(--bad);
  --low: var(--bad);
  --mid: #B14A12;
  --mid-bg: var(--bad-bg);
  --absent: var(--bad);
  --absent-bg: var(--bad-bg);
  --accent-soft: var(--tone-soft);
  --accent-deep: var(--tone);
}

/* ---------------------------------------------------------
   바탕
   --------------------------------------------------------- */
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink-1);
  line-height: 1.62;
  letter-spacing: -0.006em;
  font-feature-settings: "tnum" 1, "case" 1;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body, input, select, textarea, button {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo",
               "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
}
* { -webkit-tap-highlight-color: transparent; }
/* 주보와 같은 검은 지도 바탕 — 화면에 고정 (아이폰에서도 고정되도록 가상 요소로) */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(rgba(8,8,8,.5), rgba(8,8,8,.62)), url('/bulletin/bg.jpg') center top / cover no-repeat;
}
.shell { max-width: 680px; margin: 0 auto; }

/* ---------------------------------------------------------
   머리말
   --------------------------------------------------------- */
header {
  padding: 38px 22px 28px !important;
  text-align: center;
  position: relative;
}
header:after {
  content: ""; position: absolute; left: 50%; bottom: 15px; transform: translateX(-50%);
  width: 24px; height: 2px; border-radius: 2px; background: var(--tone); opacity: .9;
}
header img {
  height: 36px !important; display: block; margin: 0 auto 16px !important; opacity: .95;
}
header h1 {
  font-size: 27px !important; font-weight: 800 !important; margin: 0 !important;
  letter-spacing: -0.035em !important; line-height: 1.18 !important;
  color: var(--tone) !important;
}
header .meta, header .sub {
  font-size: 10.5px !important; color: var(--night-sub) !important;
  letter-spacing: 0.2em !important; text-transform: uppercase;
  margin: 9px 0 0 !important; font-weight: 700 !important;
}

/* ---------------------------------------------------------
   패널 — 화면의 기본 단위
   --------------------------------------------------------- */
.panel {
  background: var(--canvas) !important;
  border: 1px solid var(--hair);
  border-radius: var(--r-xl) !important;
  box-shadow: var(--sh-2);
  padding: 21px 18px !important;
  margin: 0 12px 12px !important;
}
.panel.flush { padding: 0 !important; overflow: hidden; }

/* 검은 바탕 위 카드 (요약 · 안내) */
.panel.dark, .hero {
  background: var(--night-2) !important;
  border: 1px solid var(--hair-night) !important;
  color: var(--night-ink);
  border-radius: var(--r-xl) !important;
  box-shadow: none;
  padding: 20px 19px !important;
  margin: 0 12px 12px !important;
}
.panel.dark .chip, .hero .chip { color: var(--night-ink) !important; }
.panel.dark .sub, .hero .sub,
.panel.dark .hint, .hero .hint { color: var(--night-sub) !important; }

/* ---------------------------------------------------------
   구역 이름
   --------------------------------------------------------- */
.chip {
  display: inline-block;
  background: transparent !important;
  color: var(--ink-1) !important;
  font-size: 14.5px !important;
  font-weight: 800 !important;
  letter-spacing: -0.015em !important;
  text-transform: none !important;
  padding: 0 0 0 12px !important;
  border-radius: 0 !important;
  margin: 0 0 13px !important;
  line-height: 1.5 !important;
  position: relative;
}
.chip:before {
  content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 3.5px; height: 16px; border-radius: 2px; background: var(--tone);
}
.chip .req, .req { color: var(--tone) !important; margin-left: 3px; font-weight: 800; }

/* 작은 소제목 */
.sect, .cap {
  font-size: 11px; font-weight: 800; color: var(--ink-3);
  letter-spacing: 0.07em; text-transform: uppercase;
  margin: 15px 0 7px;
}
.detail .sect:first-child { margin-top: 3px; }

/* ---------------------------------------------------------
   보조 문구
   --------------------------------------------------------- */
.hint, .sub, .lede, .fnote, .empty, .allgood, .empty-info {
  color: var(--ink-3) !important;
}
.hint, .lede { font-size: 12.5px !important; line-height: 1.78 !important; }
.hint { margin: -4px 0 14px; }
.sub { font-size: 12.5px !important; line-height: 1.6 !important; }
.fnote { font-size: 11.5px !important; line-height: 1.7 !important; margin: 6px 0 0; }
.empty, .allgood, .empty-info {
  font-size: 13px !important; text-align: center; padding: 18px 0;
}

/* 알림 문구 */
.msg { font-size: 12.5px; margin: 9px 0 0; min-height: 17px; line-height: 1.7; }
.msg.err, .err { color: var(--bad) !important; font-weight: 650; }
.msg.ok, .ok { color: var(--good) !important; font-weight: 650; }

/* ---------------------------------------------------------
   입력
   --------------------------------------------------------- */
input, select, textarea {
  width: 100%;
  padding: 11px 13px;
  font-size: 14px;
  font-family: inherit;
  color: var(--ink-1);
  background: var(--surface);
  border: 1px solid var(--hair-2) !important;
  border-radius: var(--r-sm) !important;
  box-shadow: var(--sh-1);
  outline: none;
  -webkit-appearance: none; appearance: none;
  transition: border-color .15s, box-shadow .15s;
}
input[type="checkbox"], input[type="radio"] { width: auto; }
input:focus, select:focus, textarea:focus {
  border-color: var(--tone) !important;
  box-shadow: 0 0 0 3px rgba(var(--tone-rgb, 210,81,31), .15);
}
input::placeholder, textarea::placeholder { color: var(--ink-4); }
input:disabled, select:disabled, textarea:disabled {
  background: var(--sunken); color: var(--ink-3); box-shadow: none;
}
textarea { resize: vertical; min-height: 66px; line-height: 1.68; }
select {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%238B857C' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/></svg>") !important;
  background-repeat: no-repeat !important;
  background-position: right 12px center !important;
  background-size: auto !important;
  padding-right: 32px !important;
}

/* 입력 한 칸 */
.f { margin-bottom: 11px; }
.f > label, .lbl, .fl {
  display: block;
  font-size: 10.5px; color: var(--ink-3); font-weight: 800;
  letter-spacing: 0.06em; text-transform: uppercase;
  margin-bottom: 5px;
}
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.addrow { display: flex; gap: 7px !important; }
.addrow input, .addrow select { flex: 1; min-width: 0; }

/* ---------------------------------------------------------
   버튼
   --------------------------------------------------------- */
.btn {
  padding: 10px 15px;
  font-size: 13.5px; font-weight: 700 !important; font-family: inherit;
  color: var(--ink-1);
  background: var(--surface);
  border: 1px solid var(--hair-2) !important;
  border-radius: var(--r-sm) !important;
  box-shadow: var(--sh-1);
  cursor: pointer; white-space: nowrap;
  transition: background .15s, border-color .15s, color .15s, transform .08s;
}
.btn:active { transform: translateY(.5px) scale(.995); }
.btn.mini { padding: 6px 11px; font-size: 12px; }
.btn.full { width: 100%; }
.btn.accent, .btn.orange {
  background: var(--tone) !important; color: #fff !important;
  border-color: transparent !important; box-shadow: var(--sh-2);
}
.btn.dark {
  background: var(--ink-1) !important; color: #fff !important;
  border-color: transparent !important; box-shadow: var(--sh-2);
}
.btn.ghost {
  background: transparent !important; box-shadow: none;
  border-color: var(--hair-2) !important; color: var(--ink-2);
}
.btn.danger {
  color: var(--bad) !important; background: var(--surface) !important;
  border-color: rgba(168,47,22,.24) !important;
}
.btn:disabled { opacity: .45; cursor: default; }

/* 제출 버튼 */
.submit, .pwsubmit, .dirbtn {
  width: 100%;
  padding: 15px !important;
  font-size: 15px !important; font-weight: 800 !important; font-family: inherit;
  color: #fff !important; background: var(--tone) !important;
  border: none !important; border-radius: var(--r-md) !important;
  box-shadow: 0 6px 18px rgba(var(--tone-rgb, 210,81,31), .24);
  cursor: pointer; letter-spacing: -0.015em;
  transition: transform .08s, box-shadow .15s, opacity .15s;
}
.submit:active, .pwsubmit:active, .dirbtn:active { transform: translateY(1px); }
.submit:disabled, .pwsubmit:disabled, .dirbtn:disabled {
  background: #C3BDB4 !important; box-shadow: none; cursor: not-allowed;
}

.pwlink {
  background: none; border: none; font-family: inherit; cursor: pointer;
  color: var(--ink-3) !important; font-size: 12.5px; text-decoration: none !important;
  border-bottom: 1px solid var(--hair-2); padding: 2px 0 !important;
  transition: color .15s, border-color .15s;
}
.pwlink:hover { color: var(--tone) !important; border-color: var(--tone); }

/* ---------------------------------------------------------
   목록 · 카드
   --------------------------------------------------------- */
.card, .nfcard, .mcard, .dcard, .mrow, .song, .fileitem, .msrow {
  background: var(--surface);
  border: 1px solid var(--hair) !important;
  border-radius: var(--r-md) !important;
  box-shadow: var(--sh-1);
}
.row {
  display: flex; align-items: center; gap: 10px !important;
  padding: 13px 3px !important;
  border-top: 1px solid var(--hair);
}
.row:first-of-type { border-top: none; }
.name, .nfname, .mname, .dname, .tname {
  font-size: 15px !important; font-weight: 750 !important; letter-spacing: -0.018em;
}

/* 이름표 · 상태표 */
.tag, .rolepill, .ratebadge, .badge, .owner, .nmpill {
  display: inline-block;
  font-size: 11.5px !important; font-weight: 750;
  padding: 4px 10px !important;
  border-radius: var(--r-xs);
  letter-spacing: 0.005em;
  font-variant-numeric: tabular-nums;
  box-shadow: none !important;
}
.tag { background: var(--sunken); color: var(--ink-2); }
.tag.good, .badge.good { background: var(--good-bg); color: var(--good); }
.tag.warn, .badge.warn { background: var(--warn-bg); color: var(--warn); }
.tag.bad, .badge.bad, .tag.low { background: var(--bad-bg); color: var(--bad); }
.rolepill { background: var(--ink-1) !important; color: #fff !important; font-size: 11px !important; }
.rolepill.none, .rolepill.soft { background: var(--sunken) !important; color: var(--ink-3) !important; }
.pct {
  font-size: 15px !important; font-weight: 800 !important;
  font-variant-numeric: tabular-nums; letter-spacing: -0.025em; color: var(--ink-1) !important;
}
.bar { height: 6px !important; border-radius: 99px; background: var(--sunken); max-width: 120px; overflow: hidden; }
.bar > span, .bar > i { display: block; height: 100%; background: var(--tone); border-radius: 99px; }

/* 값 나열 */
.grid, .kvgrid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px 13px;
}
.field .fk, .fk { font-size: 10.5px; color: var(--ink-3) !important; font-weight: 750; letter-spacing: .03em; }
.field .fv, .fv { font-size: 13.5px; margin-top: 1px; color: var(--ink-1); }

/* ---------------------------------------------------------
   숫자 요약
   --------------------------------------------------------- */
.stats {
  display: grid !important; gap: 9px !important;
  grid-template-columns: repeat(3, minmax(0,1fr)) !important;
}
.stat, .moodbox, .facebox {
  background: var(--surface) !important;
  border: 1px solid var(--hair) !important;
  border-radius: var(--r-md) !important;
  box-shadow: var(--sh-1);
  padding: 15px 11px !important;
  text-align: center;
}
.stat .v {
  font-size: 26px !important; font-weight: 800;
  font-variant-numeric: tabular-nums; letter-spacing: -0.04em !important;
  color: var(--tone) !important; line-height: 1.12;
}
.stat .k, .moodbox .l, .facebox .l {
  font-size: 10.5px !important; font-weight: 750; color: var(--ink-3) !important;
  letter-spacing: 0.04em; line-height: 1.45 !important; margin-top: 3px;
}
.moodbar { display: flex !important; gap: 8px !important; flex-wrap: wrap; }
.moodbar > * { flex: 1 1 0; min-width: 0; }
.moodbox, .facebox {
  display: flex !important; flex-direction: column;
  align-items: center !important; justify-content: center; gap: 4px;
  padding: 14px 10px !important;
}
.moodbox .n, .facebox .n {
  font-size: 23px !important; line-height: 1;
  font-variant-numeric: tabular-nums; letter-spacing: -0.03em !important; color: var(--ink-1) !important;
}
.moodbox .l, .facebox .l { text-transform: none !important; word-break: keep-all; }
.moodbox .cnt {
  font-size: 10.5px; color: var(--ink-3); font-weight: 650;
  font-variant-numeric: tabular-nums;
}

/* ---------------------------------------------------------
   탭 (검은 바탕 위)
   --------------------------------------------------------- */
.tabs {
  display: flex; gap: 3px !important;
  background: var(--night-2);
  border: 1px solid var(--hair-night);
  padding: 4px !important;
  border-radius: 14px;
  margin: 0 12px 12px !important;
}
.tabs button {
  flex: 1; min-width: 0;
  padding: 10px 6px !important;
  font-size: 12.5px !important; font-weight: 700 !important; font-family: inherit;
  letter-spacing: -0.015em;
  border: none !important; background: transparent !important;
  color: var(--night-sub) !important;
  border-radius: 10px !important; cursor: pointer;
  transition: background .15s, color .15s;
}
.tabs button.on {
  background: var(--canvas) !important; color: var(--ink-1) !important;
  box-shadow: var(--sh-1);
}

/* ---------------------------------------------------------
   선택형 (이모지 카드)
   --------------------------------------------------------- */
.picklist { display: grid; gap: 7px; }
.picklist button {
  display: flex !important; align-items: center !important; gap: 12px;
  width: 100%; text-align: left;
  padding: 12px 14px !important;
  font-family: inherit; cursor: pointer;
  background: var(--surface) !important;
  border: 1px solid var(--hair-2) !important;
  border-radius: var(--r-md) !important;
  box-shadow: var(--sh-1);
  transition: border-color .13s, background .13s, transform .08s;
}
.picklist button:active { transform: scale(.994); }
.picklist button.picked {
  border-color: var(--tone) !important;
  background: rgba(var(--tone-rgb, 210,81,31), .055) !important;
  box-shadow: 0 0 0 1px var(--tone) inset;
}
.picklist button .emo {
  width: 24px; flex: none; text-align: center; line-height: 1; font-size: 19px;
  display: inline-flex; align-items: center; justify-content: center;
}
.picklist button .t { min-width: 0; }
.picklist button .t b {
  display: block; font-size: 14px; font-weight: 750; letter-spacing: -0.018em; margin-bottom: 1px;
}
.picklist button .t span { display: block; font-size: 12px; color: var(--ink-3); line-height: 1.5; }

/* ---------------------------------------------------------
   안내 박스
   --------------------------------------------------------- */
.notice, .banner, .callout, .subnotice {
  background: var(--surface) !important;
  border: 1px solid var(--hair) !important;
  border-left: 3px solid var(--tone) !important;
  border-radius: var(--r-md) !important;
  box-shadow: var(--sh-1);
  padding: 14px 16px !important;
  margin-bottom: 16px !important;
}
.notice .lead, .banner .lead { font-size: 14px !important; font-weight: 800; margin: 0 0 6px !important; }
.notice p, .banner p { font-size: 12.5px !important; color: var(--ink-2) !important; margin: 0; line-height: 1.75; }

.warnbox {
  background: var(--bad-bg); border-radius: var(--r-md);
  padding: 12px 14px; font-size: 12.5px; color: #8E2A10; line-height: 1.72;
}
.warnbox b { color: #6E2009; }
.okbox {
  background: var(--good-bg); border-radius: var(--r-md);
  padding: 12px 14px; font-size: 12.5px; color: #145C40; line-height: 1.72;
}

/* ---------------------------------------------------------
   펼침
   --------------------------------------------------------- */
.caret, .cv { color: var(--tone) !important; opacity: .7; }
.detail { animation: ynfade .18s ease-out; }
@keyframes ynfade { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }

/* ---------------------------------------------------------
   비밀번호 · 잠금 화면
   --------------------------------------------------------- */
.pwbox {
  width: 190px !important; margin: 0 auto !important; display: block;
  text-align: center; font-size: 22px !important; font-weight: 700;
  letter-spacing: 0.3em; text-indent: 0.3em; font-variant-numeric: tabular-nums;
  border-radius: var(--r-md) !important; box-shadow: var(--sh-2) !important;
  padding: 14px 10px !important;
}
.pwbox::placeholder { letter-spacing: 0.3em; color: var(--ink-4); font-weight: 500; }
.pwsubmit {
  width: 190px !important; margin: 10px auto 0 !important; display: block;
  padding: 13px !important; font-size: 14.5px !important;
}

/* ---------------------------------------------------------
   기다림
   --------------------------------------------------------- */
.skel {
  background: linear-gradient(90deg, #E9E6E0 25%, #F6F4F1 50%, #E9E6E0 75%) !important;
  background-size: 200% 100% !important;
  border-radius: var(--r-sm) !important;
  animation: ynshimmer 1.15s infinite;
  display: block;
}
.skel.line { height: 13px; margin-bottom: 9px; }
@keyframes ynshimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* ---------------------------------------------------------
   꼬리말
   --------------------------------------------------------- */
footer {
  text-align: center;
  padding: 28px 20px 42px !important;
  font-size: 10.5px !important;
  color: #57534E !important;
  letter-spacing: 0.02em;
  line-height: 1.95 !important;
}
/* 모든 페이지 공통 꼬리말 — Connect with us */
footer.ynfoot { padding: 38px 16px 40px !important; font-size: 12.5px !important; color: #A7A29B !important; line-height: 1.9 !important; letter-spacing: 0; }
.ynfoot .cw { font-family: 'Montserrat', sans-serif; font-weight: 800; color: #F26B21; font-size: 22px; letter-spacing: .01em; line-height: 1.2; }
.ynfoot .cw:before { content: ''; display: block; width: 28px; height: 2px; background: #F26B21; margin: 0 auto 10px; }
.ynfoot .sl { color: #EDEBE7; font-size: 13.5px; margin: 4px 0 12px; }
.ynfoot .ln { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 14px; }
.ynfoot a { color: #D8D5D0 !important; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
.ynfoot a:hover { color: #fff !important; }

<script>
/**
 * 사진 자르기 — 정사각형으로 맞춰서 800px JPEG(dataURL)로 돌려줍니다.
 * 드래그로 위치, 슬라이더·두 손가락으로 확대. "자르지 않고"는 원본 비율 그대로.
 * done(dataUrl) / 취소하면 done(false) / 읽기 실패 done(null)
 */
function cropImage(file, done) {
  var rd = new FileReader();
  rd.onload = function () {
    var img = new Image();
    img.onload = function () { openCropper_(img, done); };
    img.onerror = function () { done(null); };
    img.src = rd.result;
  };
  rd.onerror = function () { done(null); };
  rd.readAsDataURL(file);
}

function openCropper_(img, done) {
  var box = document.getElementById('cropper');
  if (!box) {
    box = document.createElement('div');
    box.id = 'cropper';
    box.innerHTML = '<div class="ctitle">사진 맞추기</div>' +
      '<div class="chint">끌어서 위치를 옮기고, 아래 막대로 확대하세요</div>' +
      '<div class="cview"><img alt=""></div>' +
      '<div class="czoom"><span>－</span><input type="range" min="1" max="4" step="0.01" value="1"><span>＋</span></div>' +
      '<div class="cbtns"><button type="button" data-a="cancel">취소</button>' +
      '<button type="button" data-a="raw">자르지 않고</button>' +
      '<button type="button" class="go" data-a="ok">완료</button></div>';
    document.body.appendChild(box);
  }
  var view = box.querySelector('.cview'), pic = view.querySelector('img'), zoom = box.querySelector('input');
  var V = Math.min(320, Math.round(window.innerWidth * 0.8));
  view.style.width = V + 'px'; view.style.height = V + 'px';
  pic.src = img.src;

  var W = img.naturalWidth || img.width, H = img.naturalHeight || img.height;
  var base = V / Math.min(W, H);        // 확대 1배 = 빈틈 없이 꽉 참
  var z = 1, x = (V - W * base) / 2, y = (V - H * base) / 2;
  zoom.value = 1;

  function clamp() {
    var s = base * z;
    x = Math.min(0, Math.max(V - W * s, x));
    y = Math.min(0, Math.max(V - H * s, y));
  }
  function draw() { clamp(); pic.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + (base * z) + ')'; }
  function setZoom(nz, cx, cy) {
    nz = Math.max(1, Math.min(4, nz));
    var s0 = base * z, s1 = base * nz;
    x = cx - (cx - x) * (s1 / s0); y = cy - (cy - y) * (s1 / s0);
    z = nz; zoom.value = nz; draw();
  }
  draw();

  var pts = {}, last = null, pinch = null;
  view.onpointerdown = function (e) {
    view.setPointerCapture(e.pointerId);
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(pts);
    if (ids.length === 2) {
      var a = pts[ids[0]], b = pts[ids[1]];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: z };
    }
    last = { x: e.clientX, y: e.clientY };
  };
  view.onpointermove = function (e) {
    if (!pts[e.pointerId]) return;
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(pts);
    if (ids.length === 2 && pinch) {
      var a = pts[ids[0]], b = pts[ids[1]], r = view.getBoundingClientRect();
      setZoom(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
      return;
    }
    x += e.clientX - last.x; y += e.clientY - last.y;
    last = { x: e.clientX, y: e.clientY };
    draw();
  };
  view.onpointerup = view.onpointercancel = function (e) {
    delete pts[e.pointerId];
    if (Object.keys(pts).length < 2) pinch = null;
    var rest = Object.keys(pts);
    last = rest.length ? pts[rest[0]] : null;
  };
  view.onwheel = function (e) {
    e.preventDefault();
    var r = view.getBoundingClientRect();
    setZoom(z * (e.deltaY < 0 ? 1.08 : 0.93), e.clientX - r.left, e.clientY - r.top);
  };
  zoom.oninput = function () { setZoom(Number(zoom.value), V / 2, V / 2); };

  function close(result) { box.className = ''; pic.src = ''; done(result); }
  box.querySelector('[data-a=cancel]').onclick = function () { close(false); };
  box.querySelector('[data-a=raw]').onclick = function () {
    var k = Math.min(1, 800 / Math.max(W, H)), cv = document.createElement('canvas');
    cv.width = Math.round(W * k); cv.height = Math.round(H * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    close(cv.toDataURL('image/jpeg', 0.85));
  };
  box.querySelector('[data-a=ok]').onclick = function () {
    var s = base * z, side = V / s, out = Math.min(800, Math.round(side));
    var cv = document.createElement('canvas');
    cv.width = out; cv.height = out;
    cv.getContext('2d').drawImage(img, -x / s, -y / s, side, side, 0, 0, out, out);
    close(cv.toDataURL('image/jpeg', 0.85));
  };
  box.className = 'on';
}
</script>

<script>
/* 이름 → 사진 { s, l } (로그인 때 받아옴) */
var YN_PHOTOS = {};

function pav(name, cls) {
  var p = YN_PHOTOS[name];
  cls = cls ? ' ' + cls : '';
  var safe = String(name || '?').replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; });
  if (p && p.s) {
    return '<img class="pav' + cls + '" src="' + p.s + '" alt="" ' +
      'onclick="event.stopPropagation();viewPhoto(\'' + String(p.l || p.s).replace(/'/g, '%27') + '\')">';
  }
  return '<span class="pav ph' + cls + '">' + safe.charAt(0) + '</span>';
}

function viewPhoto(url) {
  var b = document.getElementById('pvbox');
  if (!b) {
    b = document.createElement('div'); b.id = 'pvbox';
    b.innerHTML = '<img alt="">';
    b.onclick = function () { b.className = ''; b.firstChild.src = ''; };
    document.body.appendChild(b);
  }
  b.firstChild.src = url; b.className = 'on';
}

/* 교적 조회 결과(photo/photoLarge)로 사진 목록 보충 */
function mergePhotos(list) {
  (list || []).forEach(function (m) {
    if (m && m.name) {
      if (m.photo) YN_PHOTOS[m.name] = { s: m.photo, l: m.photoLarge || m.photo };
      else delete YN_PHOTOS[m.name];

  });
}

<script>
/* =========================================================
   달력 그리기 — YC.month(칸 id, 'yyyy-MM', 일정들, 옵션)
   옵션: color, rgb   — 달력 색 (없으면 페이지 색)
         actions(e)   — 자세히 보기 아래 버튼 HTML (관리 페이지의 수정 · 삭제)
         onAdd(날짜)  — 빈 날짜를 눌렀을 때 (관리 페이지의 새 일정)
         list         — 달 아래 목록을 붙일지 (기본 true)
   ========================================================= */
var YC = (function () {
  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  var REG = {}, MAXL = 3;

  function p2(n) { return ('0' + n).slice(-2); }
  function ds(y, m, d) { return y + '-' + p2(m) + '-' + p2(d); }
  function dt(s) { var a = String(s).split('-'); return new Date(Number(a[0]), Number(a[1]) - 1, Number(a[2])); }
  function add(s, n) { var d = dt(s); d.setDate(d.getDate() + n); return ds(d.getFullYear(), d.getMonth() + 1, d.getDate()); }
  function today() { var t = new Date(); return ds(t.getFullYear(), t.getMonth() + 1, t.getDate()); }
  function h(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function day(s) { var d = dt(s); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WD[d.getDay()] + ')'; }
  function tm(t) {
    if (!t) return '';
    var a = t.split(':'), hh = Number(a[0]);
    return (hh < 12 ? '오전 ' : '오후 ') + (hh % 12 === 0 ? 12 : hh % 12) + ':' + a[1];
  }
  function end(e) { return e.endDate && e.endDate > e.date ? e.endDate : e.date; }
  function isBar(e) { return e.allDay || end(e) > e.date; }

  function when(e) {
    var many = end(e) > e.date;
    if (e.allDay) return many ? day(e.date) + ' – ' + day(end(e)) : day(e.date) + ' · 하루 종일';
    if (many) return day(e.date) + ' ' + tm(e.time) + ' – ' + day(end(e)) + ' ' + tm(e.endTime);
    return day(e.date) + ' · ' + tm(e.time) + (e.endTime ? ' – ' + tm(e.endTime) : '');
  }
  function short(e) {
    if (e.allDay) return end(e) > e.date ? '~ ' + day(end(e)) : '하루 종일';
    return tm(e.time) + (e.endTime ? ' – ' + tm(e.endTime) : '');
  }
  function linkify(s) {
    return h(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }
  function colorStyle(o) {
    return (o.color ? '--c:' + o.color + ';' : '') + (o.rgb ? '--c-rgb:' + o.rgb + ';' : '');
  }
  /** 일정마다 색이 따로 있으면 (공개 · 커미티를 한 달력에) 그 색을 씁니다 */
  function evStyle(e) { return e.color ? ' style="' + colorStyle(e) + '"' : ''; }

  /* 여러 날 일정이 같은 줄에 이어지도록 줄 번호를 정합니다 */
  function lanes(evs, first, last) {
    var order = evs.map(function (e, i) { return i; }).sort(function (a, b) {
      var A = evs[a], B = evs[b];
      var sa = A.date < first ? first : A.date, sb = B.date < first ? first : B.date;
      if (sa !== sb) return sa < sb ? -1 : 1;
      var la = dt(end(A)) - dt(A.date), lb = dt(end(B)) - dt(B.date);
      if (la !== lb) return lb - la;
      if (isBar(A) !== isBar(B)) return isBar(A) ? -1 : 1;
      return String(A.time || '').localeCompare(String(B.time || ''));
    });
    var byDay = {};           // 날짜 → [줄번호] = 일정 번호
    order.forEach(function (i) {
      var e = evs[i], s = e.date < first ? first : e.date, t = end(e) > last ? last : end(e);
      if (s > t) return;
      for (var L = 0; ; L++) {
        var free = true;
        for (var d = s; d <= t; d = add(d, 1)) { if (byDay[d] && byDay[d][L] != null) { free = false; break; } }
        if (free) {
          for (var d2 = s; d2 <= t; d2 = add(d2, 1)) { (byDay[d2] = byDay[d2] || [])[L] = i; }
          break;
        }
      }
    });
    return byDay;
  }

  function month(id, ym, evs, o) {
    o = o || {};
    evs = (evs || []).slice();
    REG[id] = { evs: evs, o: o };
    var a = ym.split('-'), y = Number(a[0]), m = Number(a[1]);
    var n = new Date(y, m, 0).getDate(), lead = new Date(y, m - 1, 1).getDay();
    var first = ds(y, m, 1), last = ds(y, m, n), now = today();
    var map = lanes(evs, first, last);
    var MAX = o.lanes || (o.compact ? 2 : MAXL);

    var legend = (o.legend || []).length ? '<div class="yc-leg">' + o.legend.map(function (l) {
      return '<span><i style="background:' + l[0] + '"></i>' + h(l[1]) + '</span>';
    }).join('') + '</div>' : '';
    var html = legend + '<div class="yc-grid' + (o.compact ? ' compact' : '') + (o.lanes > 3 ? ' dense' : '') + '" style="' + colorStyle(o) + '">' + WD.map(function (w, i) {
      return '<div class="yc-wd' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') + '">' + w + '</div>';
    }).join('');

    var prevN = new Date(y, m - 1, 0).getDate();
    for (var i = 0; i < lead; i++) {
      html += '<div class="yc-d out' + (i === 0 ? ' sun' : '') + '"><span class="yc-n"><i>' + (prevN - lead + 1 + i) + '</i></span></div>';
    }
    for (var d = 1; d <= n; d++) {
      var s = ds(y, m, d), w = (lead + d - 1) % 7;
      var row = map[s] || [], cnt = 0;
      row.forEach(function (x) { if (x != null) cnt++; });
      var show = cnt > MAX ? MAX - 1 : MAX, top = -1;
      for (var L = 0; L < Math.min(row.length, show); L++) if (row[L] != null) top = L;
      var inner = '', shown = 0;
      for (var L2 = 0; L2 <= top; L2++) {
        var k = row[L2];
        if (k == null) { inner += '<span class="yc-sp"></span>'; continue; }
        shown++;
        var e = evs[k], bar = isBar(e);
        var startHere = (s === e.date) || (s === first) || w === 0;
        var cls = 'yc-e ' + (bar ? 'yc-bar' : 'yc-tm') +
          (bar && s > e.date && w !== 0 && s !== first ? ' yc-cl' : '') +
          (bar && s < end(e) && w !== 6 && s !== last ? ' yc-cr' : '');
        inner += '<span class="' + cls + '"' + evStyle(e) + ' title="' + h(e.title) + '" onclick="event.stopPropagation();YC.open(\'' + id + '\',' + k + ')">' +
          (!bar || startHere ? h(e.title) : '&nbsp;') + '</span>';
      }
      if (cnt > shown) inner += '<span class="yc-more">+' + (cnt - shown) + '</span>';
      html += '<div class="yc-d' + (s === now ? ' today' : '') + (w === 0 ? ' sun' : w === 6 ? ' sat' : '') +
        '" onclick="YC.day(\'' + id + '\',\'' + s + '\')"><span class="yc-n"><i>' + d + '</i></span>' + inner + '</div>';
    }
    var tail = (7 - (lead + n) % 7) % 7;
    for (var t = 1; t <= tail; t++) {
      html += '<div class="yc-d out' + ((lead + n + t - 1) % 7 === 6 ? ' sat' : '') + '"><span class="yc-n"><i>' + t + '</i></span></div>';
    }
    html += '</div>';
    if (o.list !== false) html += '<div id="ycl_' + id + '">' + list(id, ym) + '</div>';
    return html;
  }

  /* 달 아래 목록 — 이번 달이면 오늘부터, 다른 달이면 전부 */
  function list(id, ym) {
    var R = REG[id], now = today(), cur = ym === now.slice(0, 7);
    var rows = R.evs.map(function (e, i) { return i; })
      .filter(function (i) { return !cur || end(R.evs[i]) >= now; })
      .sort(function (a, b) {
        var A = R.evs[a], B = R.evs[b];
        return (A.date + (A.time || '')).localeCompare(B.date + (B.time || ''));
      });
    if (!rows.length) {
      return '<p class="empty" style="margin-top:14px;">' +
        (cur && R.evs.length ? '이번 달 남은 일정이 없습니다.' : '이 달에는 등록된 일정이 없습니다.') + '</p>';
    }
    var cut = R.o.listMax && !R.all && rows.length > R.o.listMax;
    return '<div style="' + colorStyle(R.o) + '"><p class="yc-cap">' + (cur ? '다가오는 일정' : '이 달 일정') + '</p>' +
      (cut ? rows.slice(0, R.o.listMax) : rows).map(function (i) { return item(id, i, true); }).join('') +
      (cut ? '<button type="button" class="yc-all" onclick="YC.all(\'' + id + '\',\'' + ym + '\')">일정 ' + (rows.length - R.o.listMax) + '개 더 보기</button>' : '') +
      '</div>';
  }

  function item(id, i, badge) {
    var e = REG[id].evs[i], d = dt(e.date);
    return '<button type="button" class="yc-li" onclick="YC.open(\'' + id + '\',' + i + ')">' +
      (badge ? '<span class="dd"' + evStyle(e) + '><b>' + d.getDate() + '</b><span>' + WD[d.getDay()] + '</span></span>' : '<span class="sw"' + evStyle(e) + '></span>') +
      '<span class="bd"><div class="tt">' + h(e.title) + '</div><div class="mt">' +
        h([short(e), e.where].filter(function (x) { return x; }).join('  ·  ')) + '</div></span>' +
      '<span class="go">&rsaquo;</span></button>';
  }

  /* ---- 시트 ---- */
  var ov = null;
  function sheet(inner, o) {
    close(true);
    ov = document.createElement('div');
    ov.className = 'yc-ov';
    ov.innerHTML = '<div class="yc-sh" style="' + colorStyle(o || {}) + '" onclick="event.stopPropagation()">' +
      '<div class="yc-grab"></div><button type="button" class="yc-x" onclick="YC.close()" aria-label="닫기">&times;</button>' +
      inner + '</div>';
    ov.onclick = function () { close(); };
    document.body.appendChild(ov);
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(function () { ov && ov.classList.add('on'); });
  }
  function close(now) {
    if (!ov) return;
    var x = ov; ov = null;
    document.body.style.overflow = '';
    if (now) { x.remove(); return; }
    x.classList.remove('on');
    setTimeout(function () { x.remove(); }, 200);
  }
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') close(); });

  var I = {
    when: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
    where: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0113 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>',
    desc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6.5h14M5 11h14M5 15.5h9"/></svg>'
  };

  function open(id, i) {
    var R = REG[id]; if (!R) return;
    var e = R.evs[i];
    var body = '<div class="yc-h"><span class="sw"></span><h3>' + h(e.title) + '</h3></div>' +
      (e.calName ? '<p class="yc-calname">' + h(e.calName) + '</p>' : '') +
      '<div class="yc-r">' + I.when + '<div class="v">' + h(when(e)) + '</div></div>' +
      (e.where ? '<div class="yc-r">' + I.where + '<div class="v">' + linkify(e.where) +
        (/온라인|줌|zoom|online|meet|https?:/i.test(e.where) ? '' :
          '<br><a href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(e.where) +
          '" target="_blank" rel="noopener">지도에서 보기 &rsaquo;</a>') + '</div></div>' : '') +
      (e.desc ? '<div class="yc-r">' + I.desc + '<div class="v desc">' + linkify(e.desc) + '</div></div>' : '');
    if (R.o.actions) {
      body += e.recurring
        ? '<p class="yc-note">반복 일정은 구글 캘린더 앱에서 수정 · 삭제해주세요.</p>'
        : '<div class="yc-acts">' + R.o.actions(e) + '</div>';
    }
    sheet(body, e.color ? e : R.o);
  }

  /* 날짜를 누르면 그날 일정 모두 */
  function dayOpen(id, s) {
    var R = REG[id]; if (!R) return;
    var hits = R.evs.map(function (e, i) { return i; }).filter(function (i) {
      var e = R.evs[i]; return e.date <= s && end(e) >= s;
    }).sort(function (a, b) {
      var A = R.evs[a], B = R.evs[b];
      if (isBar(A) !== isBar(B)) return isBar(A) ? -1 : 1;
      return String(A.time || '').localeCompare(String(B.time || ''));
    });
    if (!hits.length) { if (R.o.onAdd) R.o.onAdd(s); return; }
    if (hits.length === 1 && !R.o.onAdd) { open(id, hits[0]); return; }
    sheet('<div class="yc-h"><h3>' + h(day(s)) + '</h3></div>' +
      hits.map(function (i) { return item(id, i, false); }).join('') +
      (R.o.onAdd ? '<div class="yc-acts"><button class="btn accent" onclick="YC.close();YC.addOn(\'' + id + '\',\'' + s + '\')">＋ 이 날에 일정 추가</button></div>' : ''),
      R.o);
  }

  return {
    month: month, open: open, day: dayOpen, close: close, when: when, sheet: sheet,
    addOn: function (id, s) { var R = REG[id]; if (R && R.o.onAdd) R.o.onAdd(s); },
    /** 달력 없이 목록만 (가까운 일정 몇 개) — 눌러서 자세히 */
    peek: function (id, evs, o) {
      REG[id] = { evs: evs || [], o: o || {} };
      return (evs || []).map(function (e, i) { return item(id, i, true); }).join('');
    },
    all: function (id, ym) { var R = REG[id]; if (!R) return; R.all = true; var b = document.getElementById('ycl_' + id); if (b) b.innerHTML = list(id, ym); },
    ev: function (id, i) { return REG[id] && REG[id].evs[i]; }
  };
})();
</script>

<script>
/* 역할 고르기 — RP.html(칸 id, 지금 값, 보기) · RP.val(칸 id) · RP.edit(제목, 값, 보기, 저장할 때) */
var RP = (function () {
  var BASE = ['팀장', '부팀장', '총무', '회계', '서기', '팀원'];
  var KIND = {
    찬양: ['인도자', '남싱', '여싱', '피아노', '신디', '베이스', '일렉기타', '어쿠기타', '드럼'],
    방송: ['음향', 'PPT', '코디', '영상', '자막', '조명', '송출']
  };
  var ST = {};
  function split(v) {
    var seen = {};
    return String(v || '').split(/[,·\/|]/).map(function (x) { return x.trim(); })
      .filter(function (x) { if (!x || seen[x]) return false; seen[x] = 1; return true; });
  }
  function uniq(a) { var s = {}; return a.filter(function (x) { if (!x || s[x]) return false; s[x] = 1; return true; }); }
  function h(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  /** 팀 이름에 맞는 보기 + 이 팀에서 이미 쓰는 역할 */
  function sugg(teamName, used) {
    var t = String(teamName || ''), extra = [];
    (used || []).forEach(function (r) { extra = extra.concat(split(r)); });
    var k = /찬양|worship|praise/i.test(t) ? KIND.찬양 : (/방송|미디어|media/i.test(t) ? KIND.방송 : []);
    return uniq(k.concat(BASE).concat(extra));
  }
  function inner(id) {
    var s = ST[id], all = uniq(s.list.concat(s.vals));
    s.all = all;
    return all.map(function (r, i) {
      return '<button type="button" class="rpc' + (s.vals.indexOf(r) !== -1 ? ' on' : '') +
        '" onclick="RP.t(\'' + id + '\',' + i + ')">' + h(r) + '</button>';
    }).join('') +
      '<input type="text" class="rpi" placeholder="＋ 직접 입력" maxlength="20" ' +
        'onkeydown="if(event.key===\'Enter\'){event.preventDefault();RP.add(\'' + id + '\',this);}" onblur="RP.add(\'' + id + '\',this)">';
  }
  function draw(id) {
    var box = document.getElementById(id);
    if (box) box.innerHTML = inner(id);
    var sel = document.getElementById(id + '_sel');
    if (sel) sel.innerHTML = ST[id].vals.length ? '고른 역할: <b>' + h(ST[id].vals.join(', ')) + '</b>' : '역할을 눌러 고르세요 (여러 개 가능)';
  }
  var onSave = null;
  return {
    split: split, sugg: sugg,
    html: function (id, value, list) {
      ST[id] = { vals: split(value), list: list || BASE.slice() };
      return '<div class="rp" id="' + id + '">' + inner(id) + '</div>';
    },
    t: function (id, i) {
      var s = ST[id], r = s.all[i], k = s.vals.indexOf(r);
      if (k === -1) s.vals.push(r); else s.vals.splice(k, 1);
      draw(id);
    },
    add: function (id, box) {
      var v = String(box.value || '').trim();
      if (!v) return;
      split(v).forEach(function (x) { if (ST[id].vals.indexOf(x) === -1) ST[id].vals.push(x); });
      box.value = '';
      draw(id);
      var nb = document.querySelector('#' + id + ' .rpi');
      if (nb && document.activeElement === document.body) nb.focus();
    },
    val: function (id) {
      var box = document.querySelector('#' + id + ' .rpi');
      if (box && box.value.trim()) RP.add(id, box);
      return ST[id] ? ST[id].vals.join(', ') : '';
    },
    /** 아래에서 올라오는 창으로 역할 고치기 */
    edit: function (title, value, list, save) {
      onSave = save;
      YC.sheet('<div class="yc-h"><h3>' + h(title) + '</h3></div>' +
        '<p class="stsub" style="font-size:13.5px;color:var(--ink-3);margin:-6px 0 12px;">여러 개를 고를 수 있습니다</p>' +
        RP.html('rp_edit', value, list) + '<p class="rpsel" id="rp_edit_sel"></p>' +
        '<div class="yc-acts"><button class="btn" onclick="YC.close()">취소</button>' +
        '<button class="btn accent" id="rp_edit_go" onclick="RP.done()">저장</button></div>' +
        '<p class="msg" id="rp_edit_msg"></p>', {});
      draw('rp_edit');
    },
    done: function () {
      var v = RP.val('rp_edit');
      var b = document.getElementById('rp_edit_go');
      if (b) b.disabled = true;
      var m = document.getElementById('rp_edit_msg');
      if (m) { m.className = 'msg'; m.textContent = '저장하는 중…'; }
      if (onSave) onSave(v, function (err) {
        if (err) { if (b) b.disabled = false; if (m) { m.className = 'msg err'; m.textContent = err; } }
        else YC.close();
      });
    }
  };
})();
</script>

<script>
(function () {
  /* 포털에서 구글로 로그인해 두었으면 그 표를 다른 페이지도 씁니다 */
  window.YN_KEPT = function () {
    try {
      var k = JSON.parse(localStorage.getItem('ynPortalKeep') || 'null');
      if (k && k.t && k.until > Date.now()) return k.t;
    } catch (e) {}
    return '';
  };
  function P() { try { return (typeof PREFILL !== 'undefined' && PREFILL) || {}; } catch (e) { return {}; } }
  /* 지금 주소 그대로 다시 엽니다 (구글 로그인에서 돌아온 code 는 빼고) */
  function here(done) {
    var base = P()._base;
    if (!base) return done('');
    try {
      var q = [];
      new URLSearchParams(location.search).forEach(function (v, k) {
        if (k === 'code' || k === 'state' || k === 'scope' || k === 'authuser' || k === 'prompt') return;
        q.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));
      });
      done(base + (q.length ? '?' + q.join('&') : '') + location.hash);
    } catch (e) { done(base); }
  }
  function setup() {
    var home = P()._home;
    // 비밀번호 화면 → 구글 계정(포털)으로만 들어오게 합니다
    if (home) Array.prototype.forEach.call(document.querySelectorAll('#lock'), function (lk) {
      var pw = lk.querySelector('.pwbox');
      if (!pw || lk.querySelector('.yngo')) return;
