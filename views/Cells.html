<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root { --accent: #D2511F; --tone-rgb: 210,81,31; }
  body .shell { max-width: 1180px !important; margin: 0 auto; padding-bottom: 10px; }
  #pane { background: var(--canvas); border-radius: 18px; padding: 16px; margin: 0 12px 14px; }
  .ch input { width: 100%; box-sizing: border-box; min-width: 0; }
  .panel { overflow: visible; }
  .toprow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .toprow select { width: auto; min-width: 150px; }
  .openbox { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--sunken); }
  .openbox b.on { color: var(--good); } .openbox b.off { color: var(--ink-3); }
  .ctabs { display: flex; gap: 6px; margin: 4px 12px 12px; overflow-x: auto; }
  .ctabs button { flex: none; border: 1px solid var(--hair-2); background: #fff; border-radius: 99px; padding: 8px 15px; font: 700 13.5px inherit; font-family: inherit; cursor: pointer; color: var(--ink-2); }
  .ctabs button.on { background: var(--tone); border-color: var(--tone); color: #fff; }
  .cstats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .cst { background: #fff; border: 1px solid var(--hair); border-radius: 12px; padding: 8px 12px; font-size: 12px; color: var(--ink-3); }
  .cst b { display: block; font-size: 18px; color: var(--ink-1); }

  table.apps { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; border-radius: 12px; overflow: hidden; }
  table.apps th { text-align: left; background: #F7F4EF; color: var(--ink-3); font-weight: 700; font-size: 11.5px; padding: 8px 8px; white-space: nowrap; position: sticky; top: 0; }
  table.apps td { padding: 8px; border-top: 1px solid var(--hair); vertical-align: top; }
  table.apps tr.flag td { background: #FDEDE8; }
  table.apps tr.no td { color: var(--ink-4); }
  .tscroll { overflow-x: auto; border-radius: 12px; border: 1px solid var(--hair); }
  .pill { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 6px; background: var(--sunken); color: var(--ink-2); white-space: nowrap; }
  .pill.yes { background: var(--good-bg); color: var(--good); } .pill.no { background: var(--sunken); color: var(--ink-3); }
  .pill.nf { background: #FFF1E7; color: #C2521C; } .pill.fl { background: #F9D9CF; color: #A82F16; }
  .mini { padding: 4px 8px !important; font-size: 12px !important; }
  .rate { font-variant-numeric: tabular-nums; }
  .q { max-width: 260px; white-space: pre-wrap; color: var(--ink-2); }

  /* 편성 보드 */
  .ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .badge { font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 99px; }
  .badge.s0 { background: var(--sunken); color: var(--ink-2); } .badge.s1 { background: var(--warn-bg); color: var(--warn); }
  .badge.s2 { background: var(--good-bg); color: var(--good); } .badge.s3 { background: #E7E4F7; color: #4B3A9A; }
  .board { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; align-items: flex-start; }
  .col { flex: none; width: 212px; background: #fff; border: 1px solid var(--hair-2); border-radius: 14px; display: flex; flex-direction: column; max-height: 78vh; }
  .col.pool { background: #FBF8F4; border-style: dashed; }
  .col.over { outline: 2px solid var(--tone); outline-offset: -2px; }
  .col.target { box-shadow: 0 0 0 2px var(--tone) inset; cursor: pointer; }
  .ch { padding: 10px 10px 8px; border-bottom: 1px solid var(--hair); }
  .ch .nm { display: flex; gap: 6px; align-items: center; }
  .ch .nm input { font-weight: 800; font-size: 14px; padding: 5px 7px !important; }
  .ch .nm b { font-size: 14px; }
  .ch .ld { margin-top: 6px; }
  .ch .ld input { font-size: 12.5px; padding: 5px 7px !important; }
  .ch .x { border: none; background: none; color: var(--ink-4); cursor: pointer; font-size: 16px; padding: 0 2px; }
  .cs { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 8px; margin-top: 8px; font-size: 11.5px; color: var(--ink-3); }
  .cs b { color: var(--ink-1); font-variant-numeric: tabular-nums; }
  .cs .warn b { color: var(--bad); }
  .cl { padding: 8px; overflow-y: auto; min-height: 60px; flex: 1; }
  .chip2 { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 9px; background: #F6F3EE; margin-bottom: 5px; font-size: 13px; cursor: grab; user-select: none; border: 1.5px solid transparent; }
  .chip2 .g { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #B3ADA4; }
  .chip2 .g.gm { background: #3E7BD6; } .chip2 .g.gf { background: #E0578A; }
  .chip2 .n { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip2 .a { font-size: 11px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .chip2.flag { background: #FDE3DA; border-color: #E9967E; }
  .chip2.lead { background: #FFF1E7; cursor: default; }
  .chip2.sel { border-color: var(--tone); box-shadow: 0 0 0 2px rgba(210,81,31,.25); }
  .chip2.drag { opacity: .4; }
  .chip2 .nf { font-size: 10px; font-weight: 800; color: #C2521C; }
  .locked .chip2 { cursor: default; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--ink-3); margin: 0 0 10px; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
  .addp { display: flex; gap: 6px; margin-top: 6px; }
  .addp input { font-size: 12.5px; padding: 6px 8px !important; }
  .selbar { position: sticky; bottom: 10px; z-index: 5; background: #1C1C1C; color: #fff; border-radius: 12px; padding: 10px 14px; font-size: 13px; display: flex; align-items: center; gap: 10px; box-shadow: var(--sh-3); }
  .flagrow { display: flex; gap: 8px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--hair); }
  .flagrow .n { font-weight: 800; min-width: 80px; color: #A82F16; }
  .flagrow .m { flex: 1; font-size: 13px; color: var(--ink-2); white-space: pre-wrap; }
  details.missing summary { cursor: pointer; font-size: 13px; color: var(--ink-2); font-weight: 700; margin-top: 14px; }
  details.missing .ls { font-size: 13px; color: var(--ink-3); line-height: 1.9; margin-top: 6px; }
  .detail { font-size: 12.5px; color: var(--ink-2); line-height: 1.7; background: #FBF8F4; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <img src="/logo.png" alt="Youngnak">
    <h1>셀 신청 · 편성</h1>
    <p class="meta">YNTORONTO · CELL GROUPS · 커미티 전용</p>
  </header>
  <div id="root"><div class="panel"><i class="skel line" style="width:60%;"></i><i class="skel line" style="width:40%;"></i></div></div>
  <footer></footer>
</div>
<!--#include Theme-->
<script>
var P = window.__PREFILL__ || {};
var KEY = P.key || '';
var D = null, TAB = 'apps', PLAN = null, DIRTY = false, SEL = null;
function el(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function jsq(s) { return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
function say(msg, err) { var m = el('msg'); if (m) { m.className = 'msg' + (err ? ' err' : ' ok'); m.textContent = msg || ''; } }

var STATUS = { '작성중': 's0', '확정': 's1', '공개': 's2', '전환완료': 's3' };

function start(year) {
  if (!KEY) { el('root').innerHTML = '<div class="panel"><p class="msg err">커미티만 들어올 수 있습니다. 포털의 관리 메뉴에서 “셀 신청 · 편성” 으로 들어와 주세요.</p><a class="btn full" href="?page=portal">포털로 가기</a></div>'; return; }
  callServer('cellAdminInit', [KEY, year || ''], function (r) { load(r); }, function (e) {
    el('root').innerHTML = '<div class="panel"><p class="msg err">' + esc(e.message) + '</p></div>';
  });
}
function load(r) {
  D = r;
  D.byName = {}; r.people.forEach(function (p) { D.byName[p.name] = p; });
  D.flagMap = {}; r.flags.forEach(function (f) { D.flagMap[f.name] = f; });
  D.appMap = {}; r.apps.forEach(function (a) { D.appMap[a.name] = a; });
  PLAN = r.plan ? JSON.parse(JSON.stringify(r.plan)) : { status: '작성중', cells: [] };
  DIRTY = false; SEL = null;
  paint();
}
function person(n) { return D.byName[n] || { name: n, gender: '', age: null, rate: null }; }
function locked() { return PLAN.status !== '작성중'; }

function paint() {
  var h = '<div class="panel"><div class="toprow"><label style="font-weight:800;">셀년도</label><select onchange="if(!DIRTY||confirm(\'저장하지 않은 편성이 있습니다. 다른 해로 옮길까요?\'))start(this.value);else this.value=D.year">' +
    D.years.map(function (y) { return '<option' + (y === D.year ? ' selected' : '') + '>' + y + '</option>'; }).join('') + '</select>' +
    '<button class="btn mini" onclick="newYear()">＋ 새 셀년도</button></div>' +
    '<div class="openbox"><span>셀 신청: <b class="' + (D.open ? 'on' : 'off') + '">' + (D.open ? '열림' : '닫힘') + '</b> · 신청 받는 셀년도 <b>' + esc(D.openYear) + '</b></span>' +
      (D.open ? '<button class="btn mini" onclick="setOpen(false)">신청 닫기</button>'
              : '<button class="btn accent mini" onclick="setOpen(true)">' + esc(D.year) + ' 셀 신청 열기</button>') +
      '<span class="fnote" style="margin:0;">닫혀 있어도 새가족팀이 “셀 신청 허용” 한 새가족은 신청할 수 있습니다.</span></div>' +
    '<p class="msg" id="msg"></p></div>' +
    '<div class="ctabs">' + [['apps', '신청 현황 (' + D.apps.length + ')'], ['plan', '셀 편성'], ['flags', '요주인물 (' + D.flags.length + ')']].map(function (t) {
      return '<button class="' + (TAB === t[0] ? 'on' : '') + '" onclick="TAB=\'' + t[0] + '\';paint()">' + t[1] + '</button>';
    }).join('') + '</div><div id="pane"></div>';
  el('root').innerHTML = h;
  el('pane').innerHTML = TAB === 'apps' ? paneApps() : TAB === 'plan' ? panePlan() : paneFlags();
  if (TAB === 'plan') wire();
}

function newYear() {
  var last = D.years[D.years.length - 1] || '';
  var a = Number(last.split('-')[1]) || new Date().getFullYear();
  var y = prompt('새 셀년도 (예: ' + a + '-' + (a + 1) + ')', a + '-' + (a + 1));
  if (!y) return;
  if (!/^\d{4}-\d{4}$/.test(y)) { alert('2026-2027 처럼 적어주세요.'); return; }
  start(y);
}
function setOpen(on) {
  if (on && !confirm(D.year + ' 셀 신청을 열까요?\n포털에서 모두에게 “셀 신청 및 교적확인” 버튼이 켜집니다.')) return;
  callServer('setCellAppOpen', [KEY, on, on ? D.year : ''], function (r) { D.open = r.open; D.openYear = r.openYear; paint(); say(on ? '셀 신청을 열었습니다.' : '셀 신청을 닫았습니다.'); },
    function (e) { say(e.message, true); });
}

/* ---------- 신청 현황 ---------- */
function rateTxt(p) { return p.rate == null ? '<span style="color:var(--ink-4);">기록 없음</span>' : p.rate + '% <span style="color:var(--ink-4);">(' + p.present + '/' + p.total + ')</span>'; }
function paneApps() {
  var apps = D.apps.slice().sort(function (a, b) { return (a.join === b.join ? 0 : a.join === 'Yes' ? -1 : 1) || a.name.localeCompare(b.name, 'ko'); });
  var yes = apps.filter(function (a) { return a.join === 'Yes'; });
  var nf = apps.filter(function (a) { return a.kind === '새가족'; }).length;
  var m = yes.filter(function (a) { return person(a.name).gender === '남'; }).length, f = yes.filter(function (a) { return person(a.name).gender === '여'; }).length;
  var applied = {}; apps.forEach(function (a) { applied[a.name] = 1; });
  var missing = D.people.filter(function (p) { return p.inDirectory && !applied[p.name] && p.cell; }).map(function (p) { return p.name; }).sort(function (a, b) { return a.localeCompare(b, 'ko'); });
  return '<div class="cstats">' +
      '<div class="cst"><b>' + apps.length + '</b>신청</div><div class="cst"><b>' + yes.length + '</b>셀 참여 Yes</div>' +
      '<div class="cst"><b>' + (apps.length - yes.length) + '</b>No</div><div class="cst"><b>' + nf + '</b>새가족</div>' +
      '<div class="cst"><b>' + m + ' · ' + f + '</b>남 · 여 (Yes)</div></div>' +
    '<p class="fnote" style="margin:0 0 8px;">출석률 = 지난 셀년도 (' + esc(D.attendanceRange[0]) + ' ~ ' + esc(D.attendanceRange[1]) + ') 셀모임 보고서 기준 · 이름을 누르면 자세히 보입니다.</p>' +
    (apps.length ? '<div class="tscroll"><table class="apps"><thead><tr><th>이름</th><th>성별</th><th>나이</th><th>구분</th><th>지금 셀</th><th>출석률</th><th>셀 참여</th><th>체류</th><th>제출</th><th>문의</th><th></th></tr></thead><tbody>' +
      apps.map(function (a, i) {
        var p = person(a.name), fl = D.flagMap[a.name];
        return '<tr class="' + (fl ? 'flag ' : '') + (a.join === 'No' ? 'no' : '') + '"><td><a href="#" onclick="toggleRow(' + i + ');return false;" style="font-weight:800;color:inherit;">' + esc(a.name) + '</a>' + (fl ? ' <span class="pill fl">요주</span>' : '') + '</td>' +
          '<td>' + esc(p.gender || '—') + '</td><td>' + (p.age == null ? '—' : p.age) + '</td>' +
          '<td>' + (a.kind === '새가족' ? '<span class="pill nf">새가족</span>' : '교적') + '</td><td>' + esc(p.cell || (a.data && a.data.cell) || '—') + '</td>' +
          '<td class="rate">' + rateTxt(p) + '</td><td><span class="pill ' + (a.join === 'Yes' ? 'yes' : 'no') + '">' + esc(a.join) + '</span></td>' +
          '<td>' + esc(a.residency) + '</td><td style="white-space:nowrap;">' + esc(a.at) + '</td><td class="q">' + esc(a.question) + '</td>' +
          '<td style="white-space:nowrap;"><button class="btn mini" onclick="flagAsk(\'' + jsq(a.name) + '\')">' + (fl ? '요주 해제' : '요주') + '</button> ' +
          '<button class="btn mini" onclick="delApp(\'' + jsq(a.name) + '\')">삭제</button></td></tr>' +
          '<tr id="row' + i + '" style="display:none;"><td colspan="11" class="detail">' + appDetail(a, p) + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '<p class="empty">아직 신청이 없습니다.</p>') +
    (missing.length ? '<details class="missing"><summary>지금 셀에 있는데 아직 신청하지 않은 분 (' + missing.length + ')</summary><div class="ls">' + missing.map(esc).join(', ') + '</div></details>' : '');
}
function appDetail(a, p) {
  var d = a.data || {}, ad = d.address || {};
  return [['영문 이름', (d.engFirst || '') + ' ' + (d.engLast || '')], ['전화', d.phone || p.phone], ['카카오톡', d.kakao], ['이메일', a.email],
    ['주소', [ad.street, ad.unit ? '#' + ad.unit : '', ad.city, ad.postal].filter(function (x) { return x; }).join(', ')],
    ['세례', d.baptized], ['부모님 성함', a.parents], ['생년월일', p.birthday]].map(function (x) {
      return '<b>' + x[0] + '</b> ' + esc(x[1] || '—');
    }).join(' &nbsp;·&nbsp; ') + (D.flagMap[a.name] && D.flagMap[a.name].memo ? '<br><b style="color:#A82F16;">요주 메모</b> ' + esc(D.flagMap[a.name].memo) : '');
}
function toggleRow(i) { var r = el('row' + i); r.style.display = r.style.display === 'none' ? '' : 'none'; }
function delApp(name) {
  if (!confirm(name + '님의 ' + D.year + ' 신청을 지울까요?')) return;
  callServer('deleteCellApp', [KEY, D.year, name], function (r) { keepPlan(r); say('지웠습니다.'); }, function (e) { say(e.message, true); });
}
function keepPlan(r) { var p = PLAN, dirty = DIRTY; load(r); if (dirty) { PLAN = p; DIRTY = true; paint(); } }
function flagAsk(name) {
  var on = !D.flagMap[name];
  var memo = '';
  if (on) { memo = prompt(name + '님을 요주인물로 표시합니다. 메모 (커미티만 봅니다)', ''); if (memo === null) return; }
  else if (!confirm(name + '님의 요주 표시를 해제할까요?')) return;
  callServer('setCellFlag', [KEY, name, on, memo], function (flags) {
    D.flags = flags; D.flagMap = {}; flags.forEach(function (f) { D.flagMap[f.name] = f; }); paint();
  }, function (e) { say(e.message, true); });
}

/* ---------- 요주인물 ---------- */
function paneFlags() {
  return '<div class="panel"><span class="chip">요주인물</span><p class="hint">셀 편성에서 다른 색으로 보이고, 자동 배정 때 한 셀에 몰리지 않게 나눕니다. 커미티만 볼 수 있습니다.</p>' +
    (D.flags.length ? D.flags.map(function (f) {
      return '<div class="flagrow"><span class="n">' + esc(f.name) + '</span><span class="m">' + esc(f.memo || '') + (f.by ? ' <span style="color:var(--ink-4);">· ' + esc(f.by) + '</span>' : '') + '</span>' +
        '<button class="btn mini" onclick="flagAsk(\'' + jsq(f.name) + '\')">해제</button></div>';
    }).join('') : '<p class="empty">아직 없습니다.</p>') +
    '<div class="frow" style="margin-top:12px;"><div><input type="text" id="flName" list="allNames" placeholder="이름"></div><div><input type="text" id="flMemo" placeholder="메모"></div>' +
    '<button class="btn accent" onclick="addFlag()">추가</button></div>' + nameList() + '</div>';
}
function nameList() { return '<datalist id="allNames">' + D.people.map(function (p) { return '<option value="' + esc(p.name) + '">'; }).join('') + '</datalist>'; }
function addFlag() {
  var n = el('flName').value.trim(); if (!n) return;
  callServer('setCellFlag', [KEY, n, true, el('flMemo').value.trim()], function (flags) {
    D.flags = flags; D.flagMap = {}; flags.forEach(function (f) { D.flagMap[f.name] = f; }); paint();
  }, function (e) { say(e.message, true); });
}

/* ---------- 셀 편성 ---------- */
function assigned() {
  var m = {};
  PLAN.cells.forEach(function (c, i) { if (c.leader) m[c.leader] = i; c.members.forEach(function (n) { m[n] = i; }); });
  return m;
}
function poolNames() {
  var a = assigned();
  var pool = D.apps.filter(function (x) { return x.join === 'Yes' && !(x.name in a); }).map(function (x) { return x.name; });
  (PLAN.extra || []).forEach(function (n) { if (!(n in a) && pool.indexOf(n) === -1) pool.push(n); });
  return pool.sort(function (x, y) { return x.localeCompare(y, 'ko'); });
}
function statOf(names) {
  var ps = names.map(person), m = 0, f = 0, ages = [], rates = [], fl = 0;
  ps.forEach(function (p) { if (p.gender === '남') m++; else if (p.gender === '여') f++; if (p.age != null) ages.push(p.age); if (p.rate != null) rates.push(p.rate); if (D.flagMap[p.name]) fl++; });
  var avg = function (a) { return a.length ? Math.round(a.reduce(function (x, y) { return x + y; }, 0) / a.length * 10) / 10 : null; };
  return { n: ps.length, m: m, f: f, age: avg(ages), rate: avg(rates), flag: fl };
}
function chip(n, where, lead) {
  var p = person(n), fl = D.flagMap[n], nf = p.newcomer;
  return '<div class="chip2' + (fl ? ' flag' : '') + (lead ? ' lead' : '') + (SEL && SEL.name === n ? ' sel' : '') + '"' +
    (lead || locked() ? '' : ' draggable="true" data-n="' + esc(n) + '" data-from="' + where + '" onclick="pick(event,\'' + jsq(n) + '\',' + where + ')"') +
    ' title="' + esc(n + (fl && fl.memo ? ' — 요주: ' + fl.memo : '') + (p.cell ? ' · 지금 셀: ' + p.cell : '')) + '">' +
    '<span class="g ' + (p.gender === '남' ? 'gm' : p.gender === '여' ? 'gf' : '') + '"></span>' +
    '<span class="n">' + esc(n) + (lead ? ' <span style="font-size:10.5px;color:#C2521C;">셀장</span>' : '') + (nf ? ' <span class="nf">새</span>' : '') + '</span>' +
    '<span class="a">' + (p.age == null ? '' : p.age + '세 ') + (p.rate == null ? '–' : p.rate + '%') + '</span></div>';
}
function panePlan() {
  var lk = locked(), pool = poolNames();
  var all = []; PLAN.cells.forEach(function (c) { if (c.leader) all.push(c.leader); all = all.concat(c.members); });
  var g = statOf(all);
  var st = PLAN.status || '작성중';
  var h = '<div class="ctl"><span class="badge ' + (STATUS[st] || 's0') + '">' + esc(st) + '</span>' +
    (PLAN.at ? '<span class="fnote" style="margin:0;">' + esc(PLAN.by || '') + ' · ' + esc(PLAN.at) + '</span>' : '') +
    (DIRTY ? '<b style="color:var(--bad);font-size:12.5px;">저장하지 않은 변경</b>' : '') + '</div>';
  if (st === '전환완료') h += '<p class="hint">이 편성으로 새 셀년도를 시작했습니다. (셀목록 · 셀원명단이 이 편성으로 바뀌었습니다)</p>';
  h += '<div class="ctl">' + (!lk ? '<button class="btn mini" onclick="addCell()">＋ 셀 개설</button>' +
      '<button class="btn mini" onclick="fromNow()">지금 셀 이름 · 셀장으로 틀 만들기</button>' +
      '<button class="btn mini" onclick="auto(false)">미배정만 자동 배정</button>' +
      '<button class="btn mini" onclick="auto(true)">전체 다시 자동 배정</button>' +
      '<button class="btn accent mini" onclick="savePlan(\'작성중\')">저장</button>' +
      '<button class="btn dark mini" onclick="savePlan(\'확정\')">확정</button>' : '') +
    (st === '확정' ? '<button class="btn mini" onclick="savePlan(\'작성중\')">다시 수정</button><button class="btn accent mini" onclick="publish()">공개</button>' : '') +
    (st === '공개' ? '<button class="btn mini" onclick="savePlan(\'확정\')">공개 취소</button><button class="btn dark mini" onclick="applyPlan()">새 셀년도 시작 (셀목록 · 셀원명단 교체)</button>' : '') + '</div>' +
    '<div class="cstats"><div class="cst"><b>' + PLAN.cells.length + '</b>셀</div><div class="cst"><b>' + g.n + '</b>배정 (셀장 포함)</div>' +
      '<div class="cst"><b>' + pool.length + '</b>미배정</div><div class="cst"><b>' + g.m + ' · ' + g.f + '</b>남 · 여</div>' +
      '<div class="cst"><b>' + (g.age == null ? '—' : g.age) + '</b>평균 나이</div><div class="cst"><b>' + (g.rate == null ? '—' : g.rate + '%') + '</b>평균 출석률</div></div>' +
    '<div class="legend"><span><i style="background:#3E7BD6;"></i>남</span><span><i style="background:#E0578A;"></i>여</span>' +
      '<span><i style="background:#E9967E;border-radius:2px;"></i>요주인물</span><span><b style="color:#C2521C;">새</b> 새가족</span><span>나이 · 지난 셀년도 출석률</span>' +
      (lk ? '' : '<span>끌어다 놓거나, 이름을 누른 뒤 옮길 셀을 누르세요</span>') + '</div>' +
    '<div class="board' + (lk ? ' locked' : '') + '">' +
      '<div class="col pool" data-to="-1"><div class="ch"><div class="nm"><b>미배정</b></div><div class="cs"><span>신청 Yes 중 <b>' + pool.length + '</b>명</span></div>' +
        (lk ? '' : '<div class="addp"><input type="text" id="addName" list="allNames" placeholder="이름 더하기"><button class="btn mini" onclick="addExtra()">＋</button></div>') + '</div>' +
        '<div class="cl">' + pool.map(function (n) { return chip(n, -1); }).join('') + '</div></div>' +
      PLAN.cells.map(function (c, i) {
        var s = statOf((c.leader ? [c.leader] : []).concat(c.members));
        var tilt = s.n >= 4 && (s.m === 0 || s.f === 0);
        return '<div class="col" data-to="' + i + '"><div class="ch"><div class="nm">' +
          (lk ? '<b>' + esc(c.name) + '</b>' : '<input type="text" value="' + esc(c.name) + '" onchange="PLAN.cells[' + i + '].name=this.value.trim();dirty()">' +
            '<button class="x" title="셀 삭제" onclick="delCell(' + i + ')">✕</button>') + '</div>' +
          '<div class="ld">' + (lk ? '<span style="font-size:12.5px;color:var(--ink-3);">셀장 ' + esc(c.leader || '—') + '</span>'
            : '<input type="text" list="allNames" value="' + esc(c.leader) + '" placeholder="셀장 이름" onchange="setLeader(' + i + ',this.value)">') + '</div>' +
          '<div class="cs"><span>인원 <b>' + s.n + '</b></span><span class="' + (tilt ? 'warn' : '') + '">남·여 <b>' + s.m + '·' + s.f + '</b></span>' +
            '<span>평균 나이 <b>' + (s.age == null ? '—' : s.age) + '</b></span><span>출석률 <b>' + (s.rate == null ? '—' : s.rate + '%') + '</b></span>' +
            (s.flag ? '<span class="warn">요주 <b>' + s.flag + '</b></span>' : '') + '</div></div>' +
          '<div class="cl">' + (c.leader ? chip(c.leader, i, true) : '') + c.members.map(function (n) { return chip(n, i); }).join('') + '</div></div>';
      }).join('') + '</div>' + nameList() +
    (SEL ? '<div class="selbar"><span><b>' + esc(SEL.name) + '</b> — 옮길 셀을 누르세요</span><button class="btn mini" onclick="SEL=null;paint()">취소</button></div>' : '');
  return h;
}
function dirty() { DIRTY = true; }
function setLeader(i, v) {
  v = String(v || '').trim();
  PLAN.cells.forEach(function (c, k) { c.members = c.members.filter(function (m) { return m !== v; }); if (k !== i && c.leader === v && v) c.leader = ''; });
  PLAN.cells[i].leader = v; DIRTY = true; paint();
}
function addCell() {
  var n = prompt('새 셀 이름', (PLAN.cells.length + 1) + '셀'); if (!n) return;
  PLAN.cells.push({ name: n.trim(), leader: '', members: [] }); DIRTY = true; paint();
}
function delCell(i) {
  var c = PLAN.cells[i];
  if (!confirm(c.name + ' 셀을 지울까요? 셀원은 미배정으로 돌아갑니다.')) return;
  PLAN.cells.splice(i, 1); DIRTY = true; paint();
}
function fromNow() {
  if (PLAN.cells.length && !confirm('지금 만든 셀을 모두 지우고, 지금 운영 중인 셀 이름 · 셀장으로 새로 만들까요?')) return;
  PLAN.cells = D.cellsNow.map(function (c) { return { name: c.name, leader: c.leader, members: [] }; }); DIRTY = true; paint();
}
function addExtra() {
  var n = el('addName').value.trim(); if (!n) return;
  if (!D.byName[n]) { alert('교적에 없는 이름입니다.'); return; }
  PLAN.extra = PLAN.extra || []; if (PLAN.extra.indexOf(n) === -1) PLAN.extra.push(n); DIRTY = true; paint();
}
function moveTo(n, to) {
  PLAN.cells.forEach(function (c) { c.members = c.members.filter(function (m) { return m !== n; }); });
  if (to >= 0) PLAN.cells[to].members.push(n);
  else { PLAN.extra = PLAN.extra || []; if (!D.appMap[n] && PLAN.extra.indexOf(n) === -1) PLAN.extra.push(n); }
  DIRTY = true;
}
function pick(ev, n, from) {
  ev.stopPropagation();
  SEL = (SEL && SEL.name === n) ? null : { name: n, from: from }; paint();
}
function wire() {
  if (locked()) return;
  var cols = document.querySelectorAll('.board .col');
  document.querySelectorAll('.chip2[draggable]').forEach(function (c) {
    c.addEventListener('dragstart', function (e) { e.dataTransfer.setData('text/plain', c.getAttribute('data-n')); e.dataTransfer.effectAllowed = 'move'; c.classList.add('drag'); });
    c.addEventListener('dragend', function () { c.classList.remove('drag'); });
  });
  cols.forEach(function (col) {
    var to = Number(col.getAttribute('data-to'));
    col.addEventListener('dragover', function (e) { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', function () { col.classList.remove('over'); });
    col.addEventListener('drop', function (e) { e.preventDefault(); col.classList.remove('over'); var n = e.dataTransfer.getData('text/plain'); if (n) { moveTo(n, to); SEL = null; paint(); } });
    if (SEL) { col.classList.add('target'); col.addEventListener('click', function (e) { if (e.target.closest('input,button')) return; moveTo(SEL.name, to); SEL = null; paint(); }); }
  });
}

/* 자동 배정 — 성별 · 출석률 · 나이 · 요주인물을 고르게 */
function auto(all) {
  if (!PLAN.cells.length) { alert('먼저 셀을 개설해주세요. (“지금 셀 이름 · 셀장으로 틀 만들기” 를 쓰면 편합니다)'); return; }
  if (all && !confirm('셀장을 뺀 모든 배정을 지우고 처음부터 다시 나눌까요?')) return;
  if (all) PLAN.cells.forEach(function (c) { c.members = []; });
  var people = poolNames().map(person);
  if (!people.length) { alert('배정할 분이 없습니다.'); return; }
  var every = people.concat([]); PLAN.cells.forEach(function (c) { (c.leader ? [c.leader] : []).concat(c.members).forEach(function (n) { every.push(person(n)); }); });
  var avg = function (a) { return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : 0; };
  var gAge = avg(every.filter(function (p) { return p.age != null; }).map(function (p) { return p.age; }));
  var gRate = avg(every.filter(function (p) { return p.rate != null; }).map(function (p) { return p.rate; }));
  // 섞은 뒤 요주 → 출석률 높은 순 (같은 수준끼리는 무작위)
  for (var i = people.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = people[i]; people[i] = people[j]; people[j] = t; }
  people.sort(function (a, b) {
    var fa = D.flagMap[a.name] ? 1 : 0, fb = D.flagMap[b.name] ? 1 : 0;
    if (fa !== fb) return fb - fa;
    var ra = a.rate == null ? gRate : a.rate, rb = b.rate == null ? gRate : b.rate;
    return Math.round(rb / 10) - Math.round(ra / 10);
  });
  var st = PLAN.cells.map(function (c) {
    var ps = (c.leader ? [c.leader] : []).concat(c.members).map(person);
    return { n: ps.length, m: ps.filter(function (p) { return p.gender === '남'; }).length, f: ps.filter(function (p) { return p.gender === '여'; }).length,
      ages: ps.filter(function (p) { return p.age != null; }).map(function (p) { return p.age; }),
      rates: ps.filter(function (p) { return p.rate != null; }).map(function (p) { return p.rate; }),
      flag: ps.filter(function (p) { return D.flagMap[p.name]; }).length };
  });
  people.forEach(function (p) {
    var best = -1, bestCost = Infinity;
    st.forEach(function (s, k) {
      var cost = s.n * 10 + (p.gender === '남' ? s.m : p.gender === '여' ? s.f : 0) * 7;
      if (D.flagMap[p.name]) cost += s.flag * 60;
      if (p.rate != null && s.rates.length) cost += (avg(s.rates) - gRate) * (p.rate - gRate) * 0.004;
      if (p.age != null && s.ages.length) cost += (avg(s.ages) - gAge) * (p.age - gAge) * 0.15;
      cost += Math.random() * 0.8;
      if (cost < bestCost) { bestCost = cost; best = k; }
    });
    var s = st[best];
    s.n++; if (p.gender === '남') s.m++; if (p.gender === '여') s.f++;
    if (p.age != null) s.ages.push(p.age); if (p.rate != null) s.rates.push(p.rate); if (D.flagMap[p.name]) s.flag++;
    PLAN.cells[best].members.push(p.name);
  });
  DIRTY = true; paint();
  say(people.length + '명을 자동 배정했습니다. 마음에 들지 않으면 다시 누르거나 끌어서 조정하세요. (저장을 눌러야 남습니다)');
}

function savePlan(status) {
  var msg = { '확정': '편성을 확정할까요?\n확정하면 수정이 잠깁니다. (공개 전까지는 커미티만 봅니다)', '작성중': '' }[status];
  if (msg && !confirm(msg)) return;
  if (PLAN.status === '공개' && status === '확정' && !confirm('공개를 취소할까요? 포털에서 “내 셀” 이 다시 보이지 않게 됩니다.')) return;
  callServer('saveCellPlan', [KEY, D.year, PLAN.cells, status, PLAN.extra || []], function (r) {
    load(r);
    say({ '작성중': '저장했습니다.', '확정': '확정했습니다.', '공개': '공개했습니다.' }[status] || '저장했습니다.');
  }, function (e) { say(e.message, true); });
}
function publish() {
  if (!confirm(D.year + ' 셀 편성을 공개할까요?\n포털에서 각자 “내 셀” 이 보입니다.\n(지금 운영 중인 셀목록 · 셀보고서는 “새 셀년도 시작” 을 누를 때 바뀝니다)')) return;
  savePlan('공개');
}
function applyPlan() {
  if (!confirm('새 셀년도를 시작할까요?\n\n셀목록 · 셀원명단이 이 편성으로 바뀌고, 셀모임 보고서도 새 셀로 받습니다.\n지금 명단은 “셀명단보관” 시트에 남겨 둡니다.')) return;
  if (!confirm('정말 바꿀까요? 이 작업은 되돌리기 어렵습니다.')) return;
  callServer('applyCellPlan', [KEY, D.year], function (r) { load(r); say('새 셀년도를 시작했습니다. 셀목록 · 셀원명단을 바꿨습니다.'); }, function (e) { say(e.message, true); });
}
window.addEventListener('beforeunload', function (e) { if (DIRTY) { e.preventDefault(); e.returnValue = ''; } });
start('');
</script>
