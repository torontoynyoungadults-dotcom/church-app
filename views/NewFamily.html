<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* 새가족 관리 — 구조만 정의합니다. 색·여백·버튼은 Theme 이 맡습니다 */
  :root { --accent: #2A8C94; --tone-rgb: 42,140,148; }
  * { box-sizing: border-box; }

  .frow { display: flex; gap: 8px; }
  .frow > div { flex: 1; min-width: 0; }
  /* 주차 코멘트 — 넉넉하게 적을 수 있도록 */
  textarea.bignote { min-height: 190px !important; line-height: 1.75; font-size: 15px; padding: 12px 13px; }
  .pwbox { width: 190px; margin: 0 auto; display: block; }
  .pwsubmit { width: 190px !important; margin: 10px auto 0; display: block; }

  /* 단계 묶음 */
  .stage { margin-bottom: 8px; }
  .stagehead {
    display: flex; align-items: center; gap: 9px; cursor: pointer;
    padding: 11px 13px; background: var(--ink-1); border-radius: var(--r-md); color: #fff;
    box-shadow: var(--sh-1);
  }
  .stagehead.empty { background: var(--sunken); color: var(--ink-3); box-shadow: none; }
  .stagehead .t { font-size: 13.5px; font-weight: 750; flex: 1; letter-spacing: -0.015em; }
  .stagehead .c {
    background: var(--tone); color: #fff; font-size: 11.5px; font-weight: 800;
    min-width: 22px; height: 22px; border-radius: 99px; display: inline-flex;
    align-items: center; justify-content: center; padding: 0 7px;
    font-variant-numeric: tabular-nums;
  }
  .stagehead.empty .c { background: #C9C4BC; }
  .stagehead .cv { font-size: 10px; transition: transform .15s; color: inherit !important; opacity: .55; }
  .stage.open .stagehead .cv { transform: rotate(90deg); }
  .stagebody { display: none; padding: 9px 0 3px; }
  .stage.open .stagebody { display: block; }

  /* 새가족 카드 */
  .nfcard { padding: 13px 14px; margin-bottom: 8px; }
  .nfhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; cursor: pointer; }
  .nfname { font-size: 15px; font-weight: 800; }
  .nftrait { font-size: 12px; color: var(--ink-3); }
  .owner {
    color: var(--tone) !important; background: var(--tone-soft) !important;
    border-radius: 99px !important; margin-left: auto; white-space: nowrap;
  }
  .owner.none { color: var(--ink-3) !important; background: var(--sunken) !important; }

  /* 주차 */
  .weeks { display: flex; gap: 5px; margin-top: 11px; }
  .wk {
    flex: 1; text-align: center; padding: 7px 2px; border-radius: var(--r-sm); cursor: pointer;
    border: 1px solid var(--hair-2); background: #FBFAF8; font-size: 11.5px; font-weight: 750;
    color: var(--ink-3); transition: background .12s, border-color .12s, color .12s;
  }
  .wk.on { background: var(--tone-soft); border-color: var(--tone); color: var(--tone); }
  .wk.next { border-color: var(--tone); color: var(--tone); box-shadow: 0 0 0 1px var(--tone) inset; }
  .wk small { display: block; font-size: 9.5px; font-weight: 600; margin-top: 1px; opacity: .8; }

  .detail { border-top: 1px solid var(--hair); margin-top: 12px; padding-top: 12px; display: none; }
  .detail.open { display: block; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 9px 13px; }
  .fld .fk { font-size: 10.5px; color: var(--ink-3); font-weight: 750; }
  .fld .fv { font-size: 13px; margin-top: 1px; }

  /* 기록 */
  .steprec {
    background: #FBFAF8; border: 1px solid var(--hair); border-left: 3px solid var(--tone);
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    padding: 10px 12px; margin-bottom: 6px; font-size: 12.5px;
  }
  .steprec .sh { font-weight: 750; }
  .steprec .sn { color: var(--ink-3); white-space: pre-wrap; margin-top: 5px; line-height: 1.65; }
  .steprec .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
  .steprec .chips span {
    background: #fff; border: 1px solid var(--hair-2); border-radius: var(--r-xs);
    padding: 3px 9px 3px 3px; font-size: 11.5px; display: inline-flex; align-items: center; gap: 5px;
  }
  .steprec .chips span em {
    font-style: normal; font-size: 10px; font-weight: 800; color: var(--ink-3);
    background: var(--canvas); border-radius: 5px; padding: 2px 6px; letter-spacing: 0.02em;
  }
  .steprec .chips span.flag { border-color: #E6B5AA; background: #FDF1EE; }
  .steprec .chips span.flag em { background: #FBE2DB; color: var(--bad); }
  .logrec {
    background: #FBFAF8; border: 1px solid var(--hair); border-left: 3px solid #C9C4BC;
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    padding: 9px 11px; margin-bottom: 5px; font-size: 12.5px;
    display: flex; gap: 9px; align-items: flex-start;
  }
  .logrec .d { color: var(--ink-3); font-weight: 750; white-space: nowrap; font-size: 11.5px; }
  .logrec .x { flex: 1; white-space: pre-wrap; }
  .stxt { font-size: 12.5px; margin-top: 7px; line-height: 1.65; }
  .stxt b {
    display: inline-block; font-size: 10.5px; color: var(--ink-3); font-weight: 800;
    background: var(--canvas); border-radius: 5px; padding: 1px 7px; margin-right: 6px;
  }
  .stxt.warn { color: var(--bad); }
  .stxt.warn b { background: #FBE2DB; color: var(--bad); }

  .empty { text-align: left !important; padding: 10px 2px !important; }
  .skel.row { height: 46px; margin-bottom: 8px; }

  /* 사진 */
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; object-fit: cover; flex: none;
    border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12); cursor: zoom-in;
  }
  .avatar.ph {
    display: inline-flex; align-items: center; justify-content: center; cursor: default;
    background: var(--tone-soft); color: var(--tone); font-weight: 800; font-size: 15px;
  }
  .photobox { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
  .photobox img {
    width: 96px; height: 96px; border-radius: var(--r-lg); object-fit: cover; cursor: zoom-in;
    box-shadow: var(--sh-2); flex: none;
  }
  .photoempty {
    width: 96px; height: 96px; border-radius: var(--r-lg); flex: none;
    background: var(--canvas); color: var(--ink-3); font-size: 11.5px;
    display: flex; align-items: center; justify-content: center; border: 1px dashed var(--hair-2);
  }
  .photobtns { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .photobtns label { cursor: pointer; }
  #lightbox {
    position: fixed; inset: 0; background: rgba(10,10,10,.92); z-index: 1000;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  #lightbox.on { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 14px; }
  #lightbox .lbclose {
    position: absolute; top: 14px; right: 20px; color: #fff; font-size: 34px; line-height: 1; cursor: pointer;
  }
  .cellok { display: flex; gap: 10px; align-items: flex-start; background: #FFF6EF; border: 1px solid #F6D2BA; border-radius: 12px; padding: 11px 12px; cursor: pointer; }
  .cellok input { margin-top: 3px; width: 18px; height: 18px; accent-color: #D2511F; flex: none; }
  .cellok b { display: block; font-size: 14px; }
  .cellok em { display: block; font-style: normal; font-size: 12px; color: var(--ink-3); margin-top: 2px; line-height: 1.6; }
</style>
<!--#include Theme-->
</head>
<body>
<div class="shell">
  <header>
    <img src="/logo.png" alt="Youngnak">
    <h1>새가족 관리</h1>
    <p class="meta">YNTORONTO &nbsp;·&nbsp; NEW FAMILY</p>
  </header>

  <div class="panel" id="lock">
    <div style="text-align:center;padding:14px 4px 8px;">
      <p class="hint" style="margin-bottom:18px;">새가족팀 <b style="color:var(--ink);">숫자 비밀번호</b>를 입력해주세요.</p>
      <input type="password" id="pw" class="pwbox" placeholder="&#8226;&#8226;&#8226;&#8226;" inputmode="numeric"
        maxlength="10" autocomplete="one-time-code" oninput="onlyDigits(this)">
      <button class="btn accent pwsubmit" onclick="doLogin()">들어가기</button>
      <p class="msg err" id="pwMsg"></p>
    </div>
  </div>

  <div id="main" style="display:none;">
    <div id="notifyBox"></div>
    <div class="panel">
      <button class="btn dark full" onclick="openForm()">+ 새가족 등록</button>
      <div id="formBox" style="display:none;margin-top:12px;"></div>
    </div>

    <div class="panel">
      <span class="chip">단계별 명단</span>
      <p class="hint">단계를 누르면 해당하는 분들이 펼쳐집니다. 주차 칸을 누르면 그 자리에서 기록할 수 있습니다.</p>
      <div class="frow" style="margin-bottom:11px;">
        <div><input type="text" id="filterName" placeholder="이름으로 찾기" oninput="renderList()"></div>
        <div><select id="filterOwner" onchange="renderList()"><option value="">담당자 전체</option></select></div>
      </div>
      <div id="list"><div class="skel row"></div><div class="skel row"></div><div class="skel row"></div></div>
    </div>
  </div>

  <div id="lightbox" onclick="closePhoto()">
    <img id="lightboxImg" alt="">
    <span class="lbclose">&times;</span>
  </div>

  <footer>
    해외한인장로회 토론토영락교회 &nbsp;|&nbsp; 담임목사 : 전대혁 &nbsp;|&nbsp; 청년1부 목사: 강산<br>
    650 McNicoll Ave. Toronto, ON M2H 2E1 &nbsp;|&nbsp; www.ynchurch.com
  </footer>
</div>

<script>
window.onerror = function (msg) {
  var b = document.getElementById('pwMsg');
  if (b) { b.textContent = '화면 오류: ' + msg; }
  var l = document.getElementById('lock');
  if (l) l.style.display = 'block';
};
var PREFILL = (window.__PREFILL__ || {});
var TOKEN = '', OPT = {}, STAFF = [], STAGES = [], DATA = [], CELLS = [], WEEKS = {};
var openId = '', openStages = {}, picked = {};

function el(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function cssId(x) { return String(x).replace(/[^A-Za-z0-9가-힣]/g, '_'); }
function jsq(x) { return String(x).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

function onlyDigits(b) { var v = b.value.replace(/[^0-9]/g, ''); if (v !== b.value) b.value = v; el('pwMsg').textContent = ''; }
function today() {
  var d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
function staffOptions(id, cur) {
  var names = STAFF.map(function (s) { return s.name; });
  if (cur && names.indexOf(cur) === -1) names.unshift(cur);
  return '<select id="' + id + '"><option value="">선택 안 함</option>' +
    names.map(function (n) {
      return '<option value="' + esc(n) + '"' + (cur === n ? ' selected' : '') + '>' + esc(n) + '</option>';
    }).join('') + '</select>';
}
function defaultStaff(week) {
  var m = STAFF.filter(function (s) { return s.week === week; })[0];
  return m ? m.name : '';
}

function pickHtml(key, cur) {
  picked[key] = cur || '';
  return '<div class="picklist" id="pk_' + key + '">' +
    (OPT[key] || []).map(function (p, i) {
      return '<button type="button" class="' + (cur === p[0] ? 'picked' : '') + '" ' +
        'onclick="pickIt(\'' + key + '\',' + i + ')">' +
        '<span class="emo">' + p[1] + '</span><span>' + esc(p[0]) + '</span></button>';
    }).join('') + '</div>';
}
function pickIt(key, i) {
  picked[key] = OPT[key][i][0];
  var box = el('pk_' + key);
  for (var j = 0; j < box.children.length; j++) box.children[j].className = (j === i) ? 'picked' : '';
  refreshConditional();
}
function emojiOf(key, label) {
  var f = (OPT[key] || []).filter(function (p) { return p[0] === label; })[0];
  return f ? f[1] + ' ' : '';
}

/* ---------- 로그인 ---------- */

/* 포털에서 넘어왔으면 본인 확인이 끝났으니 비밀번호를 묻지 않습니다 */
if (PREFILL && PREFILL.t) TOKEN = PREFILL.t;
else { try { TOKEN = sessionStorage.getItem('ynNfToken') || ''; } catch (e) {} }
if (!TOKEN && window.YN_KEPT) TOKEN = YN_KEPT();        // 포털 구글 로그인이 남아 있으면 그대로
if (TOKEN) { el('lock').style.display = 'none'; tryLogin(TOKEN, true); } else showLock();

function showLock() {
  el('lock').style.display = 'block';
  el('pw').focus();
  el('pw').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') doLogin(); });
}
function doLogin() { tryLogin(el('pw').value.trim(), false); }

function tryLogin(pw, silent) {
  if (!pw) { el('pwMsg').textContent = '비밀번호를 입력해주세요.'; return; }
  if (!silent) el('pwMsg').textContent = '확인 중…';
  callServer('newFamilyLogin', [pw], function (res) {
      TOKEN = res.token;
      try { sessionStorage.setItem('ynNfToken', res.token); } catch (e) {}
      el('lock').style.display = 'none';
      el('main').style.display = 'block';
      // 로그인 응답에 목록이 함께 오므로 바로 그립니다
      DATA = res.list; STAFF = res.staff; STAGES = res.stages; OPT = res.options; CELLS = res.cells || []; WEEKS = res.weeks || {};
      renderNotify(res);
      renderList();
    }, function (e) {
      try { sessionStorage.removeItem('ynNfToken'); } catch (e2) {}
      if (silent) showLock();
      else { el('pwMsg').textContent = e.message || '로그인에 실패했습니다.'; el('pw').select(); }
    });
}

/* ---------- 목록 ---------- */

function load() {
  callServer('getNewFamilies', [TOKEN], function (res) {
      DATA = res.list; STAFF = res.staff; STAGES = res.stages; OPT = res.options; CELLS = res.cells || []; WEEKS = res.weeks || {};
      renderNotify(res);
      renderList();
    }, function (e) { el('list').innerHTML = '<p class="empty">' + esc(e.message) + '</p>'; });
}

function renderList() {
  // 담당자 드롭다운 채우기 (선택값 유지)
  var sel = el('filterOwner'), cur = sel.value;
  var owners = STAFF.map(function (x) { return x.name; });
  DATA.forEach(function (n) { if (n.owner && owners.indexOf(n.owner) === -1) owners.push(n.owner); });
  sel.innerHTML = '<option value="">담당자 전체</option>' +
    '<option value="__none">담당 미지정</option>' +
    owners.map(function (o) {
      return '<option value="' + esc(o) + '"' + (cur === o ? ' selected' : '') + '>' + esc(o) + '</option>';
    }).join('');
  if (cur === '__none') sel.value = '__none';

  var fn = el('filterName').value.trim();
  var fo = sel.value;
  var pool = DATA.filter(function (n) {
    if (fn && n.name.indexOf(fn) === -1) return false;
    if (fo === '__none') return !n.owner;
    if (fo) return n.owner === fo;
    return true;
  });

  el('list').innerHTML = STAGES.map(function (st) {
    var group = pool.filter(function (n) { return n.stage === st; });
    var open = openStages[st] || (fn && group.length);
    return '<div class="stage' + (open ? ' open' : '') + '" id="st_' + st + '">' +
      '<div class="stagehead' + (group.length ? '' : ' empty') + '" onclick="toggleStage(\'' + st + '\')">' +
        '<span class="cv">&#9654;</span><span class="t">' + esc(st) + '</span>' +
        '<span class="c">' + group.length + '</span></div>' +
      '<div class="stagebody">' +
        (group.length ? group.map(cardHtml).join('') : '<p class="empty">해당하는 분이 없습니다.</p>') +
      '</div></div>';
  }).join('');

  if (openId) { var d = el('d' + cssId(openId)); if (d) d.classList.add('open'); }
}

function toggleStage(st) {
  openStages[st] = !openStages[st];
  el('st_' + st).classList.toggle('open');
}

function cardHtml(n) {
  var weeks = [1, 2, 3, 4].map(function (w) {
    var s = n.steps.filter(function (x) { return x.week === w; })[0];
    var cls = s ? 'wk on' : (w === n.nextWeek ? 'wk next' : 'wk');
    return '<div class="' + cls + '" onclick="event.stopPropagation();openStep(\'' + jsq(n.id) + '\',' + w + ')">' +
      w + '주<small>' + (s ? esc(s.by) : '미진행') + '</small></div>';
  }).join('');

  return '<div class="nfcard">' +
    '<div class="nfhead" onclick="toggleDetail(\'' + jsq(n.id) + '\')">' +
      avatarHtml(n) +
      '<span class="nfname">' + esc(n.name) + '</span>' +
      (n.note ? '<span class="nftrait">' + esc(n.note) + '</span>' : '') +
      '<span class="owner' + (n.owner ? '' : ' none') + '" ' +
        'onclick="event.stopPropagation();openOwnerPick(\'' + jsq(n.id) + '\')">' +
        (n.owner ? '담당 ' + esc(n.owner) : '담당 미지정') + '</span>' +
    '</div>' +
    '<div id="ow' + cssId(n.id) + '" class="ownerpick" style="display:none;"></div>' +
    '<div class="weeks">' + weeks + '</div>' +
    '<div class="detail" id="d' + cssId(n.id) + '">' + detailHtml(n) + '</div>' +
  '</div>';
}

function doAssign(name) {
  var cell = el('ac' + cssId(name)).value, msg = el('amsg' + cssId(name));
  if (!cell) { msg.className = 'msg err'; msg.textContent = '배정할 셀을 선택해주세요.'; return; }
  if (!confirm(cell + '로 배정합니다. 셀원 명단에도 자동으로 추가됩니다.\n계속할까요?')) return;
  msg.className = 'msg'; msg.textContent = '배정하는 중…';
  callServer('assignNewFamilyCell', [TOKEN, name, cell], function () { openId = name; load(); }, function (e) { msg.className = 'msg err'; msg.textContent = e.message || '배정 실패'; });
}

function saveTrack(name) {
  var m = el('tm' + cssId(name)).value, st = el('ts' + cssId(name)).value;
  var memo = el('tn' + cssId(name)).value.trim(), msg = el('tmsg' + cssId(name));
  if (!m) { msg.className = 'msg err'; msg.textContent = '확인 월을 선택해주세요.'; return; }
  msg.className = 'msg'; msg.textContent = '저장하는 중…';
  callServer('saveTracking', [TOKEN, name, m, st, memo, ''], function () { openId = name; load(); }, function (e) { msg.className = 'msg err'; msg.textContent = e.message || '저장 실패'; });
}

function openOwnerPick(name) {
  var box = el('ow' + cssId(name));
  if (box.style.display === 'block') { box.style.display = 'none'; return; }
  var n = DATA.filter(function (x) { return x.id === name; })[0] || {};
  box.innerHTML = '<select onchange="setOwner(\'' + jsq(name) + '\', this.value)">' +
    '<option value="">담당 미지정</option>' +
    STAFF.map(function (m) {
      return '<option value="' + esc(m.name) + '"' + (n.owner === m.name ? ' selected' : '') + '>' +
        esc(m.name) + '</option>';
    }).join('') + '</select>';
  box.style.display = 'block';
}

function setOwner(name, owner) {
  callServer('setNewFamilyOwner', [TOKEN, name, owner], function () { load(); }, function (e) { alert(e.message || '변경 실패'); });
}

function setCellApp(name, box) {
  box.disabled = true;
  callServer('setNewcomerCellApp', [TOKEN, name, box.checked], function () { box.disabled = false; openId = name; load(); },
    function (e) { box.disabled = false; box.checked = !box.checked; alert(e.message || '바꾸지 못했습니다.'); });
}

/* 새가족 등록 알림 이메일 (커미티) */
function renderNotify(res) {
  var box = el('notifyBox');
  if (!box) return;
  if (!res || !res.canNotify) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="panel"><span class="chip">새가족 등록 알림 이메일</span>' +
    '<p class="hint">포털에서 새가족이 스스로 등록하면 이 주소로 메일이 갑니다. 여러 개는 쉼표로 나눠 주세요. (커미티만 보입니다)</p>' +
    '<div class="frow"><div><input type="text" id="nfNotify" value="' + esc(res.notifyEmails || '') + '" placeholder="newfamily@example.com, pastor@example.com"></div>' +
    '<button class="btn accent" onclick="saveNotify()">저장</button></div>' +
    (res.notifySet ? '' : '<p class="hint" style="margin:6px 0 0;">아직 따로 정하지 않아, 새가족팀 · 양육부 팀 이메일과 알림 이메일로 보내고 있습니다.</p>') +
    '<p class="msg" id="nfNotifyMsg"></p></div>';
}
function saveNotify() {
  var m = el('nfNotifyMsg'); m.className = 'msg'; m.textContent = '저장 중…';
  callServer('saveNewcomerNotify', [TOKEN, el('nfNotify').value], function (v) { el('nfNotify').value = v; m.className = 'msg ok'; m.textContent = '저장했습니다.'; },
    function (e) { m.className = 'msg err'; m.textContent = e.message || '저장하지 못했습니다.'; });
}

/** 과정 기록의 객관식 → [옵션키, 짧은 라벨, 값, 강조여부] */
function stepChips(s) {
  return [
    ['신앙배경', '신앙', s.faithBg], ['교회오게된계기', '계기', s.reason],
    ['신앙이해도', '이해도', s.understanding], ['성격분위기', '성격', s.personality],
    ['호응도', '호응', s.response], ['공동체관심', '공동체', s.community],
    ['교회내아는사람', '지인', s.acquaint], ['섬김관심', '섬김', s.serving],
    ['다음참석전망', '다음 주', s.outlook],
    ['이단주의', '이단', s.heresy, s.heresy === '주의 필요']
  ].filter(function (p) { return p[2]; });
}

/** 과정 기록의 주관식 → [라벨, 내용, 경고여부] */
function stepTexts(s) {
  return [
    ['원하는 사역', s.servingWish], ['공동체에 바라는 점', s.expect],
    ['주의 내용', s.heresyNote, true], ['셀 배정 유의사항', s.assignNote]
  ].filter(function (t) { return t[1]; });
}

function belongText(list) {
  if (!list || !list.length) return '';
  return list.map(function (x) {
    var t = (typeof x === 'string') ? x : x.team;
    var r = (typeof x === 'string') ? '' : x.role;
    return t + (r ? ' · ' + r : '');
  }).join(', ');
}

/* ---------- 주차 기록 ---------- */


var STEP_FIELDS = [], STEP_VALUES = {};

/** 필드 key 로 저장하고, opt 로 선택지를 고르는 이모지 목록 */
function pickHtmlKey(key, optKey, cur) {
  picked[key] = cur || '';
  return '<div class="picklist" id="pk_' + key + '">' +
    (OPT[optKey] || []).map(function (p, i) {
      return '<button type="button" class="' + (cur === p[0] ? 'picked' : '') + '" ' +
        'onclick="pickField(\'' + key + '\',\'' + optKey + '\',' + i + ')">' +
        '<span class="emo">' + p[1] + '</span><span>' + esc(p[0]) + '</span></button>';
    }).join('') + '</div>';
}

function pickField(key, optKey, i) {
  var v = OPT[optKey][i][0];
  picked[key] = (picked[key] === v) ? '' : v;   // 다시 누르면 선택 해제
  var box = el('pk_' + key);
  for (var j = 0; j < box.children.length; j++) {
    box.children[j].className = (picked[key] && j === i) ? 'picked' : '';
  }
  refreshConditional();
}

/** showIf 조건에 따라 칸을 보이고 숨깁니다 */
function refreshConditional() {
  (STEP_FIELDS || []).forEach(function (f) {
    if (!f.showIf) return;
    var wrap = el('fw_' + f.key);
    if (!wrap) return;
    var v = picked[f.showIf.key] || '';
    var show = false;
    if (f.showIf.in) show = f.showIf.in.indexOf(v) !== -1;
    else if (f.showIf.notIn) show = !!v && f.showIf.notIn.indexOf(v) === -1;
    wrap.style.display = show ? 'block' : 'none';
  });
}

function openStep(nfId, week) {
  var n = DATA.filter(function (x) { return x.id === nfId; })[0];
  if (!n) return;
  var s = n.steps.filter(function (x) { return x.week === week; })[0] || {};
  var W = WEEKS[week] || { topic: '', fields: [] };
  picked = {};
  STEP_FIELDS = W.fields;
  STEP_VALUES = {};

  var fieldsHtml = W.fields.map(function (f) {
    var val = s[f.key] || '';
    var cond = f.showIf ? ' data-cond="' + esc(f.key) + '"' : '';
    if (f.type === 'pick') {
      STEP_VALUES[f.key] = val;
      return '<div class="f"' + cond + ' id="fw_' + f.key + '"><label class="fl">' + esc(f.label) + '</label>' +
        pickHtmlKey(f.key, f.opt, val) + '</div>';
    }
    return '<div class="f"' + cond + ' id="fw_' + f.key + '"><label class="fl">' + esc(f.label) + '</label>' +
      '<input type="text" id="tx_' + f.key + '" placeholder="' + esc(f.placeholder || '') + '" value="' + esc(val) + '"></div>';
  }).join('');

  var box = el('formBox');
  box.style.display = 'block';
  box.innerHTML =
    '<div style="font-size:16px;font-weight:800;margin-bottom:2px;">' + esc(n.name) + ' &middot; ' + week + '주차</div>' +
    '<p class="hint">' + esc(W.topic) + '</p>' +
    '<div class="frow">' +
      '<div class="f"><label class="fl">진행일</label><input type="date" id="sDate" value="' + esc(s.date || today()) + '"></div>' +
      '<div class="f"><label class="fl">담당자 *</label>' + staffOptions('sBy', s.by || defaultStaff(week)) + '</div>' +
    '</div>' +
    fieldsHtml +
    '<div class="f"><label class="fl">코멘트</label>' +
      '<textarea id="sNote" rows="9" class="bignote" oninput="growNote(this)" ' +
      'placeholder="나눈 내용, 기억할 점, 기도제목 등 &mdash; 길게 적으셔도 됩니다">' + esc(s.note || '') + '</textarea></div>' +
    '<div style="display:flex;gap:6px;margin-top:12px;">' +
      '<button class="btn" style="flex:1;" onclick="closeForm()">취소</button>' +
      (s.week ? '<button class="btn danger" onclick="delStep(\'' + jsq(nfId) + '\',' + week + ')">삭제</button>' : '') +
      '<button class="btn accent" style="flex:1;" onclick="saveStep(\'' + jsq(nfId) + '\',' + week + ')">저장</button>' +
    '</div>' +
    '<p class="msg" id="formMsg"></p>';

  refreshConditional();
  growNote(el('sNote'));
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/** 코멘트 칸은 적는 만큼 저절로 늘어납니다 */
function growNote(t) {
  if (!t) return;
  t.style.height = 'auto';
  t.style.height = Math.min(Math.max(t.scrollHeight + 4, 190), 520) + 'px';
}

function saveStep(nfId, week) {
  var msg = el('formMsg');
  msg.className = 'msg'; msg.textContent = '저장하는 중…';

  var payload = {
    newFamilyId: nfId, week: week,
    date: el('sDate').value, by: el('sBy').value,
    note: el('sNote').value.trim()
  };
  (STEP_FIELDS || []).forEach(function (f) {
    var wrap = el('fw_' + f.key);
    var hidden = wrap && wrap.style.display === 'none';
    if (f.type === 'pick') payload[f.key] = hidden ? '' : (picked[f.key] || '');
    else payload[f.key] = hidden ? '' : (el('tx_' + f.key).value.trim());
  });

  callServer('saveNewFamilyStep', [TOKEN, payload], function () { openId = nfId; closeForm(); load(); }, function (e) { msg.className = 'msg err'; msg.textContent = e.message || '저장 실패'; });
}

function delStep(nfId, week) {
  if (!confirm(week + '주차 기록을 삭제할까요?')) return;
  callServer('deleteNewFamilyStep', [TOKEN, nfId, week], function () { openId = nfId; closeForm(); load(); }, function (e) { alert(e.message || '삭제 실패'); });
}
</script>
