<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/forms/forms.css?v=7">
<style>
  :root { --accent: #D2511F; --tone-rgb: 210,81,31; }
  body .shell { max-width: 960px !important; margin: 0 auto; padding-bottom: 20px; }
  * { box-sizing: border-box; }

  /* 목록 */
  .fcard {
    display: flex; align-items: flex-start; gap: 12px; padding: 14px 15px;
    border-top: 1px solid var(--hair); cursor: pointer;
  }
  .fcard:first-of-type { border-top: none; }
  .fcard:hover { background: var(--sunken); }
  .fcard .fb { flex: 1; min-width: 0; }
  .fcard .ft { font-size: 15.5px; font-weight: 800; letter-spacing: -0.02em; }
  .fcard .fm { font-size: 13.5px; color: var(--ink-3); margin-top: 3px; }
  .fcard .fn { flex: none; text-align: center; min-width: 54px; }
  .fcard .fn b { display: block; font-size: 20px; font-weight: 800; line-height: 1.1; }
  .fcard .fn span { font-size: 11.5px; color: var(--ink-3); font-weight: 750; }

  .st { display: inline-block; font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
  .st.준비중 { background: var(--sunken); color: var(--ink-3); }
  .st.받는중 { background: var(--good-bg); color: var(--good); }
  .st.마감  { background: #FBE9E2; color: #B24A22; }
  .st.보관  { background: var(--sunken); color: var(--ink-4); }

  /* 본보기 고르기 */
  .tpl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
  @media (min-width: 620px) { .tpl { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .tpl button {
    display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left;
    background: #fff; border: 1px solid var(--hair-2); border-radius: 14px; padding: 13px 13px;
    font-family: inherit; cursor: pointer; color: var(--ink-1);
  }
  .tpl button:hover { border-color: var(--tone); }
  .tpl .i { font-size: 20px; }
  .tpl .n { font-size: 15px; font-weight: 800; }
  .tpl .d { font-size: 12.5px; color: var(--ink-3); line-height: 1.55; }
  .tpl button { position: relative; }
  .tpl .mytag { position: absolute; top: 8px; right: 8px; font-size: 10.5px; font-weight: 800;
    background: var(--tone); color: #fff; border-radius: 5px; padding: 2px 6px; }
  .tpl .tdel { position: absolute; bottom: 7px; right: 9px; font-size: 11.5px; color: var(--ink-4); font-weight: 700; }
  .tpl .tdel:hover { color: var(--danger); }

  /* 문항 만들기 */
  .q { border: 1px solid var(--hair-2); border-radius: 14px; padding: 12px 13px; margin-bottom: 9px; background: #fff; }
  .q.sel { border-color: var(--tone); box-shadow: 0 0 0 3px rgba(210,81,31,.1); }
  .qhead { display: flex; align-items: center; gap: 8px; }
  .qhead .qi { font-size: 16px; width: 26px; text-align: center; flex: none; }
  .qhead .qn { flex: 1; min-width: 0; font-size: 15.5px; font-weight: 750; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qhead .qt { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .qbtn { border: none; background: none; cursor: pointer; font-size: 16px; color: var(--ink-3); padding: 3px 5px; font-family: inherit; }
  .qbtn:hover { color: var(--ink-1); }
  .qbody { margin-top: 10px; border-top: 1px solid var(--hair); padding-top: 11px; }
  .qrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .qrow > div { flex: 1; min-width: 120px; }
  .opts { display: flex; flex-direction: column; gap: 6px; }
  .optrow { display: flex; gap: 6px; align-items: center; }
  .optrow input { flex: 1; }
  .optrow button { flex: none; }
  .addq { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin-top: 4px; }
  .addq button {
    background: #fff; border: 1px dashed var(--hair-2); border-radius: 11px; padding: 10px 6px;
    font-family: inherit; font-size: 13.5px; font-weight: 700; color: var(--ink-2); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .addq button:hover { border-color: var(--tone); color: var(--tone); }
  .addq .i { font-size: 16px; }
  .req { color: var(--danger); }

  /* 결과 */
  .rstat { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .rstat .b { background: #fff; border: 1px solid var(--hair); border-radius: 12px; padding: 9px 13px; font-size: 13px; color: var(--ink-3); }
  .rstat .b b { display: block; font-size: 19px; color: var(--ink-1); }
  .fbars { margin-bottom: 14px; }
  .fbars .bl { font-size: 14.5px; font-weight: 750; margin-bottom: 6px; }
  .fbar { display: flex; align-items: center; gap: 9px; margin-bottom: 5px; font-size: 13.5px; }
  .fbar .bn { width: 110px; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
  .fbar .bg { flex: 1; height: 16px; background: var(--sunken); border-radius: 5px; overflow: hidden; }
  .fbar .bg i { display: block; height: 100%; background: var(--tone); border-radius: 5px; }
  .fbar .bv { width: 40px; flex: none; text-align: right; font-weight: 750; font-variant-numeric: tabular-nums; }
  .tscroll { overflow-x: auto; border-radius: 12px; border: 1px solid var(--hair); background: #fff; }
  table.res { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.res th { text-align: left; background: #F7F4EF; color: var(--ink-3); font-weight: 750; font-size: 12.5px; padding: 9px 9px; white-space: nowrap; }
  table.res td { padding: 9px; border-top: 1px solid var(--hair); vertical-align: top; white-space: nowrap; }
  table.res td.wrap { white-space: pre-wrap; min-width: 160px; }
  .drop { border: none; background: none; color: var(--ink-4); cursor: pointer; font-size: 16px; font-family: inherit; }
  .drop:hover { color: var(--danger); }

  .bar2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .bar2 .sp { flex: 1; }
  .backb {
    display: inline-flex; align-items: center; gap: 5px; background: var(--night-2); border: 1px solid var(--hair-night);
    color: #F5F3EF; border-radius: 99px; padding: 7px 14px 7px 11px; font: 750 14.5px inherit; font-family: inherit; cursor: pointer;
  }
  .lnk { font-size: 13.5px; color: var(--ink-3); word-break: break-all; }

  /* 체크 상자 */
  .lkchg { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.65; cursor: pointer; }
  .lkchg input[type=checkbox] {
    -webkit-appearance: checkbox; appearance: auto; width: 18px; height: 18px; min-height: 0;
    margin: 2px 0 0; padding: 0; border: none; border-radius: 0; box-shadow: none; background: none;
    flex: none; accent-color: #D2511F;
  }
  .lkchg em { display: block; font-style: normal; color: var(--ink-3); font-size: 13px; margin-top: 2px; }

  /* ---------- 유리 느낌 (배경이 비치는 카드) — 포털과 같은 결 ---------- */
  body .panel {
    background: rgba(255,255,255,.07) !important;
    border: 1px solid rgba(255,255,255,.14) !important;
    color: var(--night-ink) !important;
    box-shadow: 0 8px 26px rgba(0,0,0,.26) !important;
    -webkit-backdrop-filter: blur(20px) saturate(155%); backdrop-filter: blur(20px) saturate(155%);
  }
  body .panel .chip { color: #FFFFFF !important; }
  body .panel .hint, body .panel .sub, body .panel .fnote, body .panel .lede,
  body .panel .empty, body .panel .meta { color: #E9E5DF !important; }
  body .panel label, body .panel .fl, body .panel .k { color: #F2EFEA !important; }
  body .panel b, body .panel strong { color: #FFFFFF; }
  body .panel input, body .panel select, body .panel textarea {
    background: rgba(255,255,255,.08) !important; border-color: rgba(255,255,255,.16) !important;
    color: #FFFFFF !important;
  }
  body .panel input::placeholder, body .panel textarea::placeholder { color: #B7B0A7 !important; }
  body .panel .picklist button {
    background: rgba(255,255,255,.06) !important; border-color: rgba(255,255,255,.14) !important;
    color: #F5F3EF !important;
  }
  body .panel .picklist button.picked {
    background: linear-gradient(135deg, var(--tone), var(--accent)) !important;
    border-color: transparent !important; color: #fff !important;
  }
  body .panel .btn:not(.accent):not(.danger) {
    background: rgba(255,255,255,.1) !important; border-color: rgba(255,255,255,.18) !important;
    color: #FFFFFF !important;
  }
  body .panel .btn.accent, body .panel .submit {
    background: linear-gradient(135deg, var(--tone), var(--accent)) !important; border: none !important;
  }

  /* 안내 박스 · 카드 · 통계 · 줄 버튼도 같은 유리로 */
  body .notice, body .banner, body .callout, body .subnotice,
  body .card, body .nfcard, body .mcard, body .dcard, body .mrow, body .song,
  body .fileitem, body .msrow, body .stat, body .moodbox, body .facebox, body .rowbtn {
    background: rgba(255,255,255,.055) !important;
    border-color: rgba(255,255,255,.12) !important;
    color: var(--night-ink) !important;
    box-shadow: none !important;
  }
  body .notice b, body .banner b, body .callout b,
  body .card b, body .nfcard b, body .mcard b, body .dcard b, body .stat .v {
    color: #FFFFFF !important;
  }
  body .notice p, body .banner p, body .callout p, body .subnotice p,
  body .card .meta, body .stat .k, body .tag, body .rolepill.none, body .rolepill.soft {
    color: #E9E5DF !important;
  }
  body .tag, body .rolepill.none, body .rolepill.soft { background: rgba(255,255,255,.08) !important; }
  body .bar { background: rgba(255,255,255,.12) !important; }
  body table th { background: rgba(255,255,255,.06) !important; color: #EDEAE5 !important; }
  body table td { border-color: rgba(255,255,255,.1) !important; color: var(--night-ink); }

  /* ============ 가독성 최우선 — 어두운 유리 위 글씨는 흰색 ============ */
body .tpl button,
  body /* 문항 만들기 */
  .q,
  body .addq button,
  body .rstat .b,
  body .tscroll {
    background: rgba(255,255,255,.075) !important;
    border-color: rgba(255,255,255,.15) !important;
    color: #F4F1EC !important;
    box-shadow: none !important;
  }
body .tpl button b,
  body /* 문항 만들기 */
  .q b,
  body .addq button b,
  body .rstat .b b,
  body .tscroll b { color: #FFFFFF !important; }
body .tpl button .k,
  body /* 문항 만들기 */
  .q .k,
  body .addq button .k,
  body .rstat .b .k,
  body .tscroll .k, body .tpl button .meta,
  body /* 문항 만들기 */
  .q .meta,
  body .addq button .meta,
  body .rstat .b .meta,
  body .tscroll .meta { color: #E4E0DA !important; }

  body .panel .picklist button .t b, body .picklist button .t b { color: #FFFFFF !important; }
  body .panel .picklist button .t span, body .picklist button .t span { color: #DED9D2 !important; }
  body .picklist button.picked .t b, body .picklist button.picked .t span { color: #FFFFFF !important; }
  body .panel .closing { color: #E9E5DF !important; }
  body .panel .closing b { color: #FFFFFF !important; }
  body .panel .hint, body .panel .sub, body .panel .lede, body .panel .fnote,
  body .panel .empty, body .panel .meta, body .panel .desc, body .panel .note,
  body .panel .cap, body .panel small, body .panel .msg, body .panel .fs { color: #E4E0DA !important; }
  body .panel > p, body .panel li { color: #ECE9E4; }
  body .panel h1, body .panel h2, body .panel h3, body .panel h4,
  body .panel .tit, body .panel .ttl, body .panel .nm { color: #FFFFFF !important; }
  body .panel input::placeholder, body .panel textarea::placeholder,
  body input::placeholder, body textarea::placeholder { color: #B7B0A7 !important; }
  body .panel a:not(.btn) { color: #FFC9AB; }
  body .panel hr, body .panel .divider { border-color: rgba(255,255,255,.18) !important; }
  body .panel option, body .panel optgroup { color: #1A1917; }

  /* 어두운 유리 위에서는 글씨 변수 자체를 밝은 쪽으로 (가독성 최우선) */
  body .shell, body .shell * {
    --ink-1: #FFFFFF; --ink-2: #F0EDE8; --ink-3: #DCD7D0; --ink-4: #C2BCB4;
    --night-ink: #FFFFFF; --night-sub: #D9D4CD;
    --hair: rgba(255,255,255,.15); --hair-2: rgba(255,255,255,.22);
  }
  body option, body optgroup { color: #1A1917; background: #FFFFFF; }
  body .ynfoot .cp { color: #CFC9C1 !important; }

  /* 밝은 회색 박스도 유리로 (가독성) */
body .fcard:hover,
  body .st.준비중,
  body .st.보관,
  body .fbar .bg {
    background: rgba(255,255,255,.085) !important;
    border-color: rgba(255,255,255,.16) !important;
    color: #F4F1EC !important;
  }
  body button:disabled, body .submit:disabled, body .btn:disabled {
    background: rgba(255,255,255,.14) !important; color: #CFC9C1 !important;
    border-color: rgba(255,255,255,.18) !important; opacity: 1 !important;
  }
  body .btn.accent, body .dirbtn, body .pwsubmit { color: #FFFFFF !important; }
  body .wk.on, body .wk.on * { color: #FFFFFF !important; }

  /* 유리 위 흰 버튼·탭·칩 — 글씨와 배경 짝 맞추기 (가독성) */
  body .btn:not(.accent):not(.danger):not(.primary):not(.ghost) {
    background: rgba(255,255,255,.13) !important;
    border-color: rgba(255,255,255,.22) !important;
    color: #FFFFFF !important;
  }
  body .tabs button { color: #DCD7D0 !important; }
  body .tabs button.on {
    background: linear-gradient(135deg, var(--tone), var(--accent)) !important;
    border-color: transparent !important; color: #FFFFFF !important;
  }
  body .st.준비중, body .st.보관 { background: rgba(255,255,255,.16) !important; color: #FFFFFF !important; }
  body .st.받는중 { background: #1D6B4B !important; color: #FFFFFF !important; }
  body .st.마감 { background: #8C3416 !important; color: #FFFFFF !important; }

  /* 배경 없는 버튼은 브라우저 기본 검정 글씨가 되므로 밝게 (가독성) */
  body .seg button, body .shell button:not([class]) { color: #DCD7D0 !important; }
  body .seg button.on { color: #FFFFFF !important; }

  /* 상태색 칩·위험 버튼도 어두운 유리 위에서 또렷하게 */
  body .btn.danger { background: rgba(255,255,255,.12) !important; color: #FF9E90 !important;
                     border-color: rgba(255,158,144,.45) !important; }
  body .tn.off, body .tp.off { background: rgba(255,120,100,.22) !important; color: #FFB3A6 !important; }
  body .tn.guest { background: rgba(var(--tone-rgb,210,81,31),.26) !important; color: #FFC0A1 !important; }
  body .tn.hl, body .tp.hl { color: #FFFFFF !important; }
  body .oc, body .mo { color: #FFB3A6 !important; background: rgba(255,120,100,.2) !important; }

  /* ---------- 입력칸 · 드롭다운은 전부 같은 유리로 (흰 칸이 남지 않게) ---------- */
  body input:not([type=checkbox]):not([type=radio]):not([type=range]),
  body select, body textarea {
    background-color: rgba(255,255,255,.10) !important;
    border: 1px solid rgba(255,255,255,.22) !important;
    color: #FFFFFF !important;
  }
  body select option, body select optgroup { background: #FFFFFF; color: #1A1917; }
  body input::placeholder, body textarea::placeholder { color: #B7B0A7 !important; }
  body input:focus, body select:focus, body textarea:focus {
    border-color: rgba(var(--tone-rgb,210,81,31),.9) !important;
    background-color: rgba(255,255,255,.15) !important;
  }
  body input:disabled, body select:disabled, body textarea:disabled {
    color: #CFC9C1 !important; opacity: 1 !important;
  }
  /* v6 — 설문 · 투표 */
  .fx-badge.sv { background: rgba(139,92,246,.24); color: #E0D5FF; border-color: rgba(167,139,250,.6); }
  .fx-badge.au { background: rgba(34,197,94,.18); color: #C9F7D8; border-color: rgba(74,222,128,.5); }
  .fx-kind { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fx-kind button { display: flex; flex-direction: column; gap: 3px; text-align: left; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--hair-2, rgba(0,0,0,.2)); background: transparent; color: inherit; cursor: pointer; font: inherit; }
  .fx-kind button b { font-size: 15px; } .fx-kind button small { font-size: 12.5px; opacity: .75; line-height: 1.4; }
  .fx-kind button.on { border-color: var(--tone, #D2511F); background: rgba(var(--tone-rgb, 210,81,31), .10); box-shadow: 0 0 0 3px rgba(var(--tone-rgb, 210,81,31), .12); }
  .fx-svset { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hair, rgba(0,0,0,.1)); }
  .fx-svset .lkchg { display: flex; gap: 9px; align-items: flex-start; margin: 0 0 10px; }
  .fx-seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: rgba(127,127,127,.14); flex-wrap: wrap; }
  .fx-seg label { padding: 7px 13px; border-radius: 9px; font-size: 13.5px; font-weight: 700; cursor: pointer; }
  .fx-seg label input { position: absolute; opacity: 0; width: 0; height: 0; }
  .fx-seg label.on { background: var(--tone, #D2511F); color: #fff; }
  .fx-chip.all { opacity: .8; }
  .fx-part { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; }
  .fx-part .bar { flex: 1 1 200px; height: 10px; border-radius: 99px; background: rgba(127,127,127,.2); overflow: hidden; }
  .fx-part .bar i { display: block; height: 100%; background: var(--tone, #D2511F); border-radius: 99px; }
  .fx-pend { display: flex; flex-wrap: wrap; gap: 6px; }
  .fx-pend span { padding: 4px 10px; border-radius: 99px; background: rgba(127,127,127,.14); font-size: 13px; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <a href="/" class="homelink" title="포털 홈으로"><img src="/logo.png" alt="Youngnak"></a>
    <h1>각종 Form 관리</h1>
    <p class="meta">YNTORONTO &nbsp;·&nbsp; FORMS</p>
  </header>
  <div id="root"><div class="panel"><i class="skel line" style="width:60%;"></i><i class="skel line" style="width:40%;"></i></div></div>
  <footer></footer>
</div>
<!--#include Theme-->
<script src="/forms/forms-core.js?v=7"></script>
<script>
var P = window.__PREFILL__ || {};
var TOKEN = P.key || P.t || '';
var D = null;           // 목록 화면 자료
var F = null;           // 지금 고치고 있는 신청서
var R = null;           // 지금 보고 있는 결과
var VIEW = 'list';
var OPENQ = -1;
var DESC_ED = null;     // Step 6: 안내 글 서식 편집기 (굵게 · 주황 강조)
var SEC_ED = null;      // Step 6: 열려 있는 "안내 문구" 문항의 서식 편집기
var PREV_VAL = '';      // Step 6: 미리보기에서 지금 골라 본 값 (다시 그려도 유지)
var PREV_T = 0;
var STF = 'all';        // Step 7: 결과 화면의 상태 걸러보기 (all | 접수 | 미결제 | 결제완료 | 취소)
var AN = [];            // Step 7: 알릴 대상 여러 곳 (key 목록)

function el(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function jsq(s) { return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
function say(id, t, k) { var m = el(id); if (m) { m.className = 'msg' + (k ? ' ' + k : ''); m.textContent = t || ''; } }
function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function typeOf(k) { var h = null; (D && D.types || []).forEach(function (t) { if (t.key === k) h = t; }); return h || { key: k, name: k, icon: '?', opts: false }; }

function boot() {
  if (!TOKEN) {
    el('root').innerHTML = '<div class="panel"><p class="msg err">포털에서 “각종 Form 관리” 로 들어와 주세요.</p>' +
      '<a class="btn full" href="?page=portal">포털로 가기</a></div>';
    return;
  }
  if (P.err) { el('root').innerHTML = '<div class="panel"><p class="msg err">' + esc(P.err) + '</p>' +
    '<a class="btn full" href="?page=portal">포털로 가기</a></div>'; return; }
  if (P.init) { D = P.init; drawList(); } else load();
}

function load(then) {
  callServer('formAdminInit', [TOKEN], function (r) { D = r; (then || drawList)(); }, function (e) {

function drawTemplates() {
  callServer('formTemplatesAll', [TOKEN], function (r) {
    var b = el('tplBox');
    if (!b) return;
    var list = (r.mine || []).concat(r.builtin || []);
    window.__TPL = list;
    window.__SV = r.surveys || [];
    var sb = el('svBox');
    if (sb) sb.innerHTML = window.__SV.map(function (t, i) {
      return '<button type="button" onclick="newFromSurvey(' + i + ')"><span class="i">' + t.icon + '</span><span class="n">' + esc(t.name) + '</span>' +
        '<span class="d">' + esc(t.desc || '') + '</span></button>';
    }).join('');
    b.innerHTML = list.map(function (t, i) {
      return '<button type="button" onclick="newFromTemplate(' + i + ')">' +
        (t.mine ? '<span class="mytag">우리 본보기</span>' : '') +
        '<span class="i">' + t.icon + '</span><span class="n">' + esc(t.name) + '</span>' +
        '<span class="d">' + esc(t.desc || (t.by ? t.by + ' 만듦' : '')) + '</span>' +
        (t.mine ? '<span class="tdel" onclick="event.stopPropagation();delTemplate(\'' + jsq(t.id) + '\')">지우기</span>' : '') +
        '</button>';
    }).join('');
  }, function () { var b = el('tplBox'); if (b) b.innerHTML = ''; });
}

function delTemplate(id) {
  if (!confirm('이 본보기를 지울까요? (이미 만든 신청서는 그대로입니다)')) return;
  callServer('deleteFormTemplate', [TOKEN, id], function () { drawTemplates(); },
    function (e) { alert(e.message || '지우지 못했습니다.'); });
}

function newFromTemplate(i) {
  var t = (window.__TPL || [])[i];
  if (!t) return;
  var f = JSON.parse(JSON.stringify(t.form));
  f.id = '';
  f.status = '준비중';
  f.questions = (f.questions || []).map(function (q, n) { return normQ(q, n); });
  f.team = D.committee ? '' : (D.teams[0] || '');
  f.editable = true; f.notify = true; f.showCount = false; f.limit = 0;
  f.openAt = ''; f.closeAt = '';
  F = f;
  drawEdit();
}

/* ===================== v6 — 설문 · 투표 ===================== */
function newFromSurvey(i) {
  var t = (window.__SV || [])[i];
  if (!t) return;
  var f = JSON.parse(JSON.stringify(t.form));
  f.id = ''; f.status = '준비중'; f.target = '교인';
  f.questions = (f.questions || []).map(function (q, n) { return normQ(q, n); });
  f.team = D.committee ? '' : (D.teams[0] || '');
  f.editable = true; f.notify = false; f.showCount = true; f.limit = 0; f.openAt = ''; f.closeAt = '';
  f.audience = D.committee ? [] : D.teams.map(function (x) { return '팀:' + x; });
  F = f;
  drawEdit();
}
/** 대상 이름 — 목록 · 칩에 */
function audName(k) {
  if (k.indexOf('사람:') === 0) return '👤 ' + k.slice(3);
  if (k.indexOf('팀:') === 0) return '🎵 ' + k.slice(2);
  if (k.indexOf('셀:') === 0) return '👥 ' + k.slice(2);
  if (k.indexOf('선교:') === 0) return '✈️ ' + k.slice(3);
  return '⭐ ' + k + (k === '팀장' || k === '셀장' ? '들' : '');
}
function audLabel(list) { list = list || []; return list.length ? list.slice(0, 2).map(function (k) { return audName(k).replace(/^\S+ /, ''); }).join(', ') + (list.length > 2 ? ' 외 ' + (list.length - 2) : '') : '모두'; }
/** 고를 수 있는 대상 — 커미티: 역할 · 팀 · 셀 · 선교팀 · 사람 / 팀장: 우리 팀 · 우리 팀 사람 */
function audOptions() {
  var o = '';
  if (D.committee) {
    o += '<optgroup label="역할">' + ['팀장', '셀장', '커미티', '새가족팀', '회계팀'].map(function (k) { return '<option value="' + k + '">' + k + (k === '팀장' || k === '셀장' ? '들 (모든 ' + k + ')' : '') + '</option>'; }).join('') + '</optgroup>';
    var g = {};
    (D.targets || []).forEach(function (x) { if (/^(팀|셀|선교):/.test(x.key)) (g[x.group] = g[x.group] || []).push(x); });
    Object.keys(g).forEach(function (k) { o += '<optgroup label="' + esc(k) + '">' + g[k].map(function (x) { return '<option value="' + esc(x.key) + '">' + esc(x.name) + ' (' + x.n + '명)</option>'; }).join('') + '</optgroup>'; });
  } else {
    o += '<optgroup label="우리 팀">' + D.teams.map(function (x) { return '<option value="' + esc('팀:' + x) + '">' + esc(x) + '</option>'; }).join('') + '</optgroup>';
  }
  if ((D.people || []).length) o += '<optgroup label="한 사람씩">' + D.people.map(function (n) { return '<option value="' + esc('사람:' + n) + '">' + esc(n) + '</option>'; }).join('') + '</optgroup>';
  return o;
}
function drawAud() {
  var b = el('audChips'); if (!b) return;
  var a = F.audience || [];
  b.innerHTML = a.length ? a.map(function (k, i) { return '<span class="fx-chip">' + esc(audName(k)) + '<button type="button" onclick="delAud(' + i + ')" aria-label="빼기">&times;</button></span>'; }).join('')
    : '<span class="fx-chip all">' + (D.committee ? '🌐 모두 (대상 없음)' : '🎵 우리 팀 (저장하면 자동)') + '</span>';
  var m = el('audN');
  if (!a.length) { if (m) m.textContent = ''; return; }
  if (m) m.textContent = '대상 세는 중…';
  callServer('surveyAudience', [TOKEN, a], function (r) { var m2 = el('audN'); if (m2) m2.textContent = r.n == null ? '' : '대상 ' + r.n + '명 — 이분들에게만 포털에 보이고, 이분들만 참여할 수 있습니다.'; },
    function (e) { var m2 = el('audN'); if (m2) { m2.className = 'msg err'; m2.textContent = e.message || String(e); } });
}
function addAud() {
  var s = el('audSel'); if (!s || !s.value) return;
  F.audience = F.audience || [];
  if (F.audience.indexOf(s.value) === -1) F.audience.push(s.value);

}
function delAud(i) { F.audience.splice(i, 1); drawAud(); }
function setKind(k) {
  pullForm();
  F.kind = k === 'survey' ? 'survey' : 'form';
  if (F.kind === 'survey' && !F.survey) F.survey = { anonymous: false, results: 'after', allowAdd: false };
  drawEdit();
}
/** 만들기 화면 — 종류 · 설문 설정 · 대상 */
function surveyPanels() {
  var sv = F.kind === 'survey', s = F.survey || {};
  var res = s.results || 'after';
  return '<div class="panel"><span class="chip">종류</span>' +

          return '<label class="' + (res === o[0] ? 'on' : '') + '"><input type="radio" name="svRes" value="' + o[0] + '"' + (res === o[0] ? ' checked' : '') + ' onchange="pullForm();drawEdit()">' + o[1] + '</label>'; }).join('') + '</div>' +
        '<p class="hint" style="margin:8px 0 0;">다시 투표(고치기)는 아래 "낸 뒤에도 고칠 수 있게", 마감은 "닫는 날"로 정합니다.</p>' +
      '</div>' : '') +

      '<div class="fx-chips" id="audChips"></div>' +

        '<button type="button" class="btn mini" onclick="addAud()">+ 대상 넣기</button></div>' +
      '<p class="msg" id="audN"></p>' +
      '<p class="hint" style="margin:6px 0 0;">' + (D.committee ? '비워 두면 예전처럼 모두에게 보입니다. 여러 곳을 섞어 고를 수 있습니다 (예: 팀장들 + 커미티).' : '팀장님은 우리 팀과 우리 팀 사람만 고를 수 있습니다. 비워 두면 우리 팀으로 정해집니다.') + '</p>' +
    '</div>';
}
function normQ(q, i) {
  var o = { id: q.id || ('q' + (i + 1) + Math.random().toString(36).slice(2, 5)), type: q.type || 'text',
    label: q.label || '', help: q.help || '', req: !!q.req, opts: q.opts || [], other: !!q.other,
    min: q.min == null ? '' : q.min, max: q.max == null ? '' : q.max, unit: q.unit || '',
    otherLabel: q.otherLabel || '', helpHtml: q.helpHtml || '' };
  /* Step 6 — 별점 설정은 있는 문항에만 붙입니다. 서버는 이 값이 "있을 때만" 별점 설정을 저장하므로,
     모든 문항에 빈 값을 붙이면 예전 문항까지 별점 칸이 생겨버립니다. */
  if (q.scale != null || q.variant || q.lowLabel || q.highLabel || o.type === 'rating') {
    o.scale = q.scale == null || q.scale === '' ? 5 : q.scale;
    o.variant = q.variant || 'star';
    o.lowLabel = q.lowLabel || '';
    o.highLabel = q.highLabel || '';
  }
  /* Step 7 — 표시 조건은 있는 문항에만 붙입니다 (서버는 규칙이 있을 때만 저장) */
  if (q.showIf && q.showIf.rules && q.showIf.rules.length) {
    o.showIf = { mode: q.showIf.mode === 'any' ? 'any' : 'all', rules: q.showIf.rules.map(function (r) { return { q: r.q, op: r.op, v: r.v == null ? '' : r.v }; }) };
  }
  return o;
}

function openForm(id) {
  callServer('formGet', [TOKEN, id], function (r) {
    F = r.form;
    F.questions = (F.questions || []).map(function (q, i) { return normQ(q, i); });
    F.count = r.count;
    drawEdit();
  }, function (e) { alert(e.message || '열지 못했습니다.'); });
}

      }).join('') +

    '</div>' +
    '<div class="panel"><span class="chip">문항</span>' +
      '<p class="hint">이름 · 연락처 · 성별 · 셀은 로그인 정보에서 자동으로 채워집니다. 그 밖에 받을 것만 만들어주세요.</p>' +

      '<p class="fl" style="margin:14px 0 6px;">문항 더하기</p>' +

      '<div class="f"><label class="fl">상태</label>' +
        '<select id="fStatus">' +
          ['준비중', '받는중', '마감', '보관'].map(function (s) {
            return '<option value="' + s + '"' + ((F.status || '준비중') === s ? ' selected' : '') + '>' +
              (s === '준비중' ? '준비중 — 아직 아무에게도 안 보임' :
               s === '받는중' ? '받는중 — 포털에 올라가고 신청을 받습니다' :
               s === '마감' ? '마감 — 새 신청을 받지 않습니다' : '보관 — 목록에서 숨깁니다') + '</option>';
          }).join('') + '</select></div>' +
      '<button class="btn accent full" onclick="saveForm()">저장</button>' +

    '</div>' +
    (F.id ?
    '<div class="panel"><span class="chip">함께 볼 사람 · 알림 받을 사람</span>' +
      '<p class="hint">팀 · 셀 · 한 사람씩 골라 이 신청서의 <b>신청 결과</b>를 볼 수 있게 열어줍니다 (보기와 엑셀 받기만 됩니다). ' +
      '"새 신청 알림" 을 켜 두면 신청이 들어올 때마다 그분들께 알림이 갑니다.</p>' +
      '<div id="shList"></div>' +
      '<div class="fx-addrow"><select id="shKind" onchange="drawShareNames()" aria-label="종류">' +

        '<input type="text" id="shName" list="shNames" placeholder="이름을 고르거나 적어주세요" autocomplete="off" aria-label="이름">' +
        '<datalist id="shNames"></datalist>' +
        '<button type="button" class="btn mini" onclick="addShare()">+ 더하기</button></div>' +
      '<button class="btn full" style="margin-top:10px;" onclick="saveShares()">공유 저장</button>' +

      '<label class="lkchg" style="margin:0 0 8px;"><input type="checkbox" id="anPush" checked>' +
        '<span>휴대폰 알림</span></label>' +
      '<label class="lkchg" style="margin:0 0 8px;"><input type="checkbox" id="anPortal" checked>' +
        '<span>포털 첫 화면에 공지로 올리기</span></label>' +
      '<label class="lkchg" style="margin:0 0 12px;"><input type="checkbox" id="anMail">' +
        '<span>이메일로도 보내기</span></label>' +

      '<p class="hint">지금 문항 그대로 본보기로 저장해 두면, 다음 번에 한 번에 불러올 수 있습니다.</p>' +
      '<div class="f"><label class="fl">본보기 이름</label>' +
        '<input type="text" id="tplName" maxlength="60" value="' + esc(F.title || '') + '"></div>' +

  mountDescEditor();

/** 안내 글 편집기 (굵게 · 주황 강조) — 바뀔 때마다 서식 뺀 글을 숨은 칸에 옮깁니다 */
function mountDescEditor() {
  DESC_ED = FormsCore.RichEditor(el('fDescEd'), {
    html: F.descHtml || '', text: F.desc || '', maxText: 3000, minHeight: '116px',
    placeholder: '신청서 맨 위에 보일 안내입니다. 날짜 · 장소 · 회비 등을 적어주세요.',
    onChange: function (html, text) { el('fDesc').value = text; F.descHtml = html; F.desc = text; }
  });
  DESC_ED.el.setAttribute('aria-labelledby', 'fDescLbl');
}
/** ✨ AI 편집이 끝나면 (글만 새로 옴) 편집기에도 반영 — 서식은 AI 결과에는 없으므로 비워집니다 */
function descGrow(t) { if (DESC_ED) DESC_ED.setText(t.value); }

function leaveEdit() {
  if (!confirm('저장하지 않은 내용은 사라집니다. 목록으로 갈까요?')) return;
  load();
}

function drawAddButtons() {
  el('addQ').innerHTML = (D.types || []).map(function (t) {
    return '<button type="button" onclick="addQ(\'' + t.key + '\')">' +
      '<span class="i">' + t.icon + '</span><span>' + esc(t.name) + '</span></button>';
  }).join('');
}

function aiSuggestQuestions() {
  pullForm();
  var m = el('aiQMsg');
  if (!F.title || !F.title.trim()) { m.className = 'msg err'; m.textContent = '먼저 제목을 적어주세요.'; return; }
  m.className = 'msg'; m.textContent = 'AI가 문항을 만드는 중…';
  callServer('aiSuggestFormQuestions', [TOKEN, F.title, F.desc], function (qs) {
    (qs || []).forEach(function (q) { F.questions.push(normQ(q, F.questions.length)); });
    m.className = 'msg ok'; m.textContent = 'AI가 만든 문항 ' + (qs || []).length + '개를 아래에 더했습니다. 확인하고 고쳐주세요.';
    drawQuestions();
  }, function (e) { m.className = 'msg err'; m.textContent = e.message || 'AI 제안에 실패했습니다.'; });
}

function addQ(type) {
  pullForm();
  var q = normQ({ type: type, label: '', req: false }, F.questions.length);
  if (type === 'choice' || type === 'checks') q.opts = ['', ''];
  if (type === 'rating') { q.scale = 5; q.variant = 'star'; q.lowLabel = ''; q.highLabel = ''; }
  F.questions.push(q);
  OPENQ = F.questions.length - 1;
  drawQuestions();
  setTimeout(function () { var i = el('ql' + OPENQ); if (i) { i.focus(); i.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }, 40);
}

/** 화면에 적힌 값을 F 로 옮깁니다 (다시 그리기 전에) */
function pullForm() {
  if (!el('fTitle')) return;
  F.title = el('fTitle').value;
  if (DESC_ED) { F.desc = DESC_ED.getText(); F.descHtml = DESC_ED.getHtml(); } else F.desc = el('fDesc').value;
  F.team =el('fTeam') ? el('fTeam').value : '';
  F.target = el('fTarget').value;
  F.openAt = el('fOpen').value;
  F.closeAt = el('fClose').value;
  F.limit = Number(el('fLimit').value) || 0;
  F.editable = el('fEdit').checked;
  F.showCount = el('fCount').checked;
  F.notify = el('fNotify').checked;
  F.mail = el('fMail') ? el('fMail').checked : false;
  F.autoClose = el('fAuto') ? el('fAuto').checked : true;
  F.inviteOnly = el('fInvite') ? el('fInvite').checked : false;
  F.resultsShare = F.resultsShare === 'owner' ? 'owner' : 'team';
  F.status = el('fStatus').value;
  if (F.kind === 'survey') {                                        // v6
    F.survey = F.survey || {};
    if (el('svAnon')) F.survey.anonymous = el('svAnon').checked;
    if (el('svAdd')) F.survey.allowAdd = el('svAdd').checked;
    var rr = document.querySelector('input[name="svRes"]:checked'); if (rr) F.survey.results = rr.value;
  }
  F.audience = F.audience || [];
  pullQuestions();
}

function pullQuestions() {
  F.questions.forEach(function (q, i) {
    var lb = el('ql' + i); if (lb) q.label = lb.value;
    var hp = el('qh' + i); if (hp) q.help = hp.value;
    var rq = el('qr' + i); if (rq) q.req = rq.checked;
    var mn = el('qmin' + i); if (mn) q.min = mn.value;
    var mx = el('qmax' + i); if (mx) q.max = mx.value;
    var un = el('qu' + i); if (un) q.unit = un.value;
    /* Step 6: 기타 · 별점 설정 (열려 있는 문항에만 칸이 있음 — 없으면 건드리지 않음) */
    var ot = el('qother' + i); if (ot) q.other = ot.checked;
    var ol = el('qotl' + i); if (ol) q.otherLabel = ol.value;
    var sc = el('qsc' + i); if (sc) q.scale = Number(sc.value) || 5;
    var lw = el('qlow' + i); if (lw) q.lowLabel = lw.value;
    var hg = el('qhigh' + i); if (hg) q.highLabel = hg.value;
    /* Step 7: 표시 조건의 값 (고르는 칸 · 적는 칸) */
    if (q.showIf) q.showIf.rules.forEach(function (r, k) { var cv = el('qcv' + i + '_' + k); if (cv) r.v = cv.value; });
    if (q.opts && q.opts.length) {
      q.opts = q.opts.map(function (o, j) { var b = el('qo' + i + '_' + j); return b ? b.value : o; });
    }
  });
}

/** 문항 하나의 "유형 바꾸기" 줄 — 눌러도 적어 둔 질문 · 선택지 · 설정은 그대로 남습니다 */
function typeSwitcher(i, q) {
  return '<div class="f"><label class="fl">문항 유형 <span style="font-weight:600;color:var(--ink-3);">(바꿔도 적은 내용은 그대로 남습니다)</span></label>' +
    '<div class="fx-types" role="group" aria-label="문항 유형">' +
    (D.types || []).map(function (t) {
      var on = t.key === q.type;
      return '<button type="button" class="' + (on ? 'on' : '') + '" aria-pressed="' + on + '" ' +
        'onclick="setQType(' + i + ',\'' + jsq(t.key) + '\')"><span class="i">' + t.icon + '</span>' + esc(t.name) + '</button>';
    }).join('') + '</div>' +
    (F.id && F.count ? '<p class="fx-warn">이미 ' + F.count + '명이 신청했습니다. 유형을 바꿔도 받은 답은 지워지지 않지만, ' +
      '결과 화면은 새 유형을 기준으로 모아 보입니다.</p>' : '') +
    '</div>';
}

function ratingSettings(i, q) {
  var scale = Number(q.scale) || 5, variant = q.variant || 'star';
  var faceOk = scale === 5;
  if (variant === 'face' && !faceOk) variant = 'number';
  var sel = '<select id="qsc' + i + '" onchange="setRating(' + i + ',\'scale\',this.value)">';
  for (var n = 3; n <= 10; n++) sel += '<option value="' + n + '"' + (n === scale ? ' selected' : '') + '>' + n + '단계</option>';
  sel += '</select>';
  return '<div class="fx-sub"><label class="fl">별점 · 만족도 설정</label>' +
    '<div class="qrow"><div class="f"><label class="fl" for="qsc' + i + '">단계 수</label>' + sel + '</div>' +
    '<div class="f"><label class="fl">모양</label><div class="fx-seg" role="group" aria-label="모양">' +
      [['star', '★ 별'], ['number', '1 2 3 숫자'], ['face', '🙂 표정']].map(function (v) {
        var dis = v[0] === 'face' && !faceOk;
        return '<button type="button" class="' + (variant === v[0] ? 'on' : '') + '" aria-pressed="' + (variant === v[0]) + '"' +
          (dis ? ' disabled title="표정은 5단계일 때만 쓸 수 있습니다" style="opacity:.5;cursor:not-allowed;"' : '') +
          ' onclick="setRating(' + i + ',\'variant\',\'' + v[0] + '\')">' + v[1] + '</button>';
      }).join('') + '</div></div></div>' +
    '<div class="qrow"><div class="f"><label class="fl" for="qlow' + i + '">가장 낮은 쪽 이름</label>' +
      '<input type="text" id="qlow' + i + '" maxlength="20" placeholder="예: 매우 불만족" value="' + esc(q.lowLabel) + '"></div>' +
    '<div class="f"><label class="fl" for="qhigh' + i + '">가장 높은 쪽 이름</label>' +
      '<input type="text" id="qhigh' + i + '" maxlength="20" placeholder="예: 매우 만족" value="' + esc(q.highLabel) + '"></div></div>' +
    '<button type="button" class="btn mini" onclick="ratingPreset(' + i + ')">만족도 5단계 (표정) 로 맞추기</button>' +
    '</div>';
}

function otherSettings(i, q) {
  return '<label class="lkchg" style="display:flex;gap:9px;align-items:flex-start;margin:6px 0 0;">' +
      '<input type="checkbox" id="qother' + i + '"' + (q.other ? ' checked' : '') + ' onchange="toggleOther(' + i + ',this.checked)">' +
      '<span>"기타 (직접 입력)" 칸 넣기<em>고르면 글을 적는 칸이 나타납니다. 답은 "기타: 내용" 으로 저장됩니다.</em></span></label>' +
    (q.other ? '<div class="f" style="margin-top:8px;"><label class="fl" for="qotl' + i + '">기타 칸에 붙일 이름 (비우면 "기타 (직접 입력)")</label>' +
      '<input type="text" id="qotl' + i + '" maxlength="30" placeholder="기타 (직접 입력)" value="' + esc(q.otherLabel) + '"></div>' : '');
}


/* ===================== Step 7 — 표시 조건 (이 문항은 앞 문항의 답에 따라서만 보임) ===================== */

var COND_LBL = { eq: '같을 때', ne: '다를 때', has: '골랐을 때', nothas: '고르지 않았을 때', filled: '답이 있을 때', empty: '답이 없을 때', gte: '이상일 때', lte: '이하일 때' };

/** 앞 문항(안내 글 제외) 중 조건으로 쓸 수 있는 것들의 번호 */
function condSources(i) {
  var out = [];
  for (var j = 0; j < i; j++) if (F.questions[j].type !== 'section') out.push(j);
  return out;
}
function condOps(type) {
  if (type === 'choice') return ['eq', 'ne', 'filled', 'empty'];
  if (type === 'checks') return ['has', 'nothas', 'filled', 'empty'];
  if (type === 'rating' || type === 'number') return ['gte', 'lte', 'eq', 'filled', 'empty'];
  if (type === 'agree' || type === 'file') return ['filled', 'empty'];
  return ['eq', 'ne', 'filled', 'empty'];
}
function condSrcById(id, i) {
  for (var j = 0; j < i; j++) if (F.questions[j].id === id && F.questions[j].type !== 'section') return F.questions[j];
  return null;
}
function condLabelOf(q, j) { return (j + 1) + '. ' + (String(q.label || '').trim() || '제목 없는 문항'); }

function condValueCtl(i, k, r, src) {
  if (r.op === 'filled' || r.op === 'empty') return '';
  var id = 'qcv' + i + '_' + k, v = r.v == null ? '' : String(r.v);
  if (src.type === 'choice' || src.type === 'checks') {
    var opts = (src.opts || []).map(function (o) { return String(o).trim(); }).filter(function (o) { return o; });
    var h = '<select id="' + id + '" aria-label="비교할 값"><option value="">(고르세요)</option>' +
      opts.map(function (o) { return '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('');
    if (src.other) h += '<option value="__other__"' + (v === '__other__' ? ' selected' : '') + '>' + esc(src.otherLabel || '기타 (직접 입력)') + ' — 무엇이든</option>';
    if (v && v !== '__other__' && opts.indexOf(v) === -1) h += '<option value="' + esc(v) + '" selected>' + esc(v) + ' (지워진 선택지)</option>';
    return h + '</select>';
  }
  if (src.type === 'rating') {
    var n = FormsCore.ratingConfig(src).scale, h2 = '<select id="' + id + '" aria-label="점수"><option value="">(점수)</option>';
    for (var x = 1; x <= n; x++) h2 += '<option value="' + x + '"' + (String(x) === v ? ' selected' : '') + '>' + x + '점</option>';
    return h2 + '</select>';
  }
  if (src.type === 'number') return '<input type="number" id="' + id + '" aria-label="숫자" value="' + esc(v) + '">';
  return '<input type="text" id="' + id + '" maxlength="120" aria-label="비교할 글" placeholder="적힌 글" value="' + esc(v) + '">';
}

function condSettings(i, q) {
  var srcs = condSources(i);
  if (!srcs.length) {
    return '<div class="fx-sub fx-cond"><label class="fl">보이는 조건</label>' +
      '<p class="fx-note" style="margin:0;">앞에 답을 받는 문항이 있으면, 그 답에 따라 이 문항을 보이거나 숨길 수 있습니다.</p></div>';
  }
  var c = q.showIf, rules = c ? c.rules : [];
  var h = '<div class="fx-sub fx-cond"><label class="fl">보이는 조건 <span style="font-weight:600;color:var(--ink-3);">(선택 — 비워 두면 늘 보입니다)</span></label>';
  if (!rules.length) {
    h += '<p class="fx-note" style="margin:0 0 8px;">예: "참석 여부" 에서 "불참" 을 고른 분에게만 "불참 사유" 를 보이게 합니다. 숨겨진 문항은 꼭 답해야 하는 문항이어도 묻지 않습니다.</p>' +
      '<button type="button" class="btn mini" onclick="addCond(' + i + ')">+ 조건 걸기</button></div>';
    return h;
  }
  if (rules.length > 1) {
    h += '<div class="fx-mode"><select id="qcm' + i + '" onchange="setCondMode(' + i + ',this.value)" aria-label="조건을 합치는 방법">' +
      '<option value="all"' + (c.mode !== 'any' ? ' selected' : '') + '>아래 조건이 모두 맞을 때 보임</option>' +
      '<option value="any"' + (c.mode === 'any' ? ' selected' : '') + '>아래 조건 중 하나라도 맞으면 보임</option></select></div>';
  }
  rules.forEach(function (r, k) {
    var src = condSrcById(r.q, i);
    if (!src) { src = F.questions[srcs[srcs.length - 1]]; }
    h += '<div class="fx-rule">' +
      '<select id="qcs' + i + '_' + k + '" onchange="setCondSrc(' + i + ',' + k + ',this.value)" aria-label="어느 문항의 답">' +
        srcs.map(function (j) { var sq = F.questions[j]; return '<option value="' + esc(sq.id) + '"' + (sq.id === src.id ? ' selected' : '') + '>' + esc(condLabelOf(sq, j)) + '</option>'; }).join('') + '</select>' +
      '<select id="qco' + i + '_' + k + '" onchange="setCondOp(' + i + ',' + k + ',this.value)" aria-label="조건">' +
        condOps(src.type).map(function (o) { return '<option value="' + o + '"' + (o === r.op ? ' selected' : '') + '>' + COND_LBL[o] + '</option>'; }).join('') + '</select>' +
      condValueCtl(i, k, r, src) +
      '<button type="button" class="qbtn" onclick="delCond(' + i + ',' + k + ')" title="이 조건 지우기" aria-label="이 조건 지우기">&times;</button></div>';
  });
  if (rules.length < 5) h += '<button type="button" class="btn mini" onclick="addCond(' + i + ')">+ 조건 더하기</button> ';
  h += '<button type="button" class="btn mini" onclick="clearCond(' + i + ')">조건 모두 없애기</button></div>';
  return h;
}

function addCond(i) {
  pullQuestions();
  var srcs = condSources(i); if (!srcs.length) return;
  var q = F.questions[i], src = F.questions[srcs[srcs.length - 1]];     // 바로 앞 문항이 기본
  if (!q.showIf) q.showIf = { mode: 'all', rules: [] };
  if (q.showIf.rules.length >= 5) return;
  q.showIf.rules.push({ q: src.id, op: condOps(src.type)[0], v: '' });
  drawQuestions();
}
function delCond(i, k) {
  pullQuestions();
  var q = F.questions[i]; if (!q.showIf) return;
  q.showIf.rules.splice(k, 1);
  if (!q.showIf.rules.length) delete q.showIf;
  drawQuestions();
}
function clearCond(i) { pullQuestions(); delete F.questions[i].showIf; drawQuestions(); }
function setCondMode(i, m) { pullQuestions(); F.questions[i].showIf.mode = m === 'any' ? 'any' : 'all'; }
function setCondSrc(i, k, id) {
  pullQuestions();
  var r = F.questions[i].showIf.rules[k], src = condSrcById(id, i); if (!src) return;
  r.q = id;
  if (condOps(src.type).indexOf(r.op) === -1) r.op = condOps(src.type)[0];
  r.v = '';
  drawQuestions();
}
function setCondOp(i, k, op) {
  pullQuestions();
  var r = F.questions[i].showIf.rules[k];
  r.op = op;
  if (op === 'filled' || op === 'empty') r.v = '';
  drawQuestions();
}

/** 문항을 옮기거나 지우거나 유형을 바꾼 뒤: 앞에 없는 문항을 가리키는 조건은 풀고, 안 맞게 된 연산자는 처음 것으로 — 풀린 조건 수를 돌려줍니다 */
function fixConds() {
  var dropped = 0, seen = {};
  F.questions.forEach(function (q, i) {
    if (q.showIf) {
      q.showIf.rules = q.showIf.rules.filter(function (r) {
        var src = seen[r.q];
        if (!src) { dropped++; return false; }
        if (condOps(src.type).indexOf(r.op) === -1) { r.op = condOps(src.type)[0]; r.v = ''; }
        return true;
      });
      if (!q.showIf.rules.length) delete q.showIf;
    }
    if (q.type !== 'section') seen[q.id] = q;
  });
  return dropped;
}

function drawQuestions() {
  var box = el('qList');
  SEC_ED = null;
  if (!F.questions.length) {
    box.innerHTML = '<p class="empty" style="margin:6px 0 2px;">아래에서 문항을 더해주세요.</p>';
    return;
  }
  /* 문항이 많아도 한 번에 꽂도록 문자열로 모은 뒤 innerHTML 을 한 번만 바꿉니다 (열려 있는 문항 하나만 자세히 그림) */
  var parts = new Array(F.questions.length);
  F.questions.forEach(function (q, i) {
    var t = typeOf(q.type);
    var open = (i === OPENQ);
    var body = '';
    if (open) {
      var sec = q.type === 'section';
      var canPrev = q.type === 'choice' || q.type === 'checks' || q.type === 'rating';
      body = '<div class="qbody">' +
        typeSwitcher(i, q) +
        '<div class="f"><label class="fl" for="ql' + i + '">질문 <span class="req">*</span></label>' +
          '<input type="text" id="ql' + i + '" maxlength="150" placeholder="' +
          (sec ? '보여줄 안내 제목' : '예: 참가 여부') + '" value="' + esc(q.label) + '">' +
          '<button type="button" class="btn mini aipolish" onclick="pullQuestions();aiPolish(\'ql' + i + '\',this,\'qlMsg' + i + '\')">&#10024; AI 편집</button>' +
          '<p class="msg" id="qlMsg' + i + '"></p></div>' +
        (sec
          ? '<div class="f"><label class="fl" id="qhLbl' + i + '">안내 문구 (굵게 · 주황 강조를 쓸 수 있습니다)</label><div id="qhEd' + i + '"></div></div>'
          : '<div class="f"><label class="fl" for="qh' + i + '">도움말 (작게 보입니다)</label>' +
            '<input type="text" id="qh' + i + '" maxlength="500" value="' + esc(q.help) + '">' +
            '<button type="button" class="btn mini aipolish" onclick="pullQuestions();aiPolish(\'qh' + i + '\',this,\'qhMsg' + i + '\')">&#10024; AI 편집</button>' +
            '<p class="msg" id="qhMsg' + i + '"></p></div>') +
        (t.opts ? '<div class="f"><label class="fl">고를 것</label><div class="opts">' +
            q.opts.map(function (o, j) {
              return '<div class="optrow"><input type="text" id="qo' + i + '_' + j + '" maxlength="120" ' +
                'placeholder="선택지 ' + (j + 1) + '" aria-label="선택지 ' + (j + 1) + '" value="' + esc(o) + '">' +
                '<button class="qbtn" title="AI 편집" onclick="pullQuestions();aiPolish(\'qo' + i + '_' + j + '\',this,null)">&#10024;</button>' +
                '<button class="qbtn" onclick="delOpt(' + i + ',' + j + ')" title="지우기">&times;</button></div>';
            }).join('') +
          '</div><button class="btn mini" style="margin-top:7px;" onclick="addOpt(' + i + ')">+ 선택지</button>' +
          otherSettings(i, q) + '</div>' : '') +
        (q.type === 'rating' ? ratingSettings(i, q) : '') +
        (q.type === 'number' || q.type === 'checks' ?
          '<div class="qrow">' +
            '<div class="f"><label class="fl">' + (q.type === 'checks' ? '최소 개수' : '가장 작은 값') + '</label>' +
              '<input type="number" id="qmin' + i + '" value="' + esc(q.min) + '"></div>' +
            '<div class="f"><label class="fl">' + (q.type === 'checks' ? '최대 개수' : '가장 큰 값') + '</label>' +
              '<input type="number" id="qmax' + i + '" value="' + esc(q.max) + '"></div>' +
            (q.type === 'number' ? '<div class="f"><label class="fl">단위</label>' +
              '<input type="text" id="qu' + i + '" maxlength="12" placeholder="장 · 명 · 개" value="' + esc(q.unit) + '"></div>' : '') +
          '</div>' : '') +
        (sec ? '' :
          '<label class="lkchg" style="display:flex;gap:9px;align-items:center;margin:2px 0 0;">' +
            '<input type="checkbox" id="qr' + i + '"' + (q.req ? ' checked' : '') + '>' +
            '<span>꼭 답해야 하는 문항</span></label>') +
        condSettings(i, q) +
        (canPrev ? '<div class="fx-preview"><div class="fx-cap">신청자에게 보이는 모습 (눌러 보셔도 저장되지 않습니다)</div>' +
          '<div id="qprevq' + i + '"></div></div>' : '') +
        '</div>';
    }
    parts[i] = '<div class="q' + (open ? ' sel' : '') + '">' +
      '<div class="qhead" onclick="toggleQ(' + i + ')">' +
        '<span class="qi">' + t.icon + '</span>' +
        '<span class="qn">' + (q.label ? esc(q.label) : '<span style="color:var(--ink-4);">제목 없는 문항</span>') +
          (q.req ? ' <span class="req">*</span>' : '') + '</span>' +
        '<span class="qt">' + esc(t.name) + (q.showIf ? '<span class="fx-badge" title="다른 문항의 답에 따라 보입니다">조건부</span>' : '') + '</span>' +
        '<button class="qbtn" onclick="event.stopPropagation();moveQ(' + i + ',-1)" title="위로">&uarr;</button>' +
        '<button class="qbtn" onclick="event.stopPropagation();moveQ(' + i + ',1)" title="아래로">&darr;</button>' +
        '<button class="qbtn" onclick="event.stopPropagation();delQ(' + i + ')" title="지우기">&times;</button>' +
      '</div>' + body + '</div>';
  });
  box.innerHTML = parts.join('');
  mountQuestionEditors();
}

/** 열려 있는 문항의 서식 편집기 (안내 문구) 와 미리보기를 꽂습니다 */
function mountQuestionEditors() {
  SEC_ED = null;
  var q = F.questions[OPENQ];
  if (!q) return;
  if (q.type === 'section' && el('qhEd' + OPENQ)) {
    SEC_ED = FormsCore.RichEditor(el('qhEd' + OPENQ), {
      html: q.helpHtml || '', text: q.help || '', maxText: 500, minHeight: '84px',
      placeholder: '신청자에게 보여줄 안내 문구를 적어주세요.',
      onChange: function (html, text) { q.help = text; q.helpHtml = html; }
    });
    SEC_ED.el.setAttribute('aria-labelledby', 'qhLbl' + OPENQ);
  }
  refreshPreview();
}

/** 미리보기: 신청자 화면과 같은 부품(FormsCore.mountQuestion)으로 그립니다 */
function refreshPreview() {
  var i = OPENQ, q = F.questions[i], host = el('qprevq' + i);
  if (!q || !host) return;
  var pq = {};
  for (var k in q) if (Object.prototype.hasOwnProperty.call(q, k)) pq[k] = q[k];
  pq.label = q.label || '(질문을 적어주세요)';
  pq.opts = (q.opts || []).filter(function (o) { return String(o).trim() !== ''; });
  FormsCore.mountQuestion(host, pq, { value: PREV_VAL, onChange: function (v) { PREV_VAL = v; } });
}
function schedulePreview(e) {
  if (e && e.target && e.target.closest && e.target.closest('.fx-preview')) return;   // 미리보기 안에서 누른 것은 다시 그리지 않음
  if (e && e.target && e.target.closest && e.target.closest('.fx-rte')) return;        // 글 쓰는 중에는 그대로
  clearTimeout(PREV_T);
  PREV_T = setTimeout(function () {
    if (VIEW !== 'edit' || OPENQ < 0 || !F.questions[OPENQ] || !el('qprevq' + OPENQ)) return;
    pullQuestions();
    refreshPreview();
  }, 120);
}

/** 유형 바꾸기 — 문항을 지우고 새로 만들지 않고 type 만 바꿉니다 (opts · min · max · unit · 별점 · 기타 설정은 모두 남김) */
function setQType(i, key) {
  pullQuestions();
  var q = F.questions[i];
  if (!q || q.type === key) return;
  var tp = typeOf(key);
  q.type = key;
  if (tp.opts && !(q.opts || []).some(function (o) { return String(o).trim(); })) {
    q.opts = (q.opts && q.opts.length >= 2) ? q.opts : ['', ''];
  }
  if (key === 'rating') {
    if (!q.scale) q.scale = 5;
    if (!q.variant) q.variant = 'star';
    if (q.variant === 'face' && Number(q.scale) !== 5) q.variant = 'number';
    q.lowLabel = q.lowLabel || ''; q.highLabel = q.highLabel || '';
  }
  PREV_VAL = '';
  OPENQ = i;
  fixConds();                                    // Step 7: 유형이 바뀌면 이 문항을 조건으로 쓰던 규칙의 연산자를 맞춥니다
  drawQuestions();
}
function toggleOther(i, on) { pullQuestions(); F.questions[i].other = !!on; PREV_VAL = ''; drawQuestions(); }
function setRating(i, k, v) {
  pullQuestions();
  var q = F.questions[i];
  if (k === 'scale') q.scale = Number(v) || 5; else q.variant = v;
  if (q.variant === 'face' && Number(q.scale) !== 5) q.variant = 'number';
  PREV_VAL = '';
  drawQuestions();
}
function ratingPreset(i) {
  pullQuestions();
  var q = F.questions[i];
  q.scale = 5; q.variant = 'face'; q.lowLabel = '매우 불만족'; q.highLabel = '매우 만족';
  PREV_VAL = '';
  drawQuestions();
}

function toggleQ(i) { pullQuestions(); OPENQ = (OPENQ === i) ? -1 : i; PREV_VAL = ''; drawQuestions(); }
function delQ(i) {
  pullQuestions();
  if (!confirm('이 문항을 지울까요?')) return;
  F.questions.splice(i, 1); OPENQ = -1;
  var n = fixConds();
  drawQuestions();
  if (n) alert('지운 문항을 조건으로 쓰던 ' + n + '개의 표시 조건이 함께 풀렸습니다.');
}
function moveQ(i, d) {
  pullQuestions();
  var j = i + d;
  if (j < 0 || j >= F.questions.length) return;
  var t = F.questions[i]; F.questions[i] = F.questions[j]; F.questions[j] = t;
  if (OPENQ === i) OPENQ = j; else if (OPENQ === j) OPENQ = i;
  var n = fixConds();                            // Step 7: 조건은 "앞 문항" 만 볼 수 있습니다
  drawQuestions();
  if (n) alert('순서가 바뀌어 ' + n + '개의 표시 조건이 풀렸습니다. (조건은 앞에 있는 문항의 답만 볼 수 있습니다)');
}
function addOpt(i) { pullQuestions(); F.questions[i].opts.push(''); drawQuestions(); }
function delOpt(i, j) { pullQuestions(); F.questions[i].opts.splice(j, 1); drawQuestions(); }

function saveForm() {
  pullForm();
  if (!String(F.title || '').trim()) { say('saveMsg', '제목을 입력해주세요.', 'err'); el('fTitle').focus(); return; }
  var bad = '';
  F.questions.forEach(function (q, i) {
    if (!String(q.label || '').trim()) bad = bad || ((i + 1) + '번 문항의 질문을 적어주세요.');
    if (q.showIf) q.showIf.rules.forEach(function (r) {        // Step 7: 값이 빈 조건은 서버가 버리므로 미리 알려줍니다
      if (r.op !== 'filled' && r.op !== 'empty' && String(r.v == null ? '' : r.v).trim() === '') bad = bad || ((i + 1) + '번 문항의 표시 조건에서 비교할 값을 골라주세요.');
    });
    if ((q.type === 'choice' || q.type === 'checks') && !q.other &&      // Step 6: "기타" 칸만 있는 문항도 허용
        !(q.opts || []).filter(function (o) { return String(o).trim(); }).length) {
      bad = bad || ('"' + (q.label || (i + 1) + '번 문항') + '" 의 선택지를 적어주세요.');
    }
  });
  if (bad) { say('saveMsg', bad, 'err'); return; }
  say('saveMsg', '저장하는 중…');
  callServer('formSave', [TOKEN, F], function (r) {
    D = r.admin;
    say('saveMsg', '저장했습니다.', 'ok');
    setTimeout(drawList, 350);
  }, function (e) { say('saveMsg', e.message || '저장하지 못했습니다.', 'err'); });
}

function targetOptions() {
  var groups = {}, plain = [];
  (D.targets || []).forEach(function (t) {
    if (t.group) (groups[t.group] = groups[t.group] || []).push(t);
    else plain.push(t);
  });
  var opt = function (t) { return '<option value="' + esc(t.key) + '">' + esc(t.name) + ' (' + t.n + '명)</option>'; };
  return plain.map(opt).join('') + Object.keys(groups).map(function (g) {
    return '<optgroup label="' + esc(g) + '">' + groups[g].map(opt).join('') + '</optgroup>';
  }).join('') +
  ((D.people || []).length ? '<optgroup label="한 사람씩">' + D.people.map(function (n) {
    return '<option value="' + esc('사람:' + n) + '">' + esc(n) + '</option>';
  }).join('') + '</optgroup>' : '');
}

function shareKey(kind, name) { return kind + ':' + name; }
function drawShares() {
  var b = el('shList'); if (!b) return;
  var sh = F.shares || [];
  b.innerHTML = sh.length ? sh.map(function (s, i) {
    var kind = s.key.split(':')[0];
    return '<div class="fx-share"><span class="nm">' + esc(kind === '사람' ? '👤' : kind === '셀' ? '👥' : '🎵') + ' ' + esc(s.key.slice(kind.length + 1)) +
      ' <span style="color:var(--fx-sub);font-weight:600;">(' + esc(kind === '사람' ? '한 사람' : kind === '셀' ? '셀' : '사역팀') + ')</span></span>' +
      '<label><input type="checkbox"' + (s.notify ? ' checked' : '') + ' onchange="F.shares[' + i + '].notify=this.checked"> 새 신청 알림</label>' +
      '<button type="button" class="qbtn" onclick="delShare(' + i + ')" title="빼기" aria-label="빼기">&times;</button></div>';
  }).join('') : '<p class="empty" style="margin:0 0 8px;">아직 공유한 곳이 없습니다.</p>';
}
function shareCandidates(kind) {
  if (kind === '사람') return D.people || [];
  var pre = kind + ':';
  return (D.targets || []).filter(function (t) { return t.key.indexOf(pre) === 0; }).map(function (t) { return t.name; });
}
function drawShareNames() {
  var dl = el('shNames'); if (!dl) return;
  dl.innerHTML = shareCandidates(el('shKind').value).map(function (n) { return '<option value="' + esc(n) + '"></option>'; }).join('');
  el('shName').value = '';
}
function addShare() {
  var kind = el('shKind').value, name = el('shName').value.trim();
  if (!name) { say('shMsg', '이름을 골라주세요.', 'err'); return; }
  if (shareCandidates(kind).indexOf(name) === -1) { say('shMsg', '목록에 없는 이름입니다. 목록에서 골라주세요.', 'err'); return; }
  F.shares = F.shares || [];
  var key = shareKey(kind, name);
  if (F.shares.some(function (s) { return s.key === key; })) { say('shMsg', '이미 더했습니다.', 'err'); return; }
  if (F.shares.length >= 30) { say('shMsg', '공유는 30곳까지 할 수 있습니다.', 'err'); return; }
  F.shares.push({ key: key, notify: false });
  say('shMsg', '');
  el('shName').value = '';
  drawShares();
}
function delShare(i) { F.shares.splice(i, 1); drawShares(); }
function saveShares() {
  say('shMsg', '저장하는 중…');
  callServer('formShareSave', [TOKEN, F.id, F.shares || []], function (r) {
    F.shares = r.shares || [];
    drawShares();
    say('shMsg', '공유 범위를 저장했습니다.', 'ok');
  }, function (e) { say('shMsg', e.message || '저장하지 못했습니다.', 'err'); });
}

/* ===================== Step 7 — 알릴 대상 여러 곳 · 공유 ===================== */

function targetName(key) {
  var nm = key;
  (D.targets || []).forEach(function (t) { if (t.key === key) nm = t.name; });
  if (key.indexOf('사람:') === 0) nm = key.slice(3);
  return nm;
}
function drawAnChips() {
  var b = el('anChips'); if (!b) return;
  b.innerHTML = AN.map(function (k, i) {
    return '<span class="fx-chip">' + esc(targetName(k)) + '<button type="button" onclick="delAnTarget(' + i + ')" aria-label="빼기">&times;</button></span>';
  }).join('');
}
function addAnTarget() {
  var v = el('anTarget').value;
  if (v && AN.indexOf(v) === -1) AN.push(v);
  drawAnChips();
}
function delAnTarget(i) { AN.splice(i, 1); drawAnChips(); }

function announceNow() {
  var to = AN.length ? AN.slice() : [el('anTarget').value];     // 아무것도 안 더했으면 예전처럼 고른 한 곳
  if (!confirm('지금 알릴까요? (' + to.map(targetName).join(', ') + ')')) return;
  say('anMsg', '보내는 중…');
  callServer('announceForm', [TOKEN, F.id, to, {
      push: el('anPush').checked, portal: el('anPortal').checked, mail: el('anMail').checked
    }], function (r) {
      var parts = [];
      if (r.portal) parts.push('포털에 올림');
      if (r.push) parts.push('알림 ' + r.push + '대');
      if (r.mail) parts.push('이메일 ' + r.mail + '통');
      say('anMsg', (parts.join(' · ') || '보냈습니다') + '.', 'ok');
    }, function (e) { say('anMsg', e.message || '보내지 못했습니다.', 'err'); });
}

function saveAsTemplate() {
  var name = el('tplName').value.trim();
  if (!name) { say('tplMsg', '본보기 이름을 적어주세요.', 'err'); return; }
  say('tplMsg', '저장하는 중…');
  callServer('saveFormTemplate', [TOKEN, F.id, name, ''], function () {
    say('tplMsg', '본보기로 저장했습니다. 목록 첫 화면에서 쓸 수 있습니다.', 'ok');
  }, function (e) { say('tplMsg', e.message || '저장하지 못했습니다.', 'err'); });
}

function removeForm() {
  if (!confirm('이 신청서와 들어온 신청 내용까지 모두 지웁니다. 계속할까요?')) return;
  callServer('formDelete', [TOKEN, F.id], function (r) { D = r; drawList(); },
    function (e) { alert(e.message || '지우지 못했습니다.'); });
}

/* ===================== 결과 ===================== */

function showResults(id) {
  STF = 'all';
  window.scrollTo(0, 0);
  el('root').innerHTML = '<div class="panel"><i class="skel line" style="width:60%;"></i><i class="skel line" style="width:40%;"></i></div>';
  callServer('formResults', [TOKEN, id], drawResults, function (e) {
    el('root').innerHTML = '<div class="panel"><p class="msg err">' + esc(e.message) + '</p></div>';
  });
}

var ST_ALL = ['접수', '미결제', '결제완료', '취소'];

function drawResults(r) {
  R = r; VIEW = 'res';
  var f = r.form;
  var canEdit = r.canEdit !== false;                                  // Step 7: 공유로 보는 분은 보기만
  var sts = r.answerStatuses || ST_ALL;
  if (STF !== 'all' && sts.indexOf(STF) === -1) STF = 'all';
  var shown = r.rows.filter(function (a) { return STF === 'all' || (a.status || '접수') === STF; });
  var qs = (f.questions || []).filter(function (q) { return q.type !== 'section'; });
  var link = location.origin + location.pathname + '?page=portal';

  var bars = r.stats.map(function (s) {
    if (s.type === 'number') {
      return '<div class="fbars"><div class="bl">' + esc(s.label) + '</div>' +
        '<div style="font-size:22px;font-weight:800;">' + s.sum + (s.unit ? ' ' + esc(s.unit) : '') +
        ' <span style="font-size:13.5px;font-weight:600;color:var(--ink-3);">(' + s.n + '명 합계)</span></div></div>';
    }
    var max = 1;
    s.items.forEach(function (x) { if (x.n > max) max = x.n; });
    /* Step 6: 별점 · 만족도 — 평균 + 점수별 인원 / "기타" 로 적은 내용 목록 */
    var ratingHead = s.type === 'rating'
      ? '<div style="font-size:22px;font-weight:800;">' + (s.n ? s.avg : '-') + ' <span style="font-size:13.5px;font-weight:600;color:var(--ink-3);">/ ' + s.scale + ' (' + s.n + '명 평균)</span></div>'
      : '';
    var othersBox = (s.others && s.others.length)
      ? '<div class="fx-others"><b>"기타" 로 적은 내용 (' + s.others.length + ')</b><br>' +
        s.others.map(function (o) { return esc(o.name) + ' — ' + esc(o.text); }).join('<br>') + '</div>'
      : '';
    return '<div class="fbars"><div class="bl">' + esc(s.label) + '</div>' + ratingHead +
      s.items.map(function (x) {
        return '<div class="fbar"><span class="bn">' + esc(x.name) + '</span>' +
          '<span class="bg"><i style="width:' + Math.round(x.n / max * 100) + '%;"></i></span>' +
          '<span class="bv">' + x.n + '</span></div>';
      }).join('') +
      (s.none ? '<div class="fbar"><span class="bn" style="color:var(--ink-4);">답 없음</span>' +
        '<span class="bg"></span><span class="bv">' + s.none + '</span></div>' : '') +
      othersBox + '</div>';
  }).join('');

  var head = ['이름', '연락처', '셀', '제출'].concat(qs.map(function (q) { return q.label; }));
  var body = shown.map(function (a) {
    var cells = [esc(a.name), esc(a.phone), esc(a.cell), esc((a.at || '').slice(5))]
      .concat(qs.map(function (q) {
        var v = a.answers[q.id];
        if (q.type === 'agree') return v ? '✔' : '';
        /* 파일 답이 든 칸이면 (유형을 바꾸기 전에 받은 답 포함) 링크로 */
        if (Array.isArray(v) && v.length && v[0] && typeof v[0] === 'object') return v.map(function (x) {
          return x.id
            ? '<a href="https://drive.google.com/file/d/' + esc(x.id) + '/view" target="_blank" rel="noopener">' + esc(x.name || x.id) + '</a>'
            : esc(x.name || '');
        }).join('<br>');
        if (Array.isArray(v)) return esc(v.join(', '));                  // 여러 개 고르기 (또는 그 전 유형에서 받은 답)
        if (q.type === 'rating' && v !== '' && v != null) return esc(v) + ' / ' + esc(FormsCore.ratingConfig(q).scale);
        return esc(v == null ? '' : String(v));
      }));
    var st = a.status || '접수';
    var stCell = canEdit
      ? '<select data-name="' + esc(a.name) + '" onchange="setOneStatus(this)" aria-label="' + esc(a.name) + ' 상태">' +
          sts.map(function (x) { return '<option value="' + esc(x) + '"' + (x === st ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('') + '</select>'
      : '<span class="stt ' + esc(st) + '">' + esc(st) + '</span>';
    return '<tr' + (st === '취소' ? ' class="cx"' : '') + '>' +
      (canEdit ? '<td class="ck"><input type="checkbox" class="rck" data-name="' + esc(a.name) + '" aria-label="' + esc(a.name) + ' 고르기"></td>' : '') +
      cells.slice(0, 4).map(function (c) { return '<td>' + c + '</td>'; }).join('') +
      '<td class="stc">' + stCell + '</td>' +                     // 상태는 이름 옆에 (가로로 밀지 않아도 보이게)
      cells.slice(4).map(function (c) { return '<td class="wrap">' + c + '</td>'; }).join('') +
      (canEdit && !r.anonymous ? '<td class="dr"><button class="drop" title="이 신청 지우기" onclick="dropAnswer(\'' + jsq(a.name) + '\')">&times;</button></td>' : (canEdit ? '<td></td>' : '')) + '</tr>';
  }).join('');

  var cnt = r.counts || {};
  var chips = '<div class="fx-stchips" role="group" aria-label="상태로 걸러 보기">' +
    '<button type="button" class="' + (STF === 'all' ? 'on' : '') + '" aria-pressed="' + (STF === 'all') + '" onclick="setStFilter(\'all\')">전체 <b>' + r.count + '</b></button>' +
    sts.map(function (x) {
      return '<button type="button" class="' + (STF === x ? 'on' : '') + '" aria-pressed="' + (STF === x) + '" onclick="setStFilter(\'' + x + '\')">' + esc(x) + ' <b>' + (cnt[x] || 0) + '</b></button>';
    }).join('') + '</div>';
  var bulk = canEdit && r.count
    ? '<div class="fx-bulk"><select id="bkSt" aria-label="바꿀 상태">' + sts.map(function (x) { return '<option value="' + esc(x) + '">' + esc(x) + '</option>'; }).join('') + '</select>' +
      '<button type="button" class="btn mini" onclick="applyBulk()">고른 분에게 적용</button>' +
      '<label><input type="checkbox" id="bkNotify"> 바꾸면 신청자에게 알림</label></div>'
    : '';

  el('root').innerHTML =
    '<div class="bar2" style="margin:0 12px 12px;">' +
      (canEdit ? '<button class="backb" onclick="openForm(\'' + jsq(f.id) + '\')">&lsaquo; 신청서</button>'
               : '<button class="backb" onclick="drawList()">&lsaquo; 목록</button>') +
      '<span class="sp"></span>' +
      '<button class="btn mini" onclick="exportResults()">엑셀로 받기</button>' +
    '</div>' +
    '<div class="panel"><span class="chip">' + esc(f.title) + '</span>' +
      '<div class="rstat">' +
        '<div class="b"><b>' + (r.active != null ? r.active : r.count) + '</b>신청' + ((cnt['취소'] || 0) ? ' <span style="font-size:11.5px;">(취소 ' + cnt['취소'] + ' 제외)</span>' : '') + '</div>' +
        (f.limit ? '<div class="b"><b>' + Math.max(0, f.limit - (r.active != null ? r.active : r.count)) + '</b>남은 자리</div>' : '') +
        '<div class="b"><b>' + esc(f.status) + '</b>상태</div>' +
      '</div>' +
      '<p class="hint" style="margin-bottom:0;">신청하는 분은 포털 첫 화면에서 이 신청서를 보게 됩니다. ' +
      '<span class="lnk">' + esc(link) + '</span></p>' +
    '</div>' +
    partPanel(r) +
    (bars ? '<div class="panel"><span class="chip">한눈에 보기</span>' + bars + '</div>' : '') +
    '<div class="panel"><span class="chip">신청한 분들</span>' + chips + bulk +
      (shown.length
        ? '<div class="tscroll"><table class="res" id="resTbl"><thead><tr>' +
            (canEdit ? '<th class="ck"><input type="checkbox" id="rckAll" onchange="toggleAllRows(this.checked)" aria-label="모두 고르기"></th>' : '') +
            head.slice(0, 4).concat(['상태'], head.slice(4)).map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + (canEdit ? '<th></th>' : '') + '</tr></thead>' +
            '<tbody>' + body + '</tbody></table></div>'
        : '<p class="empty">' + (r.rows.length ? '이 상태인 분이 없습니다.' : '아직 신청한 분이 없습니다.') + '</p>') +
      '<p class="msg" id="resMsg"></p>' +
    '</div>';
}

/** v6 — 참여 현황 (대상 중 몇 명 · 아직 안 한 분 · 다시 알림) */
function partPanel(r) {
  var p = r.participation, f = r.form;
  if (!p && !r.anonymous) return '';
  var pct = p && p.total ? Math.round(p.done / p.total * 100) : 0;
  return '<div class="panel"><span class="chip">' + (f.kind === 'survey' ? '📊 참여 현황' : '참여 현황') + '</span>' +
    (r.anonymous ? '<p class="hint" style="margin:0 0 10px;">🙈 <b>익명</b> — 누가 무엇을 골랐는지는 만든 사람도 볼 수 없습니다.</p>' : '') +
    (p ? '<div class="fx-part"><div class="bar"><i style="width:' + pct + '%"></i></div><b>' + p.done + ' / ' + p.total + '명</b> 참여 (' + pct + '%)</div>' +
      (p.pendingN ? '<p class="fl" style="margin:10px 0 4px;">아직 안 한 분 ' + p.pendingN + '명</p>' +
        (p.pending.length ? '<div class="fx-pend">' + p.pending.map(function (n) { return '<span>' + esc(n) + '</span>'; }).join('') + '</div>' : '') +
        (r.canEdit !== false && f.status === '받는중' ? '<div class="fx-addrow" style="margin-top:10px;"><button class="btn mini accent" onclick="remindNow(false)">🔔 아직 안 한 분께 다시 알림</button><button class="btn mini" onclick="remindNow(true)">🔔 + 이메일</button></div>' : '')
        : '<p class="msg ok" style="margin:8px 0 0;">대상 모두 참여했습니다 🎉</p>') : '') +
    '<p class="msg" id="remMsg"></p></div>';
}
function remindNow(mail) {
  if (!R) return;
  say('remMsg', '보내는 중…');
  callServer('surveyRemind', [TOKEN, R.form.id, { mail: !!mail }], function (x) { say('remMsg', x.pending ? x.pending + '명께 다시 알렸습니다' + (x.mail ? ' (이메일 ' + x.mail + '명)' : '') + '.' : '모두 참여했습니다.', 'ok'); },
    function (e) { say('remMsg', e.message || String(e), 'err'); });
}

/* ===================== Step 7 — 신청 상태 태그 ===================== */

function setStFilter(k) { STF = k; drawResults(R); }
function toggleAllRows(on) {
  var b = document.querySelectorAll('#resTbl .rck');
  for (var i = 0; i < b.length; i++) b[i].checked = !!on;
}
function reloadResultsKeepScroll(msg) {
  var y = window.pageYOffset || 0;
  callServer('formResults', [TOKEN, R.form.id], function (r) {
    drawResults(r);
    window.scrollTo(0, y);
    if (msg) say('resMsg', msg, 'ok');
  }, function (e) { say('resMsg', e.message || '다시 불러오지 못했습니다.', 'err'); });
}
function applyStatus(names, status) {
  var nt = el('bkNotify');
  say('resMsg', '바꾸는 중…');
  callServer('formSetAnswerStatus', [TOKEN, R.form.id, names, status, !!(nt && nt.checked)], function (res) {
    var m = res.changed ? (res.changed + '명을 "' + status + '" 로 바꿨습니다.' + (res.pushed ? ' (알림 ' + res.pushed + '대)' : '')) : '이미 그 상태입니다.';
    reloadResultsKeepScroll(m);
  }, function (e) { say('resMsg', e.message || '바꾸지 못했습니다.', 'err'); reloadResultsKeepScroll(''); });
}
function setOneStatus(sel) { applyStatus([sel.getAttribute('data-name')], sel.value); }
function applyBulk() {
  var names = [], b = document.querySelectorAll('#resTbl .rck:checked');
  for (var i = 0; i < b.length; i++) names.push(b[i].getAttribute('data-name'));
  if (!names.length) { say('resMsg', '먼저 표에서 신청한 분을 골라주세요.', 'err'); return; }
  var st = el('bkSt').value;
  if (st === '취소' && !confirm(names.length + '명의 신청을 "취소" 로 바꿀까요? (정원 · 집계에서 빠집니다)')) return;
  applyStatus(names, st);
}

function dropAnswer(name) {
  if (!confirm(name + '님의 신청을 지울까요?')) return;
  callServer('formDropAnswer', [TOKEN, R.form.id, name], drawResults,
    function (e) { say('resMsg', e.message || '지우지 못했습니다.', 'err'); });
}

function exportResults() {
  say('resMsg', '만드는 중…');
  callServer('formExport', [TOKEN, R.form.id], function (res) {
    say('resMsg', res.count + '명 내려받았습니다.' + (res.fallback ? ' (CSV)' : ''), 'ok');
    saveB64(res);
  }, function (e) { say('resMsg', e.message || '내보내지 못했습니다.', 'err'); });
}

boot();
</script>
</body>
</html>
