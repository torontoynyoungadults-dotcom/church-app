<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* 회의록 · 할 일 — 구조만 정의합니다. 색·여백은 Theme 이 맡습니다 */
  :root { --accent: #6C4FD3; --tone-rgb: 108,79,211; }
  * { box-sizing: border-box; }

  .mtabs { display: flex; gap: 7px; margin: 0 16px 12px; }
  .mtabs button {
    flex: 1; padding: 11px 10px; border-radius: 12px; font: 800 15px inherit; font-family: inherit;
    cursor: pointer; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.07); color: #DCD7D0;
  }
  .mtabs button.on { background: linear-gradient(135deg, var(--tone), var(--accent)); border-color: transparent; color: #fff; }

  /* ---- 회의록 목록 ---- */
  .mlist { display: grid; gap: 9px; }
  .mitem {
    display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    padding: 14px 14px; border-radius: 14px; cursor: pointer; font-family: inherit;
    background: rgba(255,255,255,.075); border: 1px solid rgba(255,255,255,.15);
  }
  .mitem .mi { width: 38px; height: 38px; border-radius: 11px; flex: none; display: flex;
    align-items: center; justify-content: center; font-size: 19px; background: rgba(var(--tone-rgb),.28); }
  .mitem .mb { flex: 1; min-width: 0; }
  .mitem .mb b { display: block; font-size: 16px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.02em; }
  .mitem .mb span { display: block; font-size: 13.5px; color: #DCD7D0; margin-top: 2px; line-height: 1.6; }
  .mitem .mn { flex: none; font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 99px;
    background: rgba(255,255,255,.14); color: #FFFFFF; white-space: nowrap; }
  .mitem .mn.hot { background: #8C3416; }

  /* ---- 문서 본문 ---- */
  .doc {
    font-size: 16px; line-height: 1.95; color: #F4F1EC; word-break: break-word;
  }
  .doc h1, .doc h2, .doc h3, .doc h4 { color: #FFFFFF; line-height: 1.5; margin: 24px 0 10px; letter-spacing: -0.02em; }
  .doc h1 { font-size: 22px; } .doc h2 { font-size: 19.5px; } .doc h3 { font-size: 17.5px; } .doc h4 { font-size: 16.5px; }
  .doc p { margin: 0 0 12px; }
  .doc ul, .doc ol { margin: 0 0 14px; padding-left: 22px; }
  .doc li { margin-bottom: 7px; }
  .doc b, .doc strong { color: #FFFFFF; }
  .doc a { color: #C9B9FF; }
  .doc img { max-width: 100%; height: auto; border-radius: 12px; margin: 10px 0;
    border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); display: block; }
  .doc hr { border: none; border-top: 1px solid rgba(255,255,255,.18); margin: 20px 0; }
  .doc table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 15px; }
  .doc td, .doc th { border: 1px solid rgba(255,255,255,.18); padding: 9px 10px; vertical-align: top; }
  .doc th { background: rgba(255,255,255,.1); color: #FFFFFF; font-weight: 800; }
  .doc blockquote { margin: 12px 0; padding: 4px 0 4px 14px; border-left: 3px solid rgba(var(--tone-rgb),.6); color: #E9E5DF; }

  .docwrap { max-height: 62vh; overflow-y: auto; padding-right: 4px; }
  .docwrap.all { max-height: none; }
  .morebtn { width: 100%; margin-top: 10px; }

  /* ---- 할 일 ---- */
  .tlist { display: grid; gap: 8px; }
  .titem {
    display: flex; align-items: flex-start; gap: 11px; padding: 13px 13px; border-radius: 13px;
    background: rgba(255,255,255,.075); border: 1px solid rgba(255,255,255,.15);
  }
  .titem.done { opacity: .62; }
  .titem .ck {
    flex: none; width: 24px; height: 24px; border-radius: 7px; margin-top: 1px; cursor: pointer;
    border: 2px solid rgba(255,255,255,.4); background: none; display: flex; align-items: center;
    justify-content: center; font-size: 15px; color: #fff; font-family: inherit; padding: 0;
  }
  .titem.done .ck { background: #2E9A4B; border-color: #2E9A4B; }
  .titem .tb { flex: 1; min-width: 0; }
  .titem .tb b { display: block; font-size: 15.5px; font-weight: 750; color: #FFFFFF; line-height: 1.6; }
  .titem.done .tb b { text-decoration: line-through; }
  .titem .tm { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .titem .tg { font-size: 12.5px; font-weight: 800; padding: 3px 9px; border-radius: 7px;
    background: rgba(255,255,255,.14); color: #FFFFFF; }
  .titem .tg.who { background: rgba(var(--tone-rgb),.32); }
  .titem .tg.late { background: #8C3416; }
  .titem .tg.soon { background: #8A5A12; }
  .titem .tg.none { background: rgba(255,255,255,.1); color: #C7C1B9; }
  .titem .tx { flex: none; background: none; border: none; color: #C7C1B9; font-size: 19px;
    line-height: 1; cursor: pointer; padding: 0 2px; font-family: inherit; }

  /* ---- Gemini 요약 · 할 일 추출 ---- */
  .ai-summary { font-size: 14.5px; line-height: 1.85; color: #F4F1EC; }
  .ai-summary p { margin: 0 0 6px; }
  .aitlist { display: grid; gap: 8px; margin-top: 10px; }
  .aitask {
    display: flex; align-items: flex-start; gap: 10px; padding: 12px 13px; border-radius: 13px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
  }
  .aitask .ab { flex: 1; min-width: 0; }
  .aitask .ab b { display: block; font-size: 15px; font-weight: 750; color: #FFFFFF; line-height: 1.6; }
  .aitask .tm { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .aitask .tg { font-size: 12.5px; font-weight: 800; padding: 3px 9px; border-radius: 7px;
    background: rgba(255,255,255,.14); color: #FFFFFF; }
  .aitask .tg.who { background: rgba(var(--tone-rgb),.32); }
  .aitask .tg.none { background: rgba(255,255,255,.1); color: #C7C1B9; }

  /* ---- 할 일 넣기 ---- */
  .trow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .trow.one { grid-template-columns: 1fr; }
  .addbox { margin-top: 12px; padding-top: 14px; border-top: 1px dashed rgba(255,255,255,.2); }

  .mtop { display: flex; align-items: center; gap: 8px; margin: 0 16px 12px; }
  .mtop .back { flex: none; }
  .mtop .sp { flex: 1; }

  .guide { font-size: 13.5px; line-height: 1.85; color: #E4E0DA; }
  .guide code { background: rgba(255,255,255,.14); border-radius: 5px; padding: 1px 6px;
    font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; color: #FFFFFF; }
  /* ---------- 유리 느낌 (배경이 비치는 카드) — 포털과 같은 결 ---------- */
  body .panel {
    background: rgba(255,255,255,.07) !important;
    border: 1px solid rgba(255,255,255,.14) !important;
    color: var(--night-ink) !important;
    box-shadow: 0 8px 26px rgba(0,0,0,.26) !important;
    -webkit-backdrop-filter: blur(20px) saturate(155%); backdrop-filter: blur(20px) saturate(155%);
  }
  body .panel .chip { color: #FFFFFF !important; }
  body .panel .hint, body .panel .sub, body .panel .fnote, body .panel .lede,
  body .panel .empty, body .panel .meta { color: #E9E5DF !important; }
  body .panel label, body .panel .fl, body .panel .k { color: #F2EFEA !important; }
  body .panel b, body .panel strong { color: #FFFFFF; }
  body .panel input, body .panel select, body .panel textarea {
    background: rgba(255,255,255,.08) !important; border-color: rgba(255,255,255,.16) !important;
    color: #FFFFFF !important;
  }
  body .panel input::placeholder, body .panel textarea::placeholder { color: #B7B0A7 !important; }
  body .panel .picklist button {
    background: rgba(255,255,255,.06) !important; border-color: rgba(255,255,255,.14) !important;
    color: #F5F3EF !important;
  }
  body .panel .picklist button.picked {
    background: linear-gradient(135deg, var(--tone), var(--accent)) !important;
    border-color: transparent !important; color: #fff !important;
  }
  body .panel .btn:not(.accent):not(.danger) {
    background: rgba(255,255,255,.1) !important; border-color: rgba(255,255,255,.18) !important;
    color: #FFFFFF !important;
  }
  body .panel .btn.accent, body .panel .submit {
    background: linear-gradient(135deg, var(--tone), var(--accent)) !important; border: none !important;
  }

  /* 안내 박스 · 카드 · 통계 · 줄 버튼도 같은 유리로 */
  body .notice, body .banner, body .callout, body .subnotice,
  body .card, body .nfcard, body .mcard, body .dcard, body .mrow, body .song,
  body .fileitem, body .msrow, body .stat, body .moodbox, body .facebox, body .rowbtn {
    background: rgba(255,255,255,.055) !important;
    border-color: rgba(255,255,255,.12) !important;
    color: var(--night-ink) !important;
    box-shadow: none !important;
  }
  body .notice b, body .banner b, body .callout b,
  body .card b, body .nfcard b, body .mcard b, body .dcard b, body .stat .v {
    color: #FFFFFF !important;
  }
  body .notice p, body .banner p, body .callout p, body .subnotice p,
  body .card .meta, body .stat .k, body .tag, body .rolepill.none, body .rolepill.soft {
    color: #E9E5DF !important;
  }
  body .tag, body .rolepill.none, body .rolepill.soft { background: rgba(255,255,255,.08) !important; }
  body .bar { background: rgba(255,255,255,.12) !important; }
  body table th { background: rgba(255,255,255,.06) !important; color: #EDEAE5 !important; }
  body table td { border-color: rgba(255,255,255,.1) !important; color: var(--night-ink); }

  /* ============ 가독성 최우선 — 어두운 유리 위 글씨는 흰색 ============ */
body .tpl button,
  body /* 문항 만들기 */
  .q,
  body .addq button,
  body .rstat .b,
  body .tscroll {
    background: rgba(255,255,255,.075) !important;
    border-color: rgba(255,255,255,.15) !important;
    color: #F4F1EC !important;
    box-shadow: none !important;
  }
body .tpl button b,
  body /* 문항 만들기 */
  .q b,
  body .addq button b,
  body .rstat .b b,
  body .tscroll b { color: #FFFFFF !important; }
body .tpl button .k,
  body /* 문항 만들기 */
  .q .k,
  body .addq button .k,
  body .rstat .b .k,
  body .tscroll .k, body .tpl button .meta,
  body /* 문항 만들기 */
  .q .meta,
  body .addq button .meta,
  body .rstat .b .meta,
  body .tscroll .meta { color: #E4E0DA !important; }

  body .panel .picklist button .t b, body .picklist button .t b { color: #FFFFFF !important; }
  body .panel .picklist button .t span, body .picklist button .t span { color: #DED9D2 !important; }
  body .picklist button.picked .t b, body .picklist button.picked .t span { color: #FFFFFF !important; }
  body .panel .closing { color: #E9E5DF !important; }
  body .panel .closing b { color: #FFFFFF !important; }
  body .panel .hint, body .panel .sub, body .panel .lede, body .panel .fnote,
  body .panel .empty, body .panel .meta, body .panel .desc, body .panel .note,
  body .panel .cap, body .panel small, body .panel .msg, body .panel .fs { color: #E4E0DA !important; }
  body .panel > p, body .panel li { color: #ECE9E4; }
  body .panel h1, body .panel h2, body .panel h3, body .panel h4,
  body .panel .tit, body .panel .ttl, body .panel .nm { color: #FFFFFF !important; }
  body .panel input::placeholder, body .panel textarea::placeholder,
  body input::placeholder, body textarea::placeholder { color: #B7B0A7 !important; }
  body .panel a:not(.btn) { color: #FFC9AB; }
  body .panel hr, body .panel .divider { border-color: rgba(255,255,255,.18) !important; }
  body .panel option, body .panel optgroup { color: #1A1917; }

  /* 어두운 유리 위에서는 글씨 변수 자체를 밝은 쪽으로 (가독성 최우선) */
  body .shell, body .shell * {
    --ink-1: #FFFFFF; --ink-2: #F0EDE8; --ink-3: #DCD7D0; --ink-4: #C2BCB4;
    --night-ink: #FFFFFF; --night-sub: #D9D4CD;
    --hair: rgba(255,255,255,.15); --hair-2: rgba(255,255,255,.22);
  }
  body option, body optgroup { color: #1A1917; background: #FFFFFF; }
  body .ynfoot .cp { color: #CFC9C1 !important; }

  /* 밝은 회색 박스도 유리로 (가독성) */
body .fcard:hover,
  body .st.준비중,
  body .st.보관,
  body .fbar .bg {
    background: rgba(255,255,255,.085) !important;
    border-color: rgba(255,255,255,.16) !important;
    color: #F4F1EC !important;
  }
  body button:disabled, body .submit:disabled, body .btn:disabled {
    background: rgba(255,255,255,.14) !important; color: #CFC9C1 !important;
    border-color: rgba(255,255,255,.18) !important; opacity: 1 !important;
  }
  body .btn.accent, body .dirbtn, body .pwsubmit { color: #FFFFFF !important; }
  body .wk.on, body .wk.on * { color: #FFFFFF !important; }

  /* 유리 위 흰 버튼·탭·칩 — 글씨와 배경 짝 맞추기 (가독성) */
  body .btn:not(.accent):not(.danger):not(.primary):not(.ghost) {
    background: rgba(255,255,255,.13) !important;
    border-color: rgba(255,255,255,.22) !important;
    color: #FFFFFF !important;
  }
  body .tabs button { color: #DCD7D0 !important; }
  body .tabs button.on {
    background: linear-gradient(135deg, var(--tone), var(--accent)) !important;
    border-color: transparent !important; color: #FFFFFF !important;
  }
  body .st.준비중, body .st.보관 { background: rgba(255,255,255,.16) !important; color: #FFFFFF !important; }
  body .st.받는중 { background: #1D6B4B !important; color: #FFFFFF !important; }
  body .st.마감 { background: #8C3416 !important; color: #FFFFFF !important; }

  /* 배경 없는 버튼은 브라우저 기본 검정 글씨가 되므로 밝게 (가독성) */
  body .seg button, body .shell button:not([class]) { color: #DCD7D0 !important; }
  body .seg button.on { color: #FFFFFF !important; }

  /* 상태색 칩·위험 버튼도 어두운 유리 위에서 또렷하게 */
  body .btn.danger { background: rgba(255,255,255,.12) !important; color: #FF9E90 !important;
                     border-color: rgba(255,158,144,.45) !important; }
  body .tn.off, body .tp.off { background: rgba(255,120,100,.22) !important; color: #FFB3A6 !important; }
  body .tn.guest { background: rgba(var(--tone-rgb,210,81,31),.26) !important; color: #FFC0A1 !important; }
  body .tn.hl, body .tp.hl { color: #FFFFFF !important; }
  body .oc, body .mo { color: #FFB3A6 !important; background: rgba(255,120,100,.2) !important; }

  /* ---------- 입력칸 · 드롭다운은 전부 같은 유리로 (흰 칸이 남지 않게) ---------- */
  body input:not([type=checkbox]):not([type=radio]):not([type=range]),
  body select, body textarea {
    background-color: rgba(255,255,255,.10) !important;
    border: 1px solid rgba(255,255,255,.22) !important;
    color: #FFFFFF !important;
  }
  body select option, body select optgroup { background: #FFFFFF; color: #1A1917; }
  body input::placeholder, body textarea::placeholder { color: #B7B0A7 !important; }
  body input:focus, body select:focus, body textarea:focus {
    border-color: rgba(var(--tone-rgb,210,81,31),.9) !important;
    background-color: rgba(255,255,255,.15) !important;
  }
  body input:disabled, body select:disabled, body textarea:disabled {
    color: #CFC9C1 !important; opacity: 1 !important;
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <a href="/" class="homelink" title="포털 홈으로"><img src="/logo.png" alt="Youngnak"></a>
    <h1>회의록 · 할 일</h1>
    <p class="meta">YNTORONTO &nbsp;·&nbsp; MINUTES</p>
  </header>
  <div id="root"><div class="panel"><i class="skel line" style="width:60%;"></i><i class="skel line" style="width:40%;"></i></div></div>
  <footer></footer>
</div>
<!--#include Theme-->
<script>
var P = window.__PREFILL__ || {};
var TOKEN = P.t || '';
var D = null;          // 목록 자료
var M = null;          // 지금 열어 본 회의록
var TAB = 'list';
var ALLDOC = false;
var AI_RESULT = null, AI_BUSY = false, AI_ERR = '';   // Gemini 요약 · 할일 추출
var SECTIONS = null, SEC_PICKED = '', SEC_BUSY = false, SEC_RESULT = null, SEC_ERR = '';   // 문서 안 날짜별 구간 골라 요약

function el(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function jsq(s) { return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
function say(id, t, k) { var m = el(id); if (m) { m.className = 'msg' + (k ? ' ' + k : ''); m.textContent = t || ''; } }
function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function 월일(s) { var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? (+m[2]) + '월 ' + (+m[3]) + '일' : (s || ''); }
function 날수(a, b) { return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000); }

function boot() {
  if (!TOKEN) {
    el('root').innerHTML = '<div class="panel"><p class="msg err">포털에서 “회의록 · 할 일” 로 들어와 주세요.</p>' +
      '<a class="btn full" href="/">포털로 가기</a></div>';
    return;
  }
  load(function () { if (P.id) openMeet(P.id); else draw(); });
}

function load(then) {
  callServer('minutesList', [TOKEN], function (r) { D = r; (then || draw)(); }, function (e) {
    el('root').innerHTML = '<div class="panel"><p class="msg err">' + esc(e.message || e) + '</p>' +
      '<a class="btn full" href="/">포털로 가기</a></div>';
  });
}

/* ============ 첫 화면 ============ */

function draw() {
  M = null;
  if (!D.canEdit) return drawMine();

  var h = '<div class="mtabs">' +
    '<button class="' + (TAB === 'list' ? 'on' : '') + '" onclick="go(\'list\')">회의록</button>' +
    '<button class="' + (TAB === 'mine' ? 'on' : '') + '" onclick="go(\'mine\')">내 할 일' +
      ((D.mine || []).length ? ' (' + D.mine.length + ')' : '') + '</button>' +
    '</div>';

  if (TAB === 'mine') {
    h += '<div class="panel">' + mineHtml() + '</div>';
    el('root').innerHTML = h;
    return;
  }

  var myTeams = D.myTeams || [];
  h += '<div class="panel">' +
    '<span class="chip">회의록 등록</span>' +
    '<p class="hint">구글 문서 주소를 붙여 넣으면 본문을 그대로 읽어 오고, ' +
      '문서 안의 할 일을 찾아 담당자에게 보내 드립니다.</p>' +
    '<label class="fl">구글 문서 주소</label>' +
    '<input type="text" id="aUrl" placeholder="https://docs.google.com/document/d/...">' +
    '<div class="trow" style="margin-top:8px;">' +
      '<div><label class="fl">제목 (비우면 문서 제목)</label><input type="text" id="aTitle" placeholder="9월 커미티 회의"></div>' +
      '<div><label class="fl">회의 날짜</label><input type="date" id="aDate" value="' + today() + '"></div>' +
    '</div>' +
    (myTeams.length > 1 || D.committee
      ? '<label class="fl" style="margin-top:8px;">사역팀' + (D.committee ? ' (비우면 커미티 공용)' : '') + '</label>' +
        '<select id="aTeam">' +
          (D.committee ? '<option value="">— 커미티 공용 —</option>' : '') +
          myTeams.map(function (t) { return '<option value="' + esc(t) + '">' + esc(t) + '</option>'; }).join('') +
        '</select>'
      : (myTeams.length === 1 ? '<input type="hidden" id="aTeam" value="' + esc(myTeams[0]) + '">' : '')) +
    '<button class="btn accent full" style="margin-top:10px;" onclick="addMeet()">등록하고 할 일 뽑기</button>' +
    '<p class="msg" id="aMsg"></p>' +
    '<p class="guide" style="margin-top:12px;">' +
      '<b style="color:#fff;">문서에서 이렇게 적어 주시면 자동으로 찾습니다</b><br>' +
      '· 네모칸으로 시작하는 줄 — <code>[ ] 김현세 주보 정리 (9/30)</code><br>' +
      '· <code>할 일</code> · <code>액션 아이템</code> · <code>TODO</code> 제목 아래의 목록 줄<br>' +
      '· 이름은 교적에 있는 이름으로, 날짜는 <code>9/30</code> · <code>9월 30일</code> · <code>다음 주</code> 모두 알아듣습니다' +
    '</p>' +
    '</div>';

  h += '<div class="panel"><span class="chip">올라온 회의록</span>';
  if (D.committee) h += '<p class="hint">커미티는 모든 팀의 회의록을 볼 수 있습니다.</p>';
  if (!D.list.length) h += '<p class="empty">아직 등록된 회의록이 없습니다.</p>';
  else {
    h += '<div class="mlist">';
    D.list.forEach(function (m) {
      h += '<button class="mitem" onclick="openMeet(\'' + jsq(m.id) + '\')">' +
        '<span class="mi">📝</span>' +
        '<span class="mb"><b>' + esc(m.title) + '</b>' +
          '<span>' + esc(월일(m.date)) + (m.by ? ' · ' + esc(m.by) : '') +
            ' · 할 일 ' + m.tasks + '건' + (D.committee ? ' · ' + esc(m.team || '커미티 공용') : '') + '</span></span>' +
        (m.open ? '<span class="mn hot">남은 ' + m.open + '</span>' : '<span class="mn">완료</span>') +
        '</button>';
    });
    h += '</div>';
  }
  h += '</div>';
  el('root').innerHTML = h;
}

function go(t) { TAB = t; draw(); window.scrollTo(0, 0); }

function drawMine() {
  el('root').innerHTML = '<div class="panel"><span class="chip">내 할 일</span>' +
    '<p class="hint">회의에서 맡으신 일입니다. 다 하셨으면 왼쪽 네모를 눌러주세요.</p>' +
    mineHtml() + '</div>' +
    '<div class="panel"><a class="btn full" href="/">포털로 돌아가기</a></div>';
}

function mineHtml() {
  var list = D.mine || [];
  if (!list.length) return '<p class="empty">맡으신 할 일이 없습니다. 👏</p>';
  var h = '<div class="tlist">';
  list.forEach(function (t) { h += taskHtml(t, true); });
  return h + '</div>';
}

/* ============ 회의록 한 편 ============ */

function openMeet(id) {
  el('root').innerHTML = '<div class="panel"><i class="skel line" style="width:50%;"></i><i class="skel line"></i></div>';
  window.scrollTo(0, 0);
  AI_RESULT = null; AI_BUSY = false; AI_ERR = '';
  SECTIONS = null; SEC_PICKED = ''; SEC_BUSY = false; SEC_RESULT = null; SEC_ERR = '';
  callServer('minutesOpen', [TOKEN, id], function (r) { M = r; ALLDOC = false; paint(); }, function (e) {
    el('root').innerHTML = '<div class="panel"><p class="msg err">' + esc(e.message || e) + '</p>' +
      '<button class="btn full" onclick="load()">목록으로</button></div>';
  });
}

function paint() {
  var m = M.meet;
  var h = '<div class="mtop">' +
    '<button class="btn mini back" onclick="load()">‹ 목록</button><span class="sp"></span>' +
    (M.canEdit ? '<button class="btn mini" onclick="syncMeet()">문서 다시 읽기</button>' : '') +
    '<a class="btn mini" href="' + esc(m.docUrl) + '" target="_blank" rel="noopener">구글 문서 열기</a>' +
    '</div>';

  h += '<div class="panel">' +
    '<span class="chip">' + esc(m.title) + '</span>' +
    '<p class="hint">' + esc(월일(m.date)) + (m.by ? ' · ' + esc(m.by) + ' 등록' : '') +
      (M.committee && m.team ? ' · <b style="color:#fff;">' + esc(m.team) + '</b>' : '') +
      (m.read ? ' · 마지막 읽음 ' + esc(m.read) : '') + '</p>' +
    '<p class="msg" id="sMsg"></p>';

  if (M.err) {
    h += '<p class="msg err">' + esc(M.err) + '</p>' +
      '<p class="guide">구글 문서에서 <b style="color:#fff;">공유 → 링크가 있는 모든 사용자(뷰어)</b> 로 바꾸시거나, ' +
      '이 시스템이 쓰는 구글 계정을 뷰어로 넣어 주세요.</p>';
  } else if (!M.html) {
    h += '<p class="empty">문서에 내용이 없습니다.</p>';
  } else {
    h += '<div class="docwrap' + (ALLDOC ? ' all' : '') + '" id="docWrap"><div class="doc">' + M.html + '</div></div>' +
      (ALLDOC ? '' : '<button class="btn morebtn" onclick="ALLDOC=true;paint();">본문 전체 보기 ▾</button>');
  }
  h += '</div>';

  /* Gemini 요약 · 할일 추출 (커미티만) */
  if (M.canEdit) h += '<div class="panel">' + aiCardHtml() + '</div>';
  if (M.canEdit) h += '<div class="panel">' + sectionCardHtml() + '</div>';

  /* 할 일 */
  h += '<div class="panel"><span class="chip">이 회의의 할 일</span>';
  if (!M.tasks.length) h += '<p class="empty">뽑아낸 할 일이 없습니다. 아래에서 직접 넣으실 수 있습니다.</p>';
  else {
    h += '<div class="tlist">';
    M.tasks.forEach(function (t) { h += taskHtml(t, false); });
    h += '</div>';
  }

  if (M.canEdit) {
    h += '<div class="addbox"><span class="chip">할 일 넣기</span>' +
      '<div class="trow one"><div><label class="fl">할 일</label>' +
        '<input type="text" id="nWhat" placeholder="예) 수련회 장소 예약 확인"></div></div>' +
      '<div class="trow">' +
        '<div><label class="fl">담당자</label>' + peopleSel('nWho', '') + '</div>' +
        '<div><label class="fl">마감일</label><input type="date" id="nDue"></div>' +
      '</div>' +
      '<button class="btn accent full" style="margin-top:8px;" onclick="addTask()">넣기</button>' +
      '<p class="msg" id="nMsg"></p></div>';
  }
  h += '</div>';

  if (M.canEdit) {
    h += '<div class="panel"><span class="chip">회의록 관리</span>' +
      '<div class="trow"><div><label class="fl">제목</label><input type="text" id="eTitle" value="' + esc(m.title) + '"></div>' +
      '<div><label class="fl">회의 날짜</label><input type="date" id="eDate" value="' + esc(m.date) + '"></div></div>' +
      '<button class="btn full" style="margin-top:8px;" onclick="editMeet()">고치기</button>' +
      '<button class="btn danger full" style="margin-top:7px;" onclick="dropMeet()">이 회의록 지우기</button>' +
      '<p class="msg" id="eMsg"></p></div>';
  }

  el('root').innerHTML = h;
}

function peopleSel(id, cur) {
  var h = '<select id="' + id + '"><option value="">담당자 없음</option>';
  ((M && M.people) || []).forEach(function (n) {
    h += '<option value="' + esc(n) + '"' + (n === cur ? ' selected' : '') + '>' + esc(n) + '</option>';
  });
  return h + '</select>';
}

function taskHtml(t, mine) {
  var tg = '';
  if (t.who) tg += '<span class="tg who">' + esc(t.who) + '</span>';
  else tg += '<span class="tg none">담당자 없음</span>';
  if (t.due) {
    var d = 날수(today(), t.due);
    var cls = d < 0 ? 'late' : (d <= 3 ? 'soon' : '');
    var txt = d < 0 ? (월일(t.due) + ' · ' + (-d) + '일 지남') : (d === 0 ? '오늘까지' : (월일(t.due) + ' · ' + d + '일 남음'));
    tg += '<span class="tg ' + cls + '">' + esc(txt) + '</span>';
  }
  if (mine && t.meetTitle) tg += '<span class="tg none">' + esc(t.meetTitle) + '</span>';

  return '<div class="titem' + (t.done ? ' done' : '') + '">' +
    '<button class="ck" onclick="toggleTask(\'' + jsq(t.id) + '\',' + (t.done ? 'false' : 'true') + ')" ' +
      'title="' + (t.done ? '아직이에요' : '다 했어요') + '">' + (t.done ? '✓' : '') + '</button>' +
    '<div class="tb"><b>' + esc(t.what) + '</b><div class="tm">' + tg + '</div></div>' +
    ((M && M.canEdit && !mine) ? '<button class="tx" onclick="dropTask(\'' + jsq(t.id) + '\')" title="지우기">×</button>' : '') +
    '</div>';
}

/* ============ 움직이는 부분 ============ */

function addMeet() {
  var url = el('aUrl').value.trim();
  if (!url) { say('aMsg', '구글 문서 주소를 넣어주세요.', 'err'); return; }
  say('aMsg', '문서를 읽는 중입니다…');
  var teamEl = el('aTeam');
  callServer('minutesAdd', [TOKEN, { url: url, title: el('aTitle').value.trim(), date: el('aDate').value, team: teamEl ? teamEl.value : '' }],
    function (r) {
      say('aMsg', '등록했습니다. 할 일 ' + (r.found || 0) + '건을 찾았습니다.', 'ok');
      load(function () { openMeet(r.id); });
    },
    function (e) { say('aMsg', e.message || e, 'err'); });
}

function syncMeet() {
  say('sMsg', '문서를 다시 읽는 중입니다…');
  callServer('minutesSync', [TOKEN, M.meet.id], function (r) {
    say('sMsg', r.added ? ('할 일 ' + r.added + '건을 새로 찾았습니다.') : '새로 찾은 할 일은 없습니다.', 'ok');
    openMeet(M.meet.id);
  }, function (e) { say('sMsg', e.message || e, 'err'); });
}

/* ---------- Gemini 요약 · 할일 추출 ---------- */

function aiCardHtml() {
  if (AI_BUSY) {
    return '<span class="chip">✨ Gemini 요약 · 할 일</span>' +
      '<p class="hint">문서를 분석하는 중입니다… 잠시만 기다려 주세요.</p>' +
      '<i class="skel line" style="width:70%;"></i><i class="skel line" style="width:45%;"></i>';
  }
  if (!AI_RESULT) {
    return '<span class="chip">✨ Gemini 요약 · 할 일</span>' +
      '<p class="hint">회의록 본문을 Gemini 로 분석해 핵심 요약과 할 일(담당자 · 기한)을 뽑아 봅니다.</p>' +
      (AI_ERR ? '<p class="msg err">' + esc(AI_ERR) + '</p>' : '') +
      '<button class="btn accent full" onclick="aiAnalyzeMeet()">Gemini 요약 &amp; 할일 추출</button>';
  }
  var lines = String(AI_RESULT.summary || '').split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
  var sumHtml = lines.length ? lines.map(function (l) { return '<p>' + esc(l) + '</p>'; }).join('')
    : '<p class="empty" style="margin:0;">요약할 내용이 없습니다.</p>';
  var items = AI_RESULT.actionItems || [];
  var itemsHtml = items.length
    ? '<div class="aitlist">' + items.map(function (t, i) {
        return '<div class="aitask">' +
          '<div class="ab"><b>' + esc(t.what) + '</b><div class="tm">' +
            (t.who ? '<span class="tg who">' + esc(t.who) + '</span>' : '<span class="tg none">담당자 없음</span>') +
            (t.due ? '<span class="tg">' + esc(월일(t.due)) + '</span>' : '') +
          '</div></div>' +
          '<button class="btn mini" onclick="addAiTask(' + i + ')">할 일에 담기</button>' +
        '</div>';
      }).join('') + '</div>'
    : '<p class="empty">뽑아낸 할 일이 없습니다.</p>';
  return '<span class="chip">✨ Gemini 요약 · 할 일</span>' +
    '<div class="ai-summary">' + sumHtml + '</div>' +
    '<p class="hint" style="margin-top:10px;">Gemini 가 찾은 할 일 — 마음에 드는 것만 눌러서 위 "이 회의의 할 일" 목록에 담으세요.</p>' +
    itemsHtml +
    '<button class="btn mini" style="margin-top:10px;" onclick="aiAnalyzeMeet()">다시 분석하기</button>';
}

function aiAnalyzeMeet() {
  AI_BUSY = true; AI_ERR = ''; paint();
  callServer('minutesAiAnalyze', [TOKEN, M.meet.id], function (r) {
    AI_BUSY = false; AI_RESULT = r; paint();
  }, function (e) {
    AI_BUSY = false; AI_ERR = e.message || String(e); paint();
  });
}

/** Gemini 가 찾은 할 일 하나를 실제 "이 회의의 할 일" 목록에 저장합니다 */
function addAiTask(i) {
  var t = AI_RESULT && AI_RESULT.actionItems && AI_RESULT.actionItems[i];
  if (!t) return;
  callServer('minutesTaskSave', [TOKEN, { meet: M.meet.id, what: t.what, who: t.who, due: t.due }], function () {
    AI_RESULT.actionItems.splice(i, 1);
    // 위쪽 "이 회의의 할 일" 목록도 새로 고치되, Gemini 결과 카드는 그대로 둡니다
    callServer('minutesOpen', [TOKEN, M.meet.id], function (r) { M = r; paint(); }, function () { paint(); });
  }, function (e) { alert(e.message || e); });
}

/* ---------- 문서 안 날짜별 구간만 골라서 요약 ---------- */

function sectionCardHtml() {
  var h = '<span class="chip">📅 날짜 구간만 골라 요약</span>' +
    '<p class="hint">한 문서에 여러 날짜의 회의가 이어져 있으면, 날짜 줄을 찾아 원하는 구간만 불렛포인트로 정리해 드립니다.</p>';

  if (!SECTIONS) {
    h += (SEC_ERR ? '<p class="msg err">' + esc(SEC_ERR) + '</p>' : '') +
      '<button class="btn full" onclick="loadSections()"' + (SEC_BUSY ? ' disabled' : '') + '>' +
      (SEC_BUSY ? '찾는 중…' : '문서에서 날짜 구간 찾기') + '</button>';
    return h;
  }
  if (!SECTIONS.length) {
    h += '<p class="empty">날짜로 보이는 줄을 찾지 못했습니다. (예: "9/1 회의록", "2026-09-01")</p>' +
      '<button class="btn mini" onclick="SECTIONS=null;paint();">다시 찾기</button>';
    return h;
  }

  h += '<div class="addrow">' +
    '<select id="secPick" style="flex:1;">' +
      SECTIONS.map(function (s) { return '<option value="' + esc(s.label) + '"' + (s.label === SEC_PICKED ? ' selected' : '') + '>' +
        esc(s.label) + ' (' + s.chars + '자)</option>'; }).join('') +
    '</select>' +
    '<button class="btn accent" onclick="analyzeSection()"' + (SEC_BUSY ? ' disabled' : '') + '>' + (SEC_BUSY ? '분석 중…' : '이 구간 요약') + '</button>' +
  '</div>';

  if (SEC_ERR) h += '<p class="msg err">' + esc(SEC_ERR) + '</p>';

  if (SEC_RESULT) {
    var bl = (SEC_RESULT.bullets || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('');
    var items = SEC_RESULT.actionItems || [];
    var itemsHtml = items.length
      ? '<div class="aitlist">' + items.map(function (t, i) {
          return '<div class="aitask">' +
            '<div class="ab"><b>' + esc(t.what) + '</b><div class="tm">' +
              (t.who ? '<span class="tg who">' + esc(t.who) + '</span>' : '<span class="tg none">담당자 없음</span>') +
              (t.due ? '<span class="tg">' + esc(월일(t.due)) + '</span>' : '') +
            '</div></div>' +
            '<button class="btn mini" onclick="addSecTask(' + i + ')">할 일에 담기</button>' +
          '</div>';
        }).join('') + '</div>'
      : '';
    h += '<div class="ai-summary" style="margin-top:12px;"><p class="k" style="font-weight:800;margin:0 0 6px;">' +
      esc(SEC_RESULT.label) + '</p><ul style="margin:0 0 4px 18px;padding:0;">' + bl + '</ul></div>' + itemsHtml;
  }
  return h;
}

function loadSections() {
  SEC_BUSY = true; SEC_ERR = ''; paint();
  callServer('minutesSections', [TOKEN, M.meet.id], function (r) {
    SEC_BUSY = false; SECTIONS = r.sections || []; SEC_PICKED = SECTIONS.length ? SECTIONS[0].label : ''; paint();
  }, function (e) { SEC_BUSY = false; SEC_ERR = e.message || String(e); paint(); });
}

function analyzeSection() {
  var label = el('secPick') ? el('secPick').value : SEC_PICKED;
  SEC_PICKED = label; SEC_BUSY = true; SEC_ERR = ''; SEC_RESULT = null; paint();
  callServer('minutesAiAnalyzeDate', [TOKEN, M.meet.id, label], function (r) {
    SEC_BUSY = false; SEC_RESULT = r; paint();
  }, function (e) { SEC_BUSY = false; SEC_ERR = e.message || String(e); paint(); });
}

function addSecTask(i) {
  var t = SEC_RESULT && SEC_RESULT.actionItems && SEC_RESULT.actionItems[i];
  if (!t) return;
  callServer('minutesTaskSave', [TOKEN, { meet: M.meet.id, what: t.what, who: t.who, due: t.due }], function () {
    SEC_RESULT.actionItems.splice(i, 1);
    callServer('minutesOpen', [TOKEN, M.meet.id], function (r) { M = r; paint(); }, function () { paint(); });
  }, function (e) { alert(e.message || e); });
}

function editMeet() {
  callServer('minutesEdit', [TOKEN, M.meet.id, { title: el('eTitle').value.trim(), date: el('eDate').value }],
    function () { say('eMsg', '고쳤습니다.', 'ok'); openMeet(M.meet.id); },
    function (e) { say('eMsg', e.message || e, 'err'); });
}

function dropMeet() {
  if (!confirm('이 회의록과 딸린 할 일을 모두 지울까요?')) return;
  callServer('minutesDelete', [TOKEN, M.meet.id], function () { load(); },
    function (e) { say('eMsg', e.message || e, 'err'); });
}

function addTask() {
  var what = el('nWhat').value.trim();
  if (!what) { say('nMsg', '할 일을 적어주세요.', 'err'); return; }
  callServer('minutesTaskSave', [TOKEN, { meet: M.meet.id, what: what, who: el('nWho').value, due: el('nDue').value }],
    function () { openMeet(M.meet.id); },
    function (e) { say('nMsg', e.message || e, 'err'); });
}

function toggleTask(id, done) {
  callServer('minutesTaskDone', [TOKEN, id, done], function () {
    if (M) openMeet(M.meet.id); else load();
  }, function (e) { alert(e.message || e); });
}

function dropTask(id) {
  if (!confirm('이 할 일을 지울까요?')) return;
  callServer('minutesTaskDelete', [TOKEN, id], function () { openMeet(M.meet.id); },
    function (e) { alert(e.message || e); });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
</body>
</html>
